# cargo-deny policy. Enforces R-DEP-001, R-DEP-002, R-DEP-005 (docs/RULES.md).

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"   # becomes "deny" at M1 (R-DEP-005)
wildcards = "deny"
# R-DEP-002 / ADR-0003: no FFmpeg or bundled C media frameworks.
deny = [
    { name = "ffmpeg-next", reason = "R-DEP-002" },
    { name = "ffmpeg-sys-next", reason = "R-DEP-002" },
    { name = "ffmpeg-sys", reason = "R-DEP-002" },
    { name = "rsmpeg", reason = "R-DEP-002" },
    { name = "rusty_ffmpeg", reason = "R-DEP-002" },
    { name = "gstreamer", reason = "R-DEP-002" },
    { name = "gstreamer-sys", reason = "R-DEP-002" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
