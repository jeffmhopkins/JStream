# cargo-deny policy. Enforces R-DEP-001, R-DEP-002, R-DEP-005, R-RS-003 (docs/RULES.md).
# Editing this file is a governance change (R-GOV-001).

[advisories]
version = 2
yanked = "deny"
# Every `ignore` entry needs a RUSTSEC id, a reason and an expiry milestone; adding one is a governance change.
ignore = [
    # `paste` is archived; Leptos 0.8 reaches it through `either_of` and `tachys`, at build
    # time only (a proc-macro). Expires at the M2 exit: by then Leptos has dropped it, or
    # jstream-ui moves to a Leptos release that has (ADR-0045).
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; a build-time proc-macro under Leptos 0.8 (jstream-ui). Expires: M2 exit" },
    # `proc-macro-error` is unmaintained; gtk-rs 0.18's `gtk3-macros` uses it. It is in the
    # graph only through Tauri's Linux webview (WebKitGTK); jstream-desktop depends on Tauri
    # on Windows only, so it is never built. Expires at the M2 exit, or when the desktop app
    # targets Linux, whichever comes first.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained; Linux-only under Tauri's gtk3-macros, never built (jstream-desktop uses Tauri on Windows only). Expires: M2 exit or a Linux desktop build" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]
# BSD-1-Clause is BSD-2-Clause without the binary-redistribution clause, so it is
# permissive (R-DEP-001). Allowed for this one test-only crate, which R-RT-001 names.
# cargo-deny filters workspace dev-dependencies out of its graph today, so it reports
# this entry as not encountered; it records the decision for when that changes.
# BSL-1.0 (Boost) is permissive in the same way as MIT (R-DEP-001): keep the notice in
# source distributions, nothing for binaries. Allowed for this one crate, a hash that
# Leptos's `server_fn` always depends on. A license decision is the maintainer's
# (ADR-0043); this entry rests on his decision on PR #250.
# bzip2-1.0.6 (a BSD-style notice-only licence) and CDLA-Permissive-2.0 (permissive,
# for data: the Mozilla root certificates) are build-time only: `cef-dll-sys`'s build
# script downloads and unpacks CEF with `download-cef`, which reaches `libbz2-rs-sys`
# through `bzip2` and `webpki-roots` through `ureq`. Neither is linked into any JStream
# binary, and neither is in the graph unless the `cef` feature of jstream-browser is on
# (ADR-0046). A license decision is the maintainer's (ADR-0043); these two entries wait
# on his decision on the browser source's PR (C8).
exceptions = [
    { crate = "assert_no_alloc", allow = ["BSD-1-Clause"] },
    { crate = "xxhash-rust", allow = ["BSL-1.0"] },
    { crate = "libbz2-rs-sys", allow = ["bzip2-1.0.6"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "deny"   # R-DEP-005: every duplicate needs a `skip` entry below
wildcards = "deny"
allow-wildcard-paths = true  # workspace path deps; all members are publish = false
# R-DEP-005: duplicates we can't remove yet. Each entry names the older version and the
# crate that pins it. Remove an entry when its pin moves; cargo-deny warns on unused skips.
# Adding one is a governance change (R-GOV-001).
skip = [
    { crate = "miniz_oxide@0.8.9", reason = "png 0.18 uses miniz_oxide 0.8 directly and 0.9 through flate2" },
    { crate = "cpufeatures@0.2.17", reason = "sha1 0.10 (axum and tungstenite WebSocket handshake) uses 0.2; blake3 uses 0.3" },
    { crate = "getrandom@0.2.17", reason = "ring 0.17 (rustls provider, R-DEP-006) uses getrandom 0.2" },
    { crate = "getrandom@0.3.4", reason = "rand_core 0.9 (tungstenite's rand) uses 0.3, and the daemon matches it on purpose; tempfile uses 0.4" },
    { crate = "libloading@0.8.9", reason = "ash 0.38 under wgpu-hal, which is pinned exactly (ADR-0004); cef 154 (jstream-browser, feature `cef`) uses 0.9" },
    { crate = "hashbrown@0.16.1", reason = "gpu-allocator 0.28 under wgpu-hal, which is pinned exactly (ADR-0004)" },
    { crate = "syn@2.0.119", reason = "windows-implement/windows-interface (windows-core 0.62, pinned exactly) and zerocopy-derive still use syn 2" },
    { crate = "windows-sys@0.52.0", reason = "ring 0.17 (rustls provider, R-DEP-006) uses windows-sys 0.52" },
    # Leptos 0.8 (jstream-ui, ADR-0045).
    { crate = "convert_case@0.6.0", reason = "config 0.15 (leptos_config) uses 0.6; leptos_macro uses 0.11" },
    { crate = "r-efi@5.3.0", reason = "getrandom 0.3 uses r-efi 5; getrandom 0.4 (uuid under leptos_macro) uses 6" },
    { crate = "rustc-hash@1.1.0", reason = "naga 30 (wgpu, pinned exactly by ADR-0004) uses 1; Leptos uses 2" },
    { crate = "thiserror@1.0.69", reason = "gloo-net 0.6 (server_fn under Leptos 0.8) uses thiserror 1" },
    { crate = "thiserror-impl@1.0.69", reason = "thiserror 1, for gloo-net 0.6 under Leptos 0.8" },
    # Tauri 2 (jstream-desktop, ADR-0045), which it depends on for Windows only. cargo-deny
    # checks every platform's graph, so most of these come from Tauri's dependencies for
    # other platforms or from its build-time code generation; the notes say which.
    # Among these pairs, only base64 0.22 and 0.23 both reach the Windows app binary.
    { crate = "base64@0.21.7", reason = "swift-rs 1 (macOS only, under Tauri) uses 0.21; never built for Windows" },
    { crate = "base64@0.22.1", reason = "axum 0.8 and wry 0.57 use 0.22; tauri-codegen and serde_with use 0.23" },
    { crate = "bit-set@0.8.0", reason = "dom_query 0.28 (tauri-codegen's HTML handling, build time) uses 0.8; wgpu uses 0.10" },
    { crate = "bit-vec@0.8.0", reason = "bit-set 0.8, for dom_query under tauri-codegen (build time)" },
    { crate = "bitflags@1.3.2", reason = "png 0.17 (ico, under tauri-codegen at build time) and webkit2gtk (Linux only) use bitflags 1" },
    { crate = "hashbrown@0.12.3", reason = "indexmap 1, for schemars 0.8 under tauri-build and tauri-utils (build time)" },
    { crate = "heck@0.4.1", reason = "glib-macros 0.18 (gtk-rs, Linux only under Tauri) uses 0.4; Tauri uses 0.5" },
    { crate = "indexmap@1.9.3", reason = "schemars 0.8 (tauri-build and tauri-utils, build time) and serde_with use indexmap 1" },
    { crate = "png@0.17.16", reason = "ico 0.5 (tauri-codegen's icon handling, build time) uses png 0.17; the engine uses 0.18" },
    { crate = "proc-macro-crate@1.3.1", reason = "gtk3-macros 0.18 (Linux only under Tauri) uses 1" },
    { crate = "proc-macro-crate@2.0.2", reason = "glib-macros 0.18 (Linux only under Tauri) uses 2; num_enum_derive uses 3" },
    { crate = "schemars@0.8.22", reason = "tauri-build and tauri-utils (build time: ACL schemas) use schemars 0.8; the protocol uses 1" },
    { crate = "schemars_derive@0.8.22", reason = "schemars 0.8, for tauri-build and tauri-utils (build time)" },
    { crate = "serde_derive_internals@0.29.1", reason = "schemars_derive 0.8, for tauri-build and tauri-utils (build time)" },
    { crate = "serde_spanned@0.6.9", reason = "toml 0.8 and toml_edit 0.20, for system-deps and proc-macro-crate (gtk-rs builds, Linux only)" },
    { crate = "syn@1.0.109", reason = "proc-macro-error (gtk3-macros, Linux only under Tauri) uses syn 1" },
    { crate = "toml@0.8.2", reason = "system-deps 6 (gtk-rs -sys builds, Linux only under Tauri) uses toml 0.8" },
    { crate = "toml_datetime@0.6.3", reason = "toml 0.8 and toml_edit 0.19/0.20 (gtk-rs builds, Linux only under Tauri)" },
    { crate = "toml_edit@0.19.15", reason = "proc-macro-crate 1 (gtk3-macros, Linux only under Tauri)" },
    { crate = "toml_edit@0.20.2", reason = "proc-macro-crate 2 and toml 0.8 (gtk-rs, Linux only under Tauri)" },
    { crate = "winnow@0.5.40", reason = "toml_edit 0.19/0.20 (gtk-rs builds, Linux only under Tauri)" },
    { crate = "windows-sys@0.45.0", reason = "jni 0.21 (Android only, under Tauri's tao and wry) uses windows-sys 0.45; never built" },
    { crate = "windows-targets@0.42.2", reason = "windows-sys 0.45, for jni (Android only, under Tauri)" },
    { crate = "windows_aarch64_gnullvm@0.42.2", reason = "windows-targets 0.42, for jni (Android only, under Tauri)" },
    { crate = "windows_aarch64_msvc@0.42.2", reason = "windows-targets 0.42, for jni (Android only, under Tauri)" },
    { crate = "windows_i686_gnu@0.42.2", reason = "windows-targets 0.42, for jni (Android only, under Tauri)" },
    { crate = "windows_i686_msvc@0.42.2", reason = "windows-targets 0.42, for jni (Android only, under Tauri)" },
    { crate = "windows_x86_64_gnu@0.42.2", reason = "windows-targets 0.42, for jni (Android only, under Tauri)" },
    { crate = "windows_x86_64_gnullvm@0.42.2", reason = "windows-targets 0.42, for jni (Android only, under Tauri)" },
    { crate = "windows_x86_64_msvc@0.42.2", reason = "windows-targets 0.42, for jni (Android only, under Tauri)" },
]
deny = [
    # R-DEP-002 / ADR-0031: no FFmpeg, GStreamer or bundled C codec libraries.
    # Name lists are incomplete by nature; xtask lint-deps also checks `links =` crates.
    { crate = "ffmpeg-next", reason = "R-DEP-002" },
    { crate = "ffmpeg-sys-next", reason = "R-DEP-002" },
    { crate = "ffmpeg-the-third", reason = "R-DEP-002" },
    { crate = "ffmpeg-sidecar", reason = "R-DEP-002" },
    { crate = "rsmpeg", reason = "R-DEP-002" },
    { crate = "rusty_ffmpeg", reason = "R-DEP-002" },
    { crate = "gstreamer", reason = "R-DEP-002" },
    { crate = "gstreamer-sys", reason = "R-DEP-002" },
    { crate = "openh264", reason = "R-DEP-002" },
    { crate = "openh264-sys2", reason = "R-DEP-002" },
    { crate = "fdk-aac", reason = "R-DEP-002" },
    { crate = "fdk-aac-sys", reason = "R-DEP-002" },
    { crate = "x264", reason = "R-DEP-002" },
    { crate = "x264-sys", reason = "R-DEP-002" },
    # R-DEP-006: rustls with the ring provider.
    { crate = "aws-lc-sys", reason = "R-DEP-006" },
    # R-RS-003: anyhow only in apps and xtask. `leptos_hot_reload` is a dependency of Leptos
    # (jstream-ui, ADR-0045) that uses it internally; no JStream error type is an anyhow one.
    # `tauri`, `tauri-build` and `tauri-utils` (jstream-desktop) use it internally the same way.
    # `cef-dll-sys` (jstream-browser, feature `cef`) uses it in its build script only.
    { crate = "anyhow", wrappers = ["jstream-desktop", "jstream-daemon", "jstream-cli", "xtask", "leptos_hot_reload", "tauri", "tauri-build", "tauri-utils", "cef-dll-sys"], reason = "R-RS-003" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
