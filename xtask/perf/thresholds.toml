# Limits for `cargo xtask perf --check` (xtask/perf/README.md#thresholds).
#
# These are software-rendering bars: lavapipe on a 4-core Linux container, recording
# with OpenH264, where a 1080p blur, glow or shadow costs tens to hundreds of
# milliseconds (#1070). They catch a scene that stops drawing, a large regression and a
# leak. They are not the hardware bar: `jstream bench` (#1220) holds that.

# Every scene's row, unless its own table below says otherwise.
[default]
min_fps = 15
max_frame_ms = 60
max_over_budget_pct = 50

# Growth allowed across a churn scene's cycles (from the first to the last), and, for
# threads and handles, across the whole run (the base scene first and last). RSS isn't
# judged run-wide: the allocator keeps what a heavy scene used.
[leak]
max_rss_growth_mb = 64
max_thread_growth = 4
max_handle_growth = 16

# Scenes slow on software rendering: they must still draw.
[scene.models_12]
min_fps = 3
max_frame_ms = 400
max_over_budget_pct = 100

[scene.vf_blur]
min_fps = 3
max_frame_ms = 400
max_over_budget_pct = 100

[scene.vf_chroma_key]
min_fps = 3
max_frame_ms = 400
max_over_budget_pct = 100

[scene.vf_drop_shadow]
min_fps = 3
max_frame_ms = 400
max_over_budget_pct = 100

[scene.vf_glow]
min_fps = 3
max_frame_ms = 400
max_over_budget_pct = 100

[scene.vf_outline]
min_fps = 3
max_frame_ms = 400
max_over_budget_pct = 100

[scene.vf_scroll]
min_fps = 3
max_frame_ms = 400
max_over_budget_pct = 100

[scene.vf_sharpen]
min_fps = 3
max_frame_ms = 400
max_over_budget_pct = 100

[scene.effects_many]
min_fps = 2
max_frame_ms = 600
max_over_budget_pct = 100

[scene.nested_deep]
max_over_budget_pct = 100

# Scenes that draw near the frame budget on a 4-CPU GitHub runner (about 35-45 ms a
# frame at 30 fps): most of their frames land just over budget, so only the frame rate
# and mean frame time judge them.
[scene.vf_color_correction]
max_over_budget_pct = 100

[scene.vf_apply_lut]
max_over_budget_pct = 100

[scene.vf_scene_mask]
max_over_budget_pct = 100

[scene.scene_chain]
max_over_budget_pct = 100
