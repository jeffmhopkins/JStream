[package]
name = "jstream-cli"
version = "0.0.0"
description = "The JStream command-line client: drives an engine through the Control trait."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.jstream]
layer = 6
summary = "`jstream-cli` (control and mcp only; test-only dev-dependencies, such as server for its end-to-end test, are outside this)"
unsafe_allowed = false

[lints]
workspace = true

[features]
# `--mock`: run against jstream-control's in-memory engine instead of a real one over
# `--url`. Off by default, so a release binary doesn't carry the mock; without it
# `--mock` is a usage error.
mock = ["jstream-control/mock"]

[dependencies]
# `ws`: the WebSocket client that `--url` connects with.
jstream-control = { workspace = true, features = ["ws"] }
# `jstream-cli mcp`: the MCP server it serves on stdio over the CLI's session.
jstream-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The unit tests drive whole runs against a `MockEngine` they populate themselves.
jstream-control = { workspace = true, features = ["mock"] }
# `tests/mcp.rs`: the binary's `mcp` against a real `jstream-server` on a loopback port,
# serving a `MockEngine` on a tokio runtime the test owns.
jstream-server.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }

# Runs the binary with `--mock`.
[[test]]
name = "exit_codes"
required-features = ["mock"]
