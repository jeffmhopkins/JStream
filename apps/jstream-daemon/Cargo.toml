[package]
name = "jstream-daemon"
version = "0.0.0"
description = "The headless JStream engine host: runs an engine and serves its WebSocket API on localhost."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.jstream]
layer = 6
summary = "`jstream-daemon` (links core and server)"
unsafe_allowed = false

[lints]
workspace = true

[features]
# Browser sources through CEF (ADR-0021, ADR-0048), Windows only. The daemon doesn't build
# or link CEF: pages run in the sandboxed browser helper, which needs
# `jstream-browser-helper.exe` (CEF's bootstrap exe renamed), its DLL and CEF's runtime
# files next to `jstream-daemon.exe`. Off by default, as in `jstream-browser`, until those
# are packaged (its README's open items). Without it, `browser` sources show nothing.
cef = ["jstream-browser/cef"]
# Compile-checks the CEF wiring without CEF (`jstream-browser`'s `dox`), for CI's clippy.
# A binary built with it doesn't link.
dox = ["cef", "jstream-browser/dox"]

[dependencies]
anyhow.workspace = true
# Crash reports redact secrets by their BLAKE3 digests, never keeping their text.
blake3.workspace = true
# The control token's random bytes, from the OS.
getrandom.workspace = true
jstream-core.workspace = true
# `Codec`, for the startup check that Media Foundation has an AAC encoder.
jstream-media.workspace = true
# `Backends`, and the stream key store the publish opener reads.
jstream-platform.workspace = true
# The `BrowserBackend` the daemon gives the engine for `browser` sources, and, with the
# `cef` feature on Windows, its CEF backend.
jstream-browser.workspace = true
# `OutputId`, for `--output`; `OutputKind`, for the publish opener.
jstream-protocol.workspace = true
jstream-server.workspace = true
# Reading the YouTube OAuth client file Google Cloud gives (`--youtube-client`).
serde_json.workspace = true
# The runtime the server runs on; `signal` for Ctrl-C (and SIGTERM on Unix).
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
# The startup log line, with the log file's path.
tracing.workspace = true
# The log subscriber: the libraries' `tracing` events, filtered by `--log-level` or
# `RUST_LOG`, on stderr and in the rotating log files.
tracing-subscriber.workspace = true

# The live engine on Windows: WGC, WASAPI, Media Foundation, QPC, the Credential Manager
# key store, and the Media Foundation check that runs at startup.
[target.'cfg(windows)'.dependencies]
jstream-platform-windows.workspace = true
# `HttpsTransport`, the transport YouTube's calls go through (`Engine::with_youtube`), and
# `BUILT_IN_CLIENT_ID`, to skip the transport while the built-in client is empty.
jstream-youtube.workspace = true

# The live engine on macOS: ScreenCaptureKit, AVFoundation webcams, Core Audio,
# VideoToolbox and AudioToolbox, the Mach clock, AVFoundation media files and the
# Keychain key store, as far as ADR-0063's parts are built.
[target.'cfg(target_os = "macos")'.dependencies]
jstream-platform-macos.workspace = true

[dev-dependencies]
# The tests drive the daemon through the WebSocket client, as the CLI does.
futures-util.workspace = true
jstream-control = { workspace = true, features = ["ws"] }
# The YouTube setup's test: a transport that replays canned responses.
jstream-youtube = { workspace = true, features = ["fake"] }
# The publish opener's tests: an in-memory key store, and the fake backends.
jstream-platform = { workspace = true, features = ["fake"] }
# The browser wiring's test: a browser that opens pages in memory.
jstream-browser = { workspace = true, features = ["fake"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
