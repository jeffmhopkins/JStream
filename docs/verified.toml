stamp = { hash = "b3:a094ff78452ab132", by = "agent:claude-mac1-part3", note = "Merged wave/m3-2 after #533's squash merge and #544. The conflicts were the squash re-adding #533's text, so I took the wave's files and reapplied this PR's diff on top (the wave's macOS crate equals #533's last head). Re-read the whole section: VideoToolboxCodecs lists and opens the AudioToolbox AAC-LC encoder (src/audiotoolbox.rs), an AudioConverter from interleaved f32 at constant bit rate and the offered rate nearest the configured one (nearest_bit_rate), refusing to open when its magic cookie's AudioSpecificConfig (asc_from_magic_cookie) differs from aac_lc_config. AacFramer (src/aac.rs) interleaves planar input, pads the last unit and times packets from the first buffer's pts plus 1024 frames, priming not subtracted, as the Linux and Windows encoders do. The new objc2-audio-toolbox and objc2-core-audio-types crates are named, the not-yet list and the test paragraph match; two lines were reflowed. #544 moved the capture mailbox and NV12 converter into jstream-platform, which this section doesn't describe" }

