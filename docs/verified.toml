stamp = { hash = "b3:323228bd1cf6b688", by = "agent:wave-owner", note = "Merge of main (wave/m1-2 landed as #545) into wave/m1-3 (T1 #260 rebuilt on the full wave, then #552). Re-read whole section: render snapshot and compose describe per-mix shots (the plan copies the program scene plus each scene mix's scene, passes per root) with the transition replacing the program pass in every mix that shows the program (Shot::shows_program: program, preview and a missing mix), a scene mix of the program scene keeping passes of its own; captures take the transition's capture tracks and nested passes, then every mix's (Shot::captures); pairing reads Look, so a display or window source pairs as a capture; preview mixes still draw the program; DrawFn and compose take the tick's media time beside the per-mix frames and a preview stream redraws while a transition runs; transition tracks take no live values. From wave/m1-2: video mixes (session key of mix, size, rate and profile; per-mix next tick; fit with black bars), the master chain and output taps (Chain::apply, refused settings kept until the next routing sync, one master-bus encode per video session), capture.targets and per-capture mailboxes (C3), live values loaded with the snapshot (I2) and browser-page GPU imports (C8b5). Calls, Program scene, Transitions, Live values, Outputs, Video mixes, Locking and the allocation lists match engine.rs, snapshot.rs, pipeline.rs, preview/mod.rs, render.rs, captures.rs, audio.rs, audio_sources.rs, filters.rs, live.rs, session.rs and the tests. Deps: control's mock and undo text (mixes, master/output chains, T1's presets) and ARCH#protocol and protocol design at 0.30 (mixes 0.28, owners 0.29, capture.targets 0.27, transitions and studio preview 0.30, hello example minor 30); this section names no protocol version." }

