# Roadmap progress: the source of the generated `progress` block in README.md
# (docs/DOCS.md#generated). Edit this file, then run `cargo xtask docs generate`;
# `docs check` fails while the README differs from it.
#
# A PR that delivers or advances an item updates its entry here: its number in `prs`,
# and `status` once it is true on main. The weekly sweep runs `cargo xtask docs progress`
# and lists entries that the merged history contradicts.
#
# status: done (merged) | hardware (merged; a run on Windows hardware is still pending,
#         named by `note`) | review (a PR is open) | planned
# Item IDs are the roadmap board's; PR titles name them in parentheses, e.g. "(A5)".

