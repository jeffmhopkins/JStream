<!doctype html>
<!--
  JStream UI prototype, as one self-contained file. Open it by double-click: it needs no
  build, no server and no network.

  Generated by design/ui-prototype/standalone/build.py from the *.dc.html files next to it.
  To change the prototype for the repo, edit those files and run the script again. To try
  an idea on a copy you are sharing, edit the blocks below directly: each component is a
  "text/x-dc-markup" block (its HTML, with {{bindings}}, <sc-if> and <sc-for>) and a
  "text/x-dc-logic" block (its Component class). design/ui-prototype/README.md explains both.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@TITLE@</title>
<style>
html,body{margin:0;background:#0F1115}
#dc-switch{position:fixed;left:8px;bottom:8px;z-index:9999;display:flex;gap:2px;padding:3px;border-radius:8px;background:rgba(22,25,30,.92);border:1px solid #2E333B;font:12px system-ui,sans-serif;opacity:.55;transition:opacity 120ms}
#dc-switch:hover,#dc-switch:focus-within{opacity:1}
#dc-switch button{background:none;border:0;color:#9AA1AC;padding:4px 8px;border-radius:5px;cursor:pointer;font:inherit}
#dc-switch button[aria-pressed="true"]{background:#2E3D55;color:#fff}
#dc-error{position:fixed;inset:auto 8px 48px 8px;z-index:9999;display:none;padding:10px 12px;border-radius:6px;background:#3A1C1F;color:#FFD9DB;font:12px ui-monospace,monospace;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app"></div>
<nav id="dc-switch" aria-label="Prototype boards"></nav>
<div id="dc-error" role="alert"></div>
<!--@COMPONENTS@-->
<script>
/*@RUNTIME@*/
</script>
<script>
(function () {
  const VIEWS = /*@VIEWS@*/[];
  const app = document.getElementById('app');
  const nav = document.getElementById('dc-switch');
  const err = document.getElementById('dc-error');
  // The hash picks the board: #D (the default), #A, #B or #C, or a component name.
  const short = (v) => v.title.split(' · ')[0];
  const showError = (e) => { err.style.display = 'block'; err.textContent = String(e && e.stack || e); };
  window.addEventListener('error', (e) => showError(e.error || e.message));
  DC.loadAll();
  function open(name) {
    const v = VIEWS.find((x) => x.name === name || short(x) === name) || VIEWS[0];
    for (const b of nav.children) b.setAttribute('aria-pressed', String(b.dataset.name === v.name));
    document.title = v.title + ' · JStream prototype';
    try { DC.mount(v.name, app); } catch (e) { showError(e); }
  }
  for (const v of VIEWS) {
    const b = document.createElement('button');
    b.dataset.name = v.name;
    b.title = v.title;
    b.textContent = short(v);
    b.onclick = () => { location.hash = short(v); };
    nav.appendChild(b);
  }
  window.addEventListener('hashchange', () => open(location.hash.slice(1)));
  open(location.hash.slice(1));
})();
</script>
</body>
</html>
