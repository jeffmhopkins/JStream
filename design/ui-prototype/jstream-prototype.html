    const it = selItem ? T.item(selItem) : null;
    // The preset being edited: picked in the dropdown, else the selected scene's, else the default.
    const editId = T.presets.some((p) => p.id === st.trEdit) ? st.trEdit : (selScene && T.inOf(selScene)) || T.defaultId;
    const ep = T.presets.find((p) => p.id === editId);

    let ed = null;
    if (ep) {
      const pre = 'p.' + ep.id + '.';
      const isDefault = ep.id === T.defaultId;
      const u = T.usage(ep.id);
      ed = {
        name: ep.name,
        setName: (e) => T.setPreset(ep.id, { name: e.target.value }),
        kinds: KINDS.map((k) => ({ name: k, on: ep.kind === k, bg: ep.kind === k ? '#22324A' : 'transparent', pick: () => T.setPreset(ep.id, { kind: k }) })),
        fields: ep.kind === 'Cut' ? [] : [
          this.field('tr:' + pre + 'duration', 'Duration', 300, { step: 10, unit: 'ms', min: 0, max: 10000 }),
          ...(ep.kind === 'Move' ? [this.field('tr:' + pre + 'stagger', 'Stagger per item', 0, { step: 10, unit: 'ms', min: 0, max: 1000 })] : [])
        ],
        selects: ep.kind === 'Cut' ? [] : [
          sel('Easing', pre + 'easing', ['Ease in-out', 'Ease out', 'Linear', 'Spring'], ep.easing),
          ...(ep.kind === 'Move' ? [sel('Items in one scene only', pre + 'unmatched', ['Fade', 'Scale', 'Slide'], ep.unmatched)] : [])
        ],
        note: (isDefault ? 'The default: used unless a scene overrides it. ' : '') + 'Overrides: ' + u.into + ' in, ' + u.out + ' out.',
        canDefault: !isDefault,
        makeDefault: () => T.setDefault(ep.id),
        remove: () => { T.removePreset(ep.id); this.setState({ trEdit: null }); }
      };
    }
    const presetOpts = [
      ...T.presets.map((p) => ({ id: p.id, label: p.name + ' — ' + what(p) + (p.id === T.defaultId ? ' (default)' : '') })),
      { id: '__new', label: '+ New preset…' }
    ];
    const out = {
      presetOpts, editId, hasEdit: !!ed, ed: ed || { kinds: [], fields: [], selects: [] },
      pickEdit: (e) => { const v = e.target.value; this.setState({ trEdit: v === '__new' ? T.addPreset() : v }); }
    };
    return out;
  }

  // A scene's transition overrides (Inspector): Default or a preset, for in and out.
  sceneTransVals(sel) {
    const T = this.props.trans;
    if (!T || !T.presets || !sel.startsWith('scene:')) return [];
    const n = sel.slice(6);
    const def = T.presets.find((p) => p.id === T.defaultId);
    const opts = [{ id: '', label: 'Default (' + (def ? def.name : '') + ')' }, ...T.presets.map((p) => ({ id: p.id, label: p.name }))];
    const mk = (label, dir, cur, short) => ({
      label, value: cur || '', opts, short: short + ' ' + ((T.presets.find((p) => p.id === cur) || {}).name || ''),
      change: (e) => T.setOverride(n, dir, e.target.value || null)
    });
    return [mk('Transition in', 'into', T.inOf(n), 'in'), mk('Transition out', 'outOf', T.outOfScene(n), 'out')];
  }

  // The selected item's own behaviour when scenes switch (Inspector section).
  swVals(sel) {
    const T = this.props.trans;
    if (!T || !T.item || !sel.startsWith('obj:')) return { fields: [], selects: [], go: [], changed: false };
    const id = sel.slice(4);
    const it = T.item(id);
    const isel = (label, k, opts) => ({ label, value: it[k], opts: opts.map((o) => ({ o })), change: (e) => T.setItem(id, k, e.target.value) });
    const go = T.scenes.filter((n) => n !== T.current).map((n) => {
      const r = T.resolve(T.current, n);
      const has = T.sceneHas(n, id);
      const outFx = (it.out === 'Inherit' ? r.unmatched || 'Fade' : it.out).toLowerCase();
      const [w, c] = r.kind === 'Cut' ? ['cuts', '#9AA1AC']
        : has && r.kind === 'Move' && it.match !== 'Never' ? ['glides to its place', '#7FD6A8']
        : has ? ['cross-fades', '#C9CED6']
        : r.kind === 'Move' ? ['leaves · ' + outFx, '#E8A33D'] : ['fades out', '#E8A33D'];
      return { to: n, what: w, color: c, go: () => T.go(n) };
    });
    return {
      fields: [this.field('tri:' + id + '|delay', 'Delay', 0, { step: 10, unit: 'ms', min: 0, max: 3000 })],
      selects: [
        isel('Easing', 'easing', ['Inherit', 'Ease in-out', 'Ease out', 'Linear', 'Spring']),
        isel('Glide to other scenes', 'match', ['Auto', 'Never']),
        isel('Appear', 'in', ['Inherit', 'Fade', 'Scale', 'Slide', 'None']),
        isel('Disappear', 'out', ['Inherit', 'Fade', 'Scale', 'Slide', 'None'])
      ],
      go,
      changed: it.delay > 0 || it.easing !== 'Inherit' || it.match !== 'Auto' || it.in !== 'Inherit' || it.out !== 'Inherit'
    };
  }

  renderVals() {
    const st = this.state;
    const kind = this.props.kind ?? 'scenes';
    const sel = this.props.sel ?? st.localSel;
    const m = this.meta();
    const pick = (key, additive) => {
      if (typeof this.props.picker === 'function') this.props.picker(key, { additive, kind });
      else this.setState({ localSel: key });
    };
    const isTree = kind === 'scenes' || kind === 'objects';
    const rows = isTree ? this.treeRows(this.treeItems(kind), sel, pick, kind) : [];
    const filtering = st.search.trim() !== '' || st.favOnly || st.labelFilter.length > 0;

    const labelFilters = m.labels.map((l) => {
      const active = st.labelFilter.includes(l.id);
      return {
        name: l.name, color: l.color, icon: ICONS[l.icon][1], active,
        bg: active ? tint(l.color, 0.22) : 'transparent',
        border: active ? l.color : '#2E333B',
        tick: active ? '✓' : '',
        boxBg: active ? l.color : 'transparent',
        boxBorder: active ? l.color : '#4D535E',
        toggle: () => this.setState({ labelFilter: active ? st.labelFilter.filter((x) => x !== l.id) : [...st.labelFilter, l.id] })
      };
    });

    const mlabels = m.labels.map((l) => ({
      name: l.name, color: l.color, icon: ICONS[l.icon][1],
      rename: (e) => this.updateLabel(l.id, { name: e.target.value }),
      remove: () => {
        const mm = copy(m);
        mm.labels = mm.labels.filter((x) => x.id !== l.id);
        for (const k of Object.keys(mm.assign)) mm.assign[k] = mm.assign[k].filter((x) => x !== l.id);
        this.setMeta(mm);
        this.setState({ labelFilter: st.labelFilter.filter((x) => x !== l.id) });
      },
      swatches: SWATCHES.map((c) => ({ c, ring: c === l.color ? '#E6E8EB' : 'transparent', pick: () => this.updateLabel(l.id, { color: c }) })),
      iconsOpen: st.iconFor === l.id,
      toggleIcons: () => this.setState({ iconFor: st.iconFor === l.id ? null : l.id }),
      iconGroups: ICON_GROUPS.map((g) => ({
        title: g.title,
        icons: g.ids.map((id) => ({
          n: ICONS[id][0], d: ICONS[id][1],
          bg: id === l.icon ? tint(l.color, 0.22) : '#0F1115',
          border: id === l.icon ? l.color : '#2E333B',
          pick: () => this.updateLabel(l.id, { icon: id })
        }))
      }))
    }));

    // Inspector
    const fav = !!m.favs[this.src(sel)];
    const assigned = m.assign[this.src(sel)] || [];
    let insp, sceneFields = [], fieldSections = [], listSections = [];
    let blend = { opts: [], fields: [] }, linked = { rows: [], empty: true };
    // In a keyframe only placement and visibility are editable here.
    const kfNow = (this.props.keyframes || {})[this.props.scenename || ''];
    const kfLockNote = kfNow && sel.startsWith('obj:') ? 'Keyframe of “' + kfNow.parent + '”: blending, filters and properties follow it. Only placement and visibility change here.' : '';
    // Every Inspector section folds; the choice is remembered per section name.
    const fold = (title, hint) => {
      const open = !st.secClosed[title];
      return { open, caret: open ? '▾' : '▸', hint: !open && hint ? ' · ' + hint : '', toggle: () => this.setState({ secClosed: { ...this.state.secClosed, [title]: open } }) };
    };
    const labelChips = m.labels.map((l) => {
      const checked = assigned.includes(l.id);
      return {
        name: l.name, color: checked ? l.color : '#7D8590', icon: ICONS[l.icon][1], checked,
        hint: checked ? 'Remove label' : 'Add label',
        text: checked ? '#E6E8EB' : '#7D8590',
        bg: checked ? tint(l.color, 0.18) : 'transparent',
        border: checked ? l.color : '#2E333B',
        toggle: () => this.toggleLabel(sel, l.id)
      };
    });
    const byIdL = Object.fromEntries(m.labels.map((l) => [l.id, l]));
    const common = {
      fav, labels: labelChips,
      chips: assigned.map((id) => byIdL[id]).filter(Boolean).map((l) => ({ name: l.name, color: l.color, icon: ICONS[l.icon][1], tint: tint(l.color, 0.16) })),
      tagOpen: st.tagOpen === 'insp:' + sel,
      tagOn: st.tagOpen === 'insp:' + sel ? 'on' : '',
      toggleTag: () => this.setState({ tagOpen: this.state.tagOpen === 'insp:' + sel ? null : 'insp:' + sel, filterOpen: false }),
      assign: m.labels.map((l) => {
        const checked = assigned.includes(l.id);
        return { name: l.name, color: l.color, icon: ICONS[l.icon][1], checked, tick: checked ? '✓' : '', boxBg: checked ? l.color : 'transparent', boxBorder: checked ? l.color : '#4D535E', toggle: () => this.toggleLabel(sel, l.id) };
      }),
      more: '',
      italic: this.isRef(sel) ? 'italic' : 'normal',
      starFill: fav ? '#F2C14E' : 'none', starStroke: fav ? '#F2C14E' : '#9AA1AC',
      toggleFav: () => this.toggleFav(sel)
    };
    if (sel.startsWith('out:')) {
      const T = { 'out:program': 'Program output', 'out:youtube': 'YouTube stream', 'out:record': 'Recording', 'out:vcam': 'Virtual camera' };
      insp = { ...common, isScene: false, isObject: false, title: T[sel] || sel, icon: OUT_ICON, subtitle: 'Output', kindTag: sel === 'out:program' ? 'Master chain' : 'Output', italic: 'normal', chips: [], more: '' };
    } else if (sel.startsWith('scene:')) {
      const n = sel.slice(6);
      const info = SCENE_INFO[n] || { count: 0, usedIn: 'none', hotkey: 'none', icon: 'layers' };
      const kfp = (this.props.keyframes || {})[n];
      insp = { ...common, isScene: true, isObject: false, title: kfp ? kfp.label : (this.props.names && this.props.names[sel]) || n, icon: ICONS[kfp ? 'keyframe' : info.icon][1], subtitle: kfp ? 'Keyframe of ' + kfp.parent : 'Scene', kindTag: kfp ? 'Keyframe of “' + kfp.parent + '”' : 'Scene', count: info.count, usedIn: info.usedIn, hotkey: info.hotkey };
    } else {
      const o = this.info(sel) || OBJ_INFO.webcam;
      const extra = (this.props.selids ?? []).length - 1;
      insp = { ...common, isScene: false, isObject: true, title: this.nameFor(sel), icon: ICONS[o.icon][1], subtitle: extra > 0 ? o.subtitle + ' · +' + extra + ' more selected' : o.subtitle, kindTag: o.subtitle.split(' · ')[0].replace(' source', ''), more: extra > 0 ? '+' + extra : '' };
      const tf = ['X', 'Y', 'W', 'H'].map((nm, i) => this.field(sel + ':' + nm, nm, o.t[i], { step: 1, unit: 'px', min: nm === 'W' || nm === 'H' ? 1 : -10000 }));
      // The same width and height again, as a % of the source's own size.
      tf.push(this.field(sel + ':Wpct', 'W', 100, { step: 1, unit: '%', min: 0.1, max: 10000 }));
      tf.push(this.field(sel + ':Hpct', 'H', 100, { step: 1, unit: '%', min: 0.1, max: 10000 }));
      tf.push(this.field(sel + ':rot', 'Rotation', o.t[4], { step: 0.5, dec: 1, unit: '°', min: -360, max: 360 }));
      const cf = ['Left', 'Right', 'Top', 'Bottom'].map((nm, i) => this.field(sel + ':crop' + nm, nm, o.c[i], { step: 1, unit: 'px', min: 0, max: 4000 }));
      const lk = this.state.aspectLock;
      if (o.audioOnly) insp.audioOnly = true;
      fieldSections = o.audioOnly ? [] : [
        { title: 'PARAMETERS', fields: tf, hasLink: true, linkOn: lk,
          linkLabel: lk ? 'Width and height are linked (keeps the aspect ratio). Click to unlink.' : 'Width and height are independent. Click to link them.',
          linkIcon: lk ? 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1 M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1' : 'M9 15l-1.5 1.5a3.2 3.2 0 0 1-4.5-4.5L4.5 10.5 M15 9l1.5-1.5a3.2 3.2 0 0 1 4.5 4.5l-1.5 1.5 M8 4v3 M4 8h3 M16 20v-3 M20 16h-3',
          linkBg: lk ? '#22324A' : 'transparent', linkBorder: lk ? '#4C8DFF' : '#2E333B', linkColor: lk ? '#B5CEFF' : '#9AA1AC',
          toggleLink: () => this.setState({ aspectLock: !this.state.aspectLock }) },
        { title: '3D', fields: [
          this.field(sel + ':rotX', 'Tilt (X)', 0, { step: 0.5, dec: 1, unit: '°', min: -180, max: 180 }),
          this.field(sel + ':rotY', 'Turn (Y)', 0, { step: 0.5, dec: 1, unit: '°', min: -180, max: 180 }),
          this.field(sel + ':posZ', 'Depth (Z)', 0, { step: 1, unit: 'px', min: -5000, max: 5000 }),
          this.field(sel + ':persp', 'Perspective', 1200, { step: 10, unit: 'px', min: 100, max: 20000 })
        ], hasLink: false },
        { title: 'CROP', fields: cf, hasLink: false }
      ];
      const id = sel.slice(4);
      const sid = this.src(sel).slice(4);
      const xfo = (this.props.xf && this.props.xf[sid]) || {};
      blend = {
        value: xfo.blend || 'Normal',
        opts: BLEND_NAMES.map((o2) => ({ o: o2 })),
        change: (e) => { if (typeof this.props.xfset === 'function') this.props.xfset(id, 'blend', e.target.value); },
        fields: [this.field('obj:' + sid + ':opacity', 'Opacity', 100, { step: 1, unit: '%', min: 0, max: 100 })]
      };
      listSections = [];
    }

    const MS = this.props.master;
    // Meter orientation: set from the Mixer's title bar; until then it follows where it's docked.
    const mo = this.props.mixorient || st.mixOrientLocal || '';
    const mixVertical = mo === 'v' || (mo !== 'h' && this.props.vertical === 'yes');
    // Only sources whose audio is on reach the Mixer.
    const channels0 = (this.props.mixer || [
      { id: 'mic', n: 'Mic · ES-9 Line', db: -3 },
      { id: 'desk', n: 'Desktop audio', db: -8.5 },
      { id: 'alerts', n: 'Alerts', db: -12 }
    ]);
    const channels = channels0.map((c) => {
      const f = this.field('mix:' + c.id, c.n + (MS && MS.privacy && c.id === 'mic' ? ' · muted (privacy)' : ''), c.db, { step: 0.5, dec: 1, unit: 'dB', min: -60, max: 12, axis: mixVertical ? 'y' : 'x' });
      const v = this.val('mix:' + c.id, c.db);
      return { ...f, short: c.n.split(' · ')[0], level: Math.round(Math.max(0, Math.min(100, ((v + 60) / 72) * 100))) };
    });

    const chat = st.chat.map((c) => {
      const featured = st.featured === c.id;
      return {
        time: c.time, author: c.author, color: c.color, text: c.text,
        badge: c.badge || '', badgeColor: c.badgeColor || '#9AA1AC',
        bg: featured ? '#22324A' : (c.superChat ? 'rgba(232,163,61,0.12)' : 'transparent'),
        edge: featured ? '#4C8DFF' : (c.superChat ? '#E8A33D' : 'transparent'),
        featureLabel: featured ? 'On stream' : 'Show',
        feature: () => this.setState({ featured: featured ? null : c.id })
      };
    });

    return {
      is: { filters: kind === 'filters', ytstats: kind === 'ytstats', transform: kind === 'transform', tree: isTree, scenes: kind === 'scenes', objects: kind === 'objects', inspector: kind === 'inspector', chat: kind === 'chat', mixer: kind === 'mixer', outputs: kind === 'outputs', transitions: kind === 'transitions', agent: kind === 'agent' },
      treeName: kind === 'scenes' ? 'scenes' : 'objects',
      uid: this.uid,
      popKey: (e) => { if (e.key === 'Escape') { e.stopPropagation(); this.setState({ filterOpen: false, tagOpen: null, addOpen: false }); } },
      starIcon: ICONS.star[1],
      tagIcon: ICONS.tag[1],
      search: st.search,
      onSearch: (e) => this.setState({ search: e.target.value }),
      favFilter: {
        active: st.favOnly,
        bg: st.favOnly ? 'rgba(242,193,78,0.16)' : 'transparent',
        border: st.favOnly ? '#F2C14E' : '#2E333B',
        fill: st.favOnly ? '#F2C14E' : 'none',
        tick: st.favOnly ? '✓' : '',
        boxBg: st.favOnly ? '#F2C14E' : 'transparent',
        boxBorder: st.favOnly ? '#F2C14E' : '#4D535E',
        toggle: () => this.setState({ favOnly: !st.favOnly })
      },
      filterOpen: st.filterOpen,
      toggleFilter: () => this.setState({ filterOpen: !st.filterOpen }),
      filterCount: (st.favOnly ? 1 : 0) + st.labelFilter.length + (st.search.trim() ? 1 : 0),
      filterBg: (st.favOnly || st.labelFilter.length) ? '#22324A' : '#0F1115',
      filterBorder: (st.favOnly || st.labelFilter.length) ? '#4C8DFF' : '#2E333B',
      filterColor: (st.favOnly || st.labelFilter.length) ? '#B5CEFF' : '#9AA1AC',
      labelFilters,
      filtering,
      clearFilters: () => this.setState({ search: '', favOnly: false, labelFilter: [] }),
      manage: st.manage,
      manageBg: st.manage ? '#2B313A' : '#0F1115',
      toggleManage: () => this.setState({ manage: !st.manage, iconFor: null }),
      openManage: () => this.setState({ manage: true, tagOpen: null, filterOpen: false }),
      mlabels,
      addLabel: () => {
        const mm = copy(m);
        const id = 'l' + Date.now();
        mm.labels.push({ id, name: 'New label', icon: 'tag', color: SWATCHES[mm.labels.length % SWATCHES.length] });
        this.setMeta(mm);
        this.setState({ iconFor: id });
      },
      rows,
      noRows: isTree && rows.length === 0,
      yt: this.ytVals(),
      fl: this.flVals(),
      tx: this.props.tx ?? { summary: 'Shown in the workspace with live selection.', alignBtns: [], distBtns: [], actions: [] },
      treeCtx: (e) => {
        if (typeof this.props.openctx !== 'function') return;
        e.preventDefault();
        this.props.openctx(kind, null, e.clientX, e.clientY);
      },
      kfLock: kfLockNote, srcSecs: !(insp && insp.audioOnly) && !kfLockNote,
      insp, sceneFields, listSections: (kfLockNote ? [] : listSections).map((x) => ({ ...x, ...fold(x.title, x.fields.length ? x.fields.length + '' : '') })),
      fieldSections: fieldSections.map((x) => {
        // A folded section says whether anything in it is set.
        const used = (fs) => fs.some((f) => parseFloat(String(f.display).replace('−', '-')) !== 0);
        const hint = x.title === '3D' ? (used(x.fields.slice(0, 3)) ? 'in use' : '') : x.title === 'CROP' ? (used(x.fields) ? 'cropped' : '') : '';
        return { ...x, ...fold(x.title, hint) };
      }),
      sw: this.swVals(sel),
      secSwitch: fold('SCENE SWITCHES', this.swVals(sel).changed ? 'customised' : ''),
      sceneTrans: this.sceneTransVals(sel),
      secTrans: fold('TRANSITIONS', this.sceneTransVals(sel).filter((f) => f.value).map((f) => f.short).join(', ')),
      secScene: fold('SCENE'), secBlend: fold('BLENDING', blend.value && blend.value !== 'Normal' ? blend.value : ''),
      blend, linked, visual: !(insp && insp.audioOnly), audioOnly: !!(insp && insp.audioOnly), linkIcon: LINK_ICON,
      fsTitle: sel.startsWith('scene:') ? 'SCENE FILTERS' : 'SOURCE FILTERS · EVERYWHERE',
      fsum: this.filterSummary(sel),
      fsumEmpty: this.filterSummary(sel).length === 0,
      editFilters: () => { if (typeof this.props.showpanel === 'function') this.props.showpanel('filters'); },
      channels,
      chat,
      chatDraft: st.chatDraft,
      onChatDraft: (e) => this.setState({ chatDraft: e.target.value }),
      chatKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); this.sendChatNow(); } },
      sendChat: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const t = st.chatDraft.trim();
        if (!t) return;
        this.setState({ chatDraft: '', chat: [...st.chat, { id: Date.now(), time: 'now', author: 'JStream', color: '#E6E8EB', badge: 'OWNER', badgeColor: '#F2C14E', text: t }] });
      },
      // The Mixer shows the master; its channels fold underneath (folded by default).
      mixOpen: !!st.mixOpen, mixCaret: st.mixOpen ? '▾' : '▸',
      // Docked in a side column the channels become vertical strips.
      mixHorz: !!st.mixOpen && !mixVertical,
      // Flips the meters between horizontal and vertical (until then: vertical in side columns).
      mixFlip: () => { if (typeof this.props.setmixorient === 'function') this.props.setmixorient(mixVertical ? 'h' : 'v'); else this.setState({ mixOrientLocal: mixVertical ? 'h' : 'v' }); },
      mixFlipIcon: mixVertical ? 'M7 20V9 M12 20V4 M17 20V13' : 'M4 7h11 M4 12h16 M4 17h7',
      mixFlipTip: mixVertical ? 'Meters: vertical · click for horizontal' : 'Meters: horizontal · click for vertical',
      mixHorzMode: !mixVertical, mixVertMode: mixVertical,
      mixCount: channels.length + (channels.length === 1 ? ' channel' : ' channels'),
      mixToggle: () => this.setState({ mixOpen: !this.state.mixOpen }),
      tr: this.trVals(),
      ms: MS ? { ...MS, monitorLabel: MS.monitorPost ? 'Hear: after FX' : 'Hear: before FX', monitorShort: MS.monitorPost ? 'Hear post' : 'Hear pre', tpColor: MS.tpOver ? '#FF8A8F' : '#7FD6A8', tpNote: MS.tpOver ? 'over 0 dBTP: add a true-peak limiter' : 'safe' } : { fx: 0, outputs: [] },
      outs: MS ? [
        { name: 'Program output', status: 'master', indent: 4, weight: 600, bg: '#1F232A', fx: MS.fx, open: MS.openFx, tip: 'Filters on everything leaving JStream', fxBg: '#22324A', fxBorder: '#4C8DFF' },
        ...MS.outputs.map((o) => ({ name: o.name, status: o.status, indent: 18, weight: 400, bg: 'transparent', fx: o.fx, open: o.open, tip: 'Filters for ' + o.name + ' only', fxBg: o.fx ? '#22324A' : 'transparent', fxBorder: o.fx ? '#4C8DFF' : '#2E333B' }))
      ] : [],
      sceneName: this.props.scenename || 'Desktop + Cam'
    };
  }
}
</script>

<script>
// A small stand-in for the Design canvas runtime, so the prototype's Design Components
// (`*.dc.html`) run in a plain browser with no build and no network.
//

<script>
(function () {
  const VIEWS = [{"name": "Docking", "title": "D · Dockable workspace (interactive)", "interactive": true}, {"name": "Main", "title": "A · Studio Classic", "interactive": false}, {"name": "CanvasFirst", "title": "B · Canvas First", "interactive": false}, {"name": "ShowControl", "title": "C · Show Control", "interactive": false}];
