      // selection, drag box-selects, right-click opens the canvas menu.
      outerDown: (e) => {
        if (e.button !== 0 || (e.target.closest && e.target.closest('[data-canvas]'))) return;
        const el = e.currentTarget.querySelector('[data-canvas]');
        if (!el) return;
        if (this.state.ctx) this.setState({ ctx: null });
        this.startOp(e, { type: 'marquee', additive: e.shiftKey, base: this.state.selIds, el });
      },
      outerCtx: (e) => {
        if (e.target.closest && e.target.closest('[data-canvas]')) return;
        e.preventDefault();
        this.openCtx('canvasOuter', null, e.clientX, e.clientY);
      },
      ctxBg: (e) => { e.preventDefault(); if (e.target === e.currentTarget) this.openCtx('canvas', null, e.clientX, e.clientY); },
      move: (e) => this.canvasMove(e),
      up: () => this.endOp(),
      key: (e) => {
        if (e.key === 'c' || e.key === 'C') { this.setState({ cropMode: !s.cropMode }); return; }
        if (e.key === 'v' || e.key === 'V') { this.setState({ cropMode: false }); return; }
        if (e.key === 'Escape') { this.setState({ sel: 'scene:' + this.state.scene, selIds: [], cropMode: false, ctx: null }); return; }
        if ((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'A')) { e.preventDefault(); const all = this.drawOrder(); this.setState({ selIds: all, sel: 'obj:' + all[all.length - 1] }); return; }
        if (!selIds.length) return;
        const step = e.shiftKey ? 10 : 1;
        const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
        if (!d) return;
        e.preventDefault();
        const patches = {};
        for (const id of selIds) patches[id] = { x: s.xf[id].x + d[0], y: s.xf[id].y + d[1] };
        this.setXfMany(patches);
      }
    };
  }

  // ---- Trees and layers -----------------------------------------------------------
  // `trees.scenes` and `trees.objects` are nested lists of { key, label?, children? }, top
  // to bottom. Containers are folders (f:), object groups (grp:) and nested scenes. The
  // canvas draws the objects tree bottom to top.
  static flatKeys(nodes, out = []) {
    for (const n of nodes) { out.push(n.key); if (n.children) Component.flatKeys(n.children, out); }
    return out;
  }

  drawOrder() {
    // Audio-only sources have no picture, so they aren't drawn.
    return Component.flatKeys(this.state.trees.objects).filter((k) => k.startsWith('obj:') && this.state.xf[k.slice(4)] && !this.state.xf[k.slice(4)].hidden).map((k) => k.slice(4)).reverse();
  }

  // The list that holds `key`, and its index there.
  static locate(nodes, key) {
    for (let i = 0; i < nodes.length; i++) {
      if (nodes[i].key === key) return { list: nodes, i };
      if (nodes[i].children) { const r = Component.locate(nodes[i].children, key); if (r) return r; }
    }
    return null;
  }

  // Moves `src` before/after/into `tgt`. Refuses moves into its own subtree.
  treeMove(kind, src, tgt, mode) {
    if (src === tgt) return;
    if (kind === 'objects' && this.kfLocked()) return;
    // Keyframes stay under their scene.
    if (kind === 'scenes' && (this.state.keyframes[src.slice(6)] || (mode === 'into' && !tgt.startsWith('f:')))) return;
    const tree = copy(this.state.trees[kind]);
    const from = Component.locate(tree, src);
    if (!from) return;
    const node = from.list[from.i];
    if (node.children && Component.flatKeys(node.children).includes(tgt)) return;
    from.list.splice(from.i, 1);
    const to = Component.locate(tree, tgt);
    if (!to) return;
    if (mode === 'into') {
      const t = to.list[to.i];
      if (!t.children) return;
      t.children.unshift(node);
    } else to.list.splice(mode === 'after' ? to.i + 1 : to.i, 0, node);
    this.setState({ trees: { ...this.state.trees, [kind]: tree } });
  }

  treeAddScene() {
    const n = (this.addSeq = (this.addSeq || 0) + 1);
    const key = 'scene:New scene ' + n;
    this.setState({ trees: { ...this.state.trees, scenes: [{ key }, ...this.state.trees.scenes] }, sel: key, selIds: [] });
  }

  treeAdd(kind) {
    if (kind === 'objects') { this.newGroup(); return; }
    const n = (this.addSeq = (this.addSeq || 0) + 1);
    const node = kind === 'scenes'
      ? { key: 'f:new' + n, label: 'New folder', children: [] }
      : { key: 'grp:new' + n, label: 'New group', children: [] };
    this.setState({ trees: { ...this.state.trees, [kind]: [node, ...this.state.trees[kind]] } });
  }

  // Moves one object within its own list: 'front' | 'forward' | 'backward' | 'back'.
  shiftLayer(id, how) {
    const tree = copy(this.state.trees.objects);
    const at = Component.locate(tree, 'obj:' + id);
    if (!at) return;
    const [node] = at.list.splice(at.i, 1);
    const j = { front: 0, back: at.list.length, forward: Math.max(0, at.i - 1), backward: Math.min(at.list.length, at.i + 1) }[how];
    at.list.splice(j, 0, node);
    this.setState({ trees: { ...this.state.trees, objects: tree } });
  }

  // Selection order matters for layer actions: act on items top first.
  layerIdsOf(ids) {
    const order = this.drawOrder();
    return [...ids].sort((a, b) => order.indexOf(b) - order.indexOf(a));
  }

  // ---- YouTube broadcast picker ---------------------------------------------------
  stVals() {
    const s = this.state;
    const cur = s.streams.find((b) => b.id === s.streamId) || s.streams[0];
    const d = s.draft;
    const seg = (label, key, opts, note) => ({
      label, note: note || '',
      opts: opts.map((t) => ({ t, on: d[key] === t, bg: d[key] === t ? '#2B313A' : 'transparent', pick: () => this.setState({ draft: { ...this.state.draft, [key]: t } }) }))
    });
    const tog = (label, key) => ({
      label, on: !!d[key], track: d[key] ? '#4C8DFF' : '#3A3F48', knob: d[key] ? 16 : 2,
      flip: () => this.setState({ draft: { ...this.state.draft, [key]: !this.state.draft[key] } })
    });
    const close = () => this.setState({ creating: false });
    return {
      open: s.menu === 'stream',
      bg: s.menu === 'stream' ? '#2B313A' : '#1F232A',
      title: cur ? cur.title : 'No broadcast selected',
      sub: cur ? cur.privacy + ' · ' + cur.when : 'Choose or create one',
      toggle: () => this.setState({ menu: this.state.menu === 'stream' ? null : 'stream' }),
      items: s.streams.map((b) => ({
        title: b.title, sub: b.privacy + ' · ' + b.when + ' · ' + b.latency + ' latency',
        selected: b.id === s.streamId, mark: b.id === s.streamId ? '✓' : '',
        pick: () => this.setState({ streamId: b.id, menu: null })
      })),
      create: () => this.setState({
        menu: null, creating: true,
        draft: { title: '', desc: '', privacy: 'Unlisted', latency: 'Low', start: 'Start now', category: 'Science & Technology', when: '', dvr: true, kids: false }
      }),
      goLive: () => this.setState({ live: !s.live }),
      liveLabel: s.live ? 'End stream' : 'Go Live',
      liveBg: s.live ? '#7A1E23' : '#C62F36',
      creating: s.creating,
      draft: d,
      later: d.start === 'Schedule',
      segs: [
        seg('Visibility', 'privacy', ['Public', 'Unlisted', 'Private']),
        seg('Latency', 'latency', ['Normal', 'Low', 'Ultra-low'], 'Lower latency means quicker chat replies, but less buffering for viewers.'),
        seg('Start', 'start', ['Start now', 'Schedule'])
      ],
      toggles: [tog('Allow viewers to rewind (DVR)', 'dvr'), tog('Made for kids', 'kids')],
      setTitle: (e) => this.setState({ draft: { ...this.state.draft, title: e.target.value } }),
      setDesc: (e) => this.setState({ draft: { ...this.state.draft, desc: e.target.value } }),
      setCategory: (e) => this.setState({ draft: { ...this.state.draft, category: e.target.value } }),
      setWhen: (e) => this.setState({ draft: { ...this.state.draft, when: e.target.value } }),
      cantCreate: !d.title.trim(),
      createOp: d.title.trim() ? 1 : 0.45,
      submit: (e) => {
        e.preventDefault();
        const dd = this.state.draft;
        if (!dd.title.trim()) return;
        const id = 'b' + Date.now();
        const when = dd.start === 'Schedule' && dd.when ? dd.when.replace('T', ' ') : 'Now';
        this.setState({
          streams: [{ id, title: dd.title.trim(), privacy: dd.privacy, when, latency: dd.latency }, ...this.state.streams],
          streamId: id, creating: false
        });
      },
      cancel: close,
      backdrop: close,
      stop: (e) => e.stopPropagation(),
      formKey: (e) => this.dlgKey(e, close)
    };
  }

  // ---- Pop-outs (projectors) ------------------------------------------------------
  // A window pop-out is a floating preview; a monitor pop-out would be a fullscreen
  // projector, shown here as a notice.
  popTitle(key) {
    key = this.srcKey(key);
    if (key && this.state.names[key]) return this.state.names[key];
    if (!key || key.startsWith('scene:')) return (key ? key.slice(6) : this.state.scene);
    const b = this.baseId(key.slice(4));
    return { display: 'Display 1', webcam: 'Webcam · Brio', lower: 'Lower third', alerts: 'Alerts', logo: 'Logo', ticker: 'Ticker' }[b] || b;
  }

  popWindow(key) {
    const k = key || 'scene:' + this.state.scene;
    const n = this.state.popouts.length;
    this.setState({ popouts: [...this.state.popouts, { id: 'w' + Date.now(), key: k, x: 120 + n * 32, y: 120 + n * 32 }] });
  }

  popMonitor(key, mon) {
    const what = this.popTitle(key || 'scene:' + this.state.scene);
    this.toast('Fullscreen projector: “' + what + '” on ' + mon.name + '. Press Esc on that monitor to close it.');
  }

  toast(text) {
    clearTimeout(this.toastTimer);
    this.setState({ toastMsg: text });
    this.toastTimer = setTimeout(() => this.setState({ toastMsg: null }), 4500);
  }

  popItems(key) {
    const s = this.state;
    const isObj = key && key.startsWith('obj:');
    const item = (label, go, hint = '') => ({ kind: 'item', label, hint, check: '', go: () => { this.setState({ ctx: null, ctxSub: null }); go(); }, disabled: false, cls: 'menuitem', op: 1 });
    // One "Pop out" entry with a submenu: a window, or a monitor.
    return [{
      ...item('Pop out', () => {}),
      sub: [
        item(isObj ? 'Source in a window' : 'Scene in a window', () => this.popWindow(key)),
        { kind: 'head', label: 'Full screen on a monitor' },
        ...MONITORS.map((m) => item(m.name, () => this.popMonitor(key, m), m.res))
      ]
    }];
  }

  showPanel(id) {
    const z = copy(this.state.zones);
    let found = false;
    for (const k of Object.keys(z)) for (const g of z[k]) if (g.tabs.includes(id)) { g.active = id; g.collapsed = false; found = true; }
    if (!found) z[HOME[id]].push(grp(id));
    this.setState({ zones: z });
  }

  popVals() {
    const s = this.state;
    const order = this.drawOrder();
    const pct = (v, of) => Math.round((v / of) * 100000) / 1000;
    const COLORS = { display: '#243447', webcam: '#3A2F45', lower: '#0F1115', alerts: '#E8A33D', logo: '#4C8DFF', ticker: '#16191E' };
    return s.popouts.map((p) => {
      const isObj = p.key.startsWith('obj:');
      const isMain = p.key === 'scene:' + s.scene;
      const ids = isObj ? [p.key.slice(4)] : isMain ? order : [];
      return {
        title: (isObj ? 'Source: ' : 'Scene: ') + this.popTitle(p.key),
        x: p.x, y: p.y,
        blocks: ids.map((id) => {
          const t = s.xf[id];
          // A single source fills its window; a scene shows its layout.
          return isObj
            ? { left: 0, top: 0, width: 100, height: 100, rot: 0, bg: COLORS[this.baseId(id)] || '#243447', label: this.popTitle(p.key) }
            : { left: pct(t.x, CW), top: pct(t.y, CH), width: pct(t.w, CW), height: pct(t.h, CH), rot: t.rot || 0, bg: COLORS[this.baseId(id)] || '#243447', label: '' };
        }),
        empty: ids.length === 0,
        close: () => this.setState({ popouts: this.state.popouts.filter((x) => x.id !== p.id) }),
        grab: (e) => {
          if (e.button !== 0) return;
          e.currentTarget.setPointerCapture(e.pointerId);
          this.popDrag = { id: p.id, sx: e.clientX, sy: e.clientY, x0: p.x, y0: p.y };
        },
        move: (e) => {
          const d = this.popDrag;
          if (!d || d.id !== p.id) return;
          if (e.buttons === 0) { this.popDrag = null; return; }
          const x = Math.max(0, d.x0 + e.clientX - d.sx), y = Math.max(0, d.y0 + e.clientY - d.sy);
          this.setState({ popouts: this.state.popouts.map((w) => (w.id === p.id ? { ...w, x, y } : w)) });
        },
        up: () => { this.popDrag = null; }
      };
    });
  }

  // ---- Properties dialog ----------------------------------------------------------
  // Each source type has its own settings; scenes have theirs. The dialog edits a draft
  // and applies it on OK, so Cancel leaves everything as it was.
  propKind(key) {
    if (key.startsWith('scene:')) return 'scene';
    return PROP_SCHEMA[this.typeOf(key.slice(4))] ? this.typeOf(key.slice(4)) : 'image';
  }

  nameOf(key) {
    if (key === 'out:program') return 'Program output';
    if (key && key.startsWith('out:')) return (OUTPUTS.find((o) => o.key === key) || {}).name || key;
    return this.state.names[this.srcKey(key)] || this.popTitle(key);
  }

  // A scene's transition overrides, as dialog fields (preset names; first = default).
  transFields() {
    const t = this.state.trans;
    const def = t.presets.find((p) => p.id === t.defaultId);
    const opts = ['Default (' + (def ? def.name : '') + ')', ...t.presets.map((p) => p.name)];
    return [
      { k: 'trIn', label: 'Transition in', t: 'select', opts, def: opts[0], note: 'Used when switching into this scene.' },
      { k: 'trOut', label: 'Transition out', t: 'select', opts, def: opts[0], note: 'Used when leaving it, unless the next scene has its own “in”.' }
    ];
  }
  schemaFields(kind) {
    return kind === 'scene' ? [...this.transFields(), ...PROP_SCHEMA.scene.fields] : PROP_SCHEMA[kind].fields;
  }

  openProps(key) {
    if (key.startsWith('obj:') && this.kfLocked()) return;
    // A reference's properties are its source's.
    key = this.srcKey(key);
    const kind = this.propKind(key);
    const dk = key.startsWith('obj:') ? 'obj:' + this.baseId(key.slice(4)) : key;
    const saved = this.state.props[key] || {};
    const values = {};
    for (const f of this.schemaFields(kind)) values[f.k] = saved[f.k] !== undefined ? saved[f.k] : (PROP_DEFAULTS[dk] && PROP_DEFAULTS[dk][f.k] !== undefined ? PROP_DEFAULTS[dk][f.k] : f.def);
    if (kind === 'scene') {
      const t = this.state.trans, n = key.slice(6);
      const nm = (id) => (t.presets.find((p) => p.id === id) || {}).name;
      if (t.into[n]) values.trIn = nm(t.into[n]);
      if (t.outOf[n]) values.trOut = nm(t.outOf[n]);
    }
    this.setState({ ctx: null, propsDlg: { key, kind, name: this.nameOf(key), values } });
  }

  propsVals() {
    const d = this.state.propsDlg;
    if (!d) return { open: false, fields: [] };
    const S = PROP_SCHEMA[d.kind];
    const set = (k, v) => this.setState({ propsDlg: { ...this.state.propsDlg, values: { ...this.state.propsDlg.values, [k]: v } } });
    const fields = this.schemaFields(d.kind).map((f) => {
      const v = d.values[f.k];
      return {
        label: f.label, note: f.note || '',
        isText: f.t === 'text', isArea: f.t === 'area', isSelect: f.t === 'select', isToggle: f.t === 'toggle', isNum: f.t === 'num', isColor: f.t === 'color',
        value: v,
        unit: f.unit || '',
        opts: (f.opts || []).map((o) => ({ o, sel: o === v })),
        on: !!v, track: v ? '#4C8DFF' : '#3A3F48', knob: v ? 16 : 2,
        swatches: (f.t === 'color' ? COLOR_OPTS : []).map((c) => ({ c, ring: c === v ? '#E6E8EB' : 'transparent', pick: () => set(f.k, c) })),
        change: (e) => set(f.k, f.t === 'num' ? (e.target.value === '' ? '' : Number(e.target.value)) : e.target.value),
        flip: () => set(f.k, !v),
        dec: () => set(f.k, Math.max(f.min ?? -1e9, (Number(v) || 0) - (f.step || 1))),
        inc: () => set(f.k, Math.min(f.max ?? 1e9, (Number(v) || 0) + (f.step || 1)))
      };
    });
    const close = () => this.setState({ propsDlg: null });
    // Filters for this source or scene, live (not part of OK/Cancel).
    const fkey = d.key;
    const flist = this.state.filters[fkey] || [];
    const setF = (l) => this.setState({ filters: { ...this.state.filters, [fkey]: l } });
    const eyeOn = 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z';
    const eyeOff = 'M3 3l18 18 M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9 M6.6 6.6C3.8 8.4 2 12 2 12s4 7 10 7a9.7 9.7 0 0 0 4.4-1';
    const fChains = this.chainsOf(fkey).map((ch) => {
      const items = flist.filter((f) => FILTER_TYPES[f.type] && FILTER_TYPES[f.type].kind === ch).map((f) => {
        const T = FILTER_TYPES[f.type];
        // The filter's key setting, for the table's second column.
        const fmt = (x) => { const v = f.p[x.k] ?? x.def; return (typeof v === 'number' ? (x.dec ? v.toFixed(x.dec) : String(v)).replace('-', '−') : v) + (x.unit ? ' ' + x.unit : ''); };
        const nums = T.params.filter((x) => x.t === 'num');
        const changed = nums.filter((x) => f.p[x.k] !== undefined && f.p[x.k] !== x.def);
        const summary = T.ref ? (f.p.scene || 'no scene')
          : nums.length === 1 ? fmt(nums[0])
          : changed.length ? changed.slice(0, 2).map((x) => x.label + ' ' + fmt(x)).join(' · ')
          : T.params.length ? 'defaults' : '';
        return {
          summary, sumColor: T.ref ? (f.p.scene ? '#B5CEFF' : '#E8A33D') : '#9AA1AC', sumStyle: T.ref ? 'italic' : 'normal', sumFont: T.ref ? 'inherit' : "'IBM Plex Mono', monospace",
          name: T.name, on: f.on, ref: T.ref ? (f.p.scene ? '· ' + f.p.scene : '· no scene') : '',
          color: f.on ? '#E6E8EB' : '#7D8590', strike: f.on ? 'none' : 'line-through',
          eye: f.on ? eyeOn : eyeOff, eyeColor: f.on ? '#C9CED6' : '#5A606B',
          toggleLabel: (f.on ? 'Turn off ' : 'Turn on ') + T.name,
          toggle: () => setF((this.state.filters[fkey] || []).map((x) => (x.id === f.id ? { ...x, on: !x.on } : x))),
          edit: () => { const keep = this.state.propsDlg; this.openFilter(fkey, f.id); this.setState({ propsDlg: keep }); },
          // Drag to reorder, within its own chain (video or audio), like the trees.
          dropLine: this.state.pdDrop && this.state.pdDrop.id === f.id ? (this.state.pdDrop.after ? 'inset 0 -2px 0 #4C8DFF' : 'inset 0 2px 0 #4C8DFF') : 'none',
          dragStart: (e) => { this.pdDrag = { id: f.id, ch }; e.dataTransfer.setData('application/x-jstream-filter', f.id); e.dataTransfer.effectAllowed = 'move'; },
          dragEnd: () => { this.pdDrag = null; this.setState({ pdDrop: null }); },
          dragOver: (e) => {
            if (!this.pdDrag || this.pdDrag.ch !== ch) return;
            e.preventDefault();
            const r = e.currentTarget.getBoundingClientRect();
            const after = e.clientY > r.top + r.height / 2;
            const cur = this.state.pdDrop;
            if (!cur || cur.id !== f.id || cur.after !== after) this.setState({ pdDrop: { id: f.id, after } });
          },
          drop: (e) => {
            if (!this.pdDrag || this.pdDrag.ch !== ch) return;
            e.preventDefault();
            const src = this.pdDrag.id, after = this.state.pdDrop ? this.state.pdDrop.after : false;
            this.pdDrag = null;
            this.setState({ pdDrop: null });
            if (src === f.id) return;
            const all = this.state.filters[fkey] || [];
            const moving = all.find((x) => x.id === src);
            const rest = all.filter((x) => x.id !== src);
            let j = rest.findIndex((x) => x.id === f.id);
            if (after) j += 1;
            rest.splice(j, 0, moving);
            setF(rest);
          },
          remove: () => setF((this.state.filters[fkey] || []).filter((x) => x.id !== f.id))
        };
      });
      return { title: ch === 'video' ? 'VIDEO' : 'AUDIO', icon: ch === 'video' ? TICON.monitor : TICON.speaker, items, empty: items.length === 0, emptyText: ch === 'video' ? 'No video filters.' : 'No audio filters.' };
    });
    return {
      fChains,
      fNote: fkey.startsWith('scene:') ? 'whole scene' : 'everywhere this source appears',
      addFilter: () => { const keep = this.state.propsDlg; this.openAddFilter(fkey); this.setState({ propsDlg: keep }); },
      open: true,
      title: S.title,
      sub: S.sub,
      icon: S.icon,
      name: d.name,
      fields,
      setName: (e) => this.setState({ propsDlg: { ...this.state.propsDlg, name: e.target.value } }),
      defaults: () => {
        const values = {};
        for (const f of this.schemaFields(d.kind)) values[f.k] = f.def;
        this.setState({ propsDlg: { ...this.state.propsDlg, values } });
      },
      cancel: close,
      backdrop: close,
      stop: (e) => e.stopPropagation(),
      key: (e) => this.dlgKey(e, close),
      ok: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const cur = this.state.propsDlg;
        const name = cur.name.trim();
        let trans = this.state.trans;
        const values = { ...cur.values };
        if (cur.kind === 'scene') {
          // Transition overrides live with the transitions, not in the scene's settings.
          const n = cur.key.slice(6);
          const idOf = (label) => (trans.presets.find((p) => p.name === label) || {}).id || null;
          const put = (m, id) => { const r = { ...m }; if (id) r[n] = id; else delete r[n]; return r; };
          trans = { ...trans, into: put(trans.into, idOf(values.trIn)), outOf: put(trans.outOf, idOf(values.trOut)) };
          delete values.trIn; delete values.trOut;
        }
        this.setState({
          trans,
          props: { ...this.state.props, [cur.key]: values },
          names: name ? { ...this.state.names, [cur.key]: name } : this.state.names,
          propsDlg: null
        });
      }
    };
  }

  // ---- Add filter dialog ----------------------------------------------------------
  // Which chains a target has: scenes and pictures get video; anything with sound, audio.
  chainsOf(target) {
    if (target === 'out:program') return ['video', 'audio'];
    if (target.startsWith('out:')) return (OUTPUTS.find((o) => o.key === target) || { chains: ['video', 'audio'] }).chains;
    if (target.startsWith('scene:')) return ['video'];
    const t = SOURCE_TYPES.find((x) => x.id === this.typeOf(this.srcKey(target).slice(4))) || {};
    return [...(t.audio ? [] : ['video']), ...(t.audio || t.hasAudio ? ['audio'] : [])];
  }

  // ---- Filter settings dialog: edits preview live; Cancel restores the original.
  // Dialog keys: Escape closes, Enter presses the primary button (not in a text area).
  dlgKey(e, close) {
    if (e.key === 'Escape') { e.preventDefault(); close(); return; }
    if (e.key === 'Enter' && !['TEXTAREA', 'BUTTON', 'SELECT'].includes(e.target.tagName)) {
      const b = e.currentTarget.querySelector('[data-primary]:not([disabled])');
      if (b) { e.preventDefault(); b.click(); }
    }
  }

  openFilter(target, id) {
    if (target.startsWith('obj:') && this.kfLocked()) return;
    const f = (this.state.filters[target] || []).find((x) => x.id === id);
    if (!f) return;
    this.setState({ ctx: null, fltEdit: { target, id, orig: copy(f) } });
  }

  feVals() {
    const d = this.state.fltEdit;
    if (!d) return { open: false, fields: [] };
    const list = this.state.filters[d.target] || [];
    const f = list.find((x) => x.id === d.id);
    if (!f) return { open: false, fields: [] };
    const T = FILTER_TYPES[f.type];
    const put = (patch) => this.setState({ filters: { ...this.state.filters, [d.target]: (this.state.filters[d.target] || []).map((x) => (x.id === d.id ? { ...x, ...patch } : x)) } });
    const setP = (k, v) => { const cur = (this.state.filters[d.target] || []).find((x) => x.id === d.id); put({ p: { ...cur.p, [k]: v } }); };
    const restore = () => this.setState({ filters: { ...this.state.filters, [d.target]: (this.state.filters[d.target] || []).map((x) => (x.id === d.id ? d.orig : x)) }, fltEdit: null });
    const scenes = this.sceneChoices(d.target);
    const fields = T.params.map((p) => {
      const v = f.p[p.k] ?? p.def;
      const base = { label: p.label, value: v, unit: p.unit || '', isNum: false, isSelect: false, isText: false, isColor: false };
      if (p.t === 'num') {
        const q = Math.pow(10, p.dec || (p.step < 1 ? 2 : 0));
        const clamp = (x) => Math.min(p.max, Math.max(p.min, Math.round(x * q) / q));
        return { ...base, isNum: true, change: (e) => { const n = parseFloat(e.target.value); if (Number.isFinite(n)) setP(p.k, clamp(n)); }, dec: () => setP(p.k, clamp(v - p.step)), inc: () => setP(p.k, clamp(v + p.step)) };
      }
      if (p.t === 'select') return { ...base, isSelect: true, opts: p.opts.map((o) => ({ v: o, l: o })), change: (e) => setP(p.k, e.target.value) };
      if (p.t === 'scene') return { ...base, isSelect: true, opts: [{ v: '', l: 'Choose a scene…' }, ...scenes.map((n) => ({ v: n, l: n }))], change: (e) => setP(p.k, e.target.value) };
      if (p.t === 'text') return { ...base, isText: true, change: (e) => setP(p.k, e.target.value) };
      return { ...base, isColor: true, swatches: [...new Set([p.def, ...COLOR_OPTS])].map((c) => ({ c, ring: c === v ? '#E6E8EB' : 'transparent', pick: () => setP(p.k, c) })) };
    });
    return {
      open: true, name: T.name, hint: T.hint,
      sub: (T.kind === 'video' ? 'Video' : 'Audio') + ' filter on “' + this.nameOf(d.target) + '”',
      icon: T.kind === 'video' ? TICON.monitor : TICON.speaker,
      on: f.on, track: f.on ? '#4C8DFF' : '#3A3F48', knob: f.on ? 18 : 2,
      flip: () => put({ on: !f.on }),
      fields, noParams: fields.length === 0,
      defaults: () => put({ p: T.ref && f.p.scene ? { scene: f.p.scene } : {} }),
      remove: () => this.setState({ filters: { ...this.state.filters, [d.target]: (this.state.filters[d.target] || []).filter((x) => x.id !== d.id) }, fltEdit: null }),
      cancel: restore, backdrop: restore, stop: (e) => e.stopPropagation(),
      key: (e) => this.dlgKey(e, restore),
      ok: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ fltEdit: null }); }
    };
  }

  // Opens a target's filters (a source, scene or output) in the Filters panel.
  openFx(key) {
    this.setState({ sel: key, selIds: [], ctx: null });
    this.showPanel('filters');
  }

  // Master strip and outputs for the Mixer and Outputs panels.
  masterVals() {
    const s = this.state;
    const on = (k) => (s.filters[k] || []).filter((f) => f.on).length;
    const has = (t) => (s.filters['out:program'] || []).some((f) => f.on && f.type === t);
    return {
      // Simulated meter readings; the loudness target pulls integrated loudness to its target.
      lufs: has('loudness') ? '−14.2' : '−17.8', short: has('loudness') ? 71 : 58,
      tp: has('tplimit') ? '−1.1' : '+0.4', tpOver: !has('tplimit'),
      fx: on('out:program'),
      monitorPost: s.monitorPost,
      privacy: s.privacy,
      toggleMonitor: () => this.setState({ monitorPost: !this.state.monitorPost }),
      openFx: () => this.openFx('out:program'),
      outputs: OUTPUTS.map((o) => ({ ...o, fx: on(o.key), open: () => this.openFx(o.key) }))
    };
  }

  openAddFilter(target) {
    if (target.startsWith('obj:') && this.kfLocked()) return;
    const chains = this.chainsOf(target);
    const first = Object.keys(FILTER_TYPES).find((k) => chains.includes(FILTER_TYPES[k].kind));
    this.setState({ ctx: null, fltAdd: { target, type: first, q: '', scene: '' } });
  }

  // Scenes a filter on `target` may use: not one that contains it (no loops).
  sceneChoices(target) {
    const st = this.state;
    const inside = new Set([st.scene]);
    if (target.startsWith('scene:')) inside.add(target.slice(6));
    else {
      const path = (nodes, trail) => {
        for (const n of nodes) {
          if (n.key === target) return trail;
          if (n.children) { const r = path(n.children, n.key.startsWith('scene:') ? [...trail, n.key.slice(6)] : trail); if (r) return r; }
        }
        return null;
      };
      for (const n of path(st.trees.objects, []) || []) inside.add(n);
    }
    return Component.flatKeys(st.trees.scenes).filter((k) => k.startsWith('scene:')).map((k) => k.slice(6))
      .filter((n) => !inside.has(n) && !(st.keyframes[n] && inside.has(st.keyframes[n].parent)));
  }

  faVals() {
    const d = this.state.fltAdd;
    if (!d) return { open: false, chains: [], sceneOpts: [] };
    const set = (p) => this.setState({ fltAdd: { ...this.state.fltAdd, ...p } });
    const close = () => this.setState({ fltAdd: null });
    const chains = this.chainsOf(d.target);
    const q = d.q.trim().toLowerCase();
    const match = (k) => !q || (FILTER_TYPES[k].name + ' ' + FILTER_TYPES[k].hint + ' ' + FILTER_TYPES[k].group).toLowerCase().includes(q);
    const T = FILTER_TYPES[d.type];
    const add = (type) => {
      const cur = this.state.fltAdd;
      const FT = FILTER_TYPES[type];
      const id = 'f' + Date.now().toString(36) + (this.fseq = (this.fseq || 0) + 1);
      const list = this.state.filters[cur.target] || [];
      const p = FT.ref && cur.scene ? { scene: cur.scene } : {};
      const nf = { id, type, on: true, p };
      // A filter with settings opens its settings dialog straight away.
      // Busy filters open their dialog; easy ones (three settings or fewer) open in the list.
      const hasSettings = FT.params.length > 3;
      this.setState({ filters: { ...this.state.filters, [cur.target]: [...list, nf] }, fltAdd: null, fltNew: id, fltEdit: hasSettings ? { target: cur.target, id, orig: copy(nf) } : null });
    };
    const out = chains.map((ch) => {
      const types = Object.keys(FILTER_TYPES).filter((k) => FILTER_TYPES[k].kind === ch && match(k));
      return {
        title: ch === 'video' ? 'VIDEO' : 'AUDIO', icon: ch === 'video' ? TICON.monitor : TICON.speaker,
        groups: [...new Set(types.map((k) => FILTER_TYPES[k].group))].map((g) => ({
          title: g,
          types: types.filter((k) => FILTER_TYPES[k].group === g).map((k) => ({
            name: FILTER_TYPES[k].name, on: k === d.type, bg: k === d.type ? '#22324A' : 'transparent',
            pick: () => set({ type: k }),
            dbl: () => { if (!FILTER_TYPES[k].ref) add(k); else set({ type: k }); }
          }))
        }))
      };
    }).filter((c) => c.groups.length);
    const needsScene = !!(T && T.ref);
    const okDisabled = !T || (needsScene && !d.scene);
    return {
      open: true, chains: out, none: out.length === 0, q: d.q,
      setQ: (e) => set({ q: e.target.value }),
      where: 'For “' + this.nameOf(d.target) + '”',
      where2: d.target.startsWith('scene:') ? 'Scene filters apply to the whole scene.' : 'Applies everywhere this source appears.',
      name: T ? T.name : '', hint: T ? T.hint : '', group: T ? T.group : '',
      chainName: T ? (T.kind === 'video' ? 'Video' : 'Audio') : '',
      isRef: needsScene, scene: d.scene,
      sceneOpts: [{ v: '', l: 'Choose a scene…' }, ...this.sceneChoices(d.target).map((n) => ({ v: n, l: n }))],
      setScene: (e) => set({ scene: e.target.value }),
      hasParams: !!(T && T.params.filter((p) => p.t !== 'scene').length),
      params: T ? T.params.filter((p) => p.t !== 'scene').map((p) => p.label).join(' · ') : '',
      okDisabled, okOp: okDisabled ? 0.45 : 1,
      cancel: close, backdrop: close, stop: (e) => e.stopPropagation(),
      key: (e) => this.dlgKey(e, close),
      ok: (e) => { if (e && e.preventDefault) e.preventDefault(); if (!okDisabled) add(d.type); }
    };
  }

  // ---- Sources: types, Add source dialog, groups --------------------------------------
  typeOf(id) {
    const b = this.baseId(id);
    return this.state.kinds[b] || TYPE_OF[b] || 'image';
  }
  typeInfo(id) {
    const t = SOURCE_TYPES.find((x) => x.id === this.typeOf(id)) || SOURCE_TYPES[0];
    const x = this.state.xf[id];
    return {
      title: t.name, icon: t.icon, subtitle: t.name, audioOnly: !!t.audio, hasAudio: !!t.hasAudio, native: t.size || [1920, 1080],
      t: x ? [x.x, x.y, x.w, x.h, x.rot] : [0, 0, 0, 0, 0], c: [0, 0, 0, 0], effects: [], filters: []
    };
  }
  audioSources() {
    const keys = Component.flatKeys(this.state.trees.objects).filter((k) => k.startsWith('obj:'));
    return keys.filter((k) => (SOURCE_TYPES.find((t) => t.id === this.typeOf(k.slice(4))) || {}).audio)
      .map((k) => ({ id: k.slice(4), n: this.nameOf(k) }));
  }

  // Inserts a node at the top of `parent`'s children, or at the top of the list.
  static insertNode(tree, node, parent) {
    const at = parent ? Component.locate(tree, parent) : null;
    const host = at && at.list[at.i].children;
    (host || tree).unshift(node);
  }

  openAddSource(parent, type) {
    if (this.kfLocked()) return;
    this.setState({ ctx: null, addDlg: { parent: parent || null, type: type || 'display', choice: type === 'scene' ? null : 'new', name: '' } });
  }

  addVals() {
    const d = this.state.addDlg;
    if (!d) return { open: false, cats: [], existing: [] };
    const st = this.state;
    const set = (p) => this.setState({ addDlg: { ...this.state.addDlg, ...p } });
    const close = () => this.setState({ addDlg: null });
    const T = SOURCE_TYPES.find((t) => t.id === d.type);
    const cats = [...new Set(SOURCE_TYPES.map((t) => t.cat))].map((cat) => ({
      title: cat.toUpperCase(),
      types: SOURCE_TYPES.filter((t) => t.cat === cat).map((t) => ({
        name: t.name, icon: TICON[t.icon], on: t.id === d.type, bg: t.id === d.type ? '#22324A' : 'transparent',
        pick: () => set({ type: t.id, choice: t.id === 'scene' ? null : 'new', name: '' }),
        dbl: () => { if (t.id === 'scene') return; set({ type: t.id, choice: 'new', name: '' }); setTimeout(() => this.addVals().ok(), 0); }
      }))
    }));
    const isScene = d.type === 'scene';
    let existing;
    if (isScene) {
      // Scenes that can be nested here: not this scene, and not one already nested.
      const here = new Set(Component.flatKeys(st.trees.objects));
      existing = Component.flatKeys(st.trees.scenes).filter((k) => k.startsWith('scene:') && k !== 'scene:' + st.scene && !here.has(k))
        .map((k) => ({ k, label: this.nameOf(k) }));
    } else {
      const seen = new Set();
      existing = Component.flatKeys(st.trees.objects).filter((k) => k.startsWith('obj:') && this.typeOf(k.slice(4)) === d.type)
        .map((k) => this.srcKey(k)).filter((k) => !seen.has(k) && seen.add(k))
        .map((k) => ({ k, label: this.nameOf(k) }));
    }
    const choice = (isScene && d.choice === 'new' ? null : d.choice) || (existing[0] ? existing[0].k : null);
    const defName = T.name + ' ' + (Component.flatKeys(st.trees.objects).filter((k) => k.startsWith('obj:') && this.typeOf(k.slice(4)) === d.type).length + 1);
    const ok = (e) => {
      if (e && e.preventDefault) e.preventDefault();
      const cur = this.state.addDlg;
      const ch = choice;
      if (!ch || (isScene && ch === 'new')) return;
      if (ch === 'new') this.createSource(cur.type, (cur.name || '').trim() || defName, cur.parent);
      else if (isScene) this.addSceneSource(ch, cur.parent);
      else this.duplicate(ch, 'reference', cur.parent || '#top');
    };
    return {
      open: true, cats,
      where: d.parent ? 'Into “' + this.nameOf(d.parent) + '”' : 'Into “' + st.scene + '”',
      icon: TICON[T.icon], typeName: T.name, desc: T.desc,
      canNew: !isScene, isNew: choice === 'new', name: d.name, setName: (e) => set({ name: e.target.value, choice: 'new' }),
      pickNew: () => set({ choice: 'new' }),
      hasExisting: existing.length > 0,
      existingTitle: isScene ? 'Nest a scene' : 'Or add an existing ' + T.name.toLowerCase() + ' as a reference',
      existing: existing.map((x) => ({ ...x, on: choice === x.k, pick: () => set({ choice: x.k }) })),
      note: isScene ? (existing.length ? 'A nested scene is a reference: edit it in its own scene.' : 'No other scenes can be nested here.')
        : T.audio ? 'Audio only: it shows in the Mixer, not on the canvas.' : '',
      okLabel: choice === 'new' ? 'Create' : 'Add',
      okDisabled: !choice, okOp: choice ? 1 : 0.45,
      cancel: close, backdrop: close, stop: (e) => e.stopPropagation(),
      key: (e) => this.dlgKey(e, close),
      ok
    };
  }

  createSource(type, name, parent) {
    const st = this.state;
    const T = SOURCE_TYPES.find((t) => t.id === type);
    let n = 0, id;
    do { n++; id = type + String.fromCharCode(96 + n); } while (st.xf[id] || st.kinds[id] || TYPE_OF[id]);
    const key = 'obj:' + id;
    const tree = copy(st.trees.objects);
    Component.insertNode(tree, { key }, parent);
    const patch = {
      kinds: { ...st.kinds, [id]: type }, names: { ...st.names, [key]: name },
      trees: { ...st.trees, objects: tree }, addDlg: null, sel: key, selIds: []
    };
    if (!T.audio) {
      const [w0, h0] = T.size;
      const k = Math.min(1, CW / w0, CH / h0);
      const w = Math.round(w0 * k), h = Math.round(h0 * k);
      patch.xf = { ...st.xf, [id]: { x: Math.round((CW - w) / 2), y: Math.round((CH - h) / 2), w, h, rot: 0, opacity: 100, cl: 0, cr: 0, ct: 0, cb: 0 } };
      patch.selIds = [id];
    }
    this.setState(patch);
    // Like OBS, a new source opens its properties straight away.
    setTimeout(() => this.openProps(key), 0);
  }

  addSceneSource(sceneKey, parent) {
    const tree = copy(this.state.trees.objects);
    Component.insertNode(tree, { key: sceneKey }, parent);
    this.setState({ trees: { ...this.state.trees, objects: tree }, addDlg: null, sel: sceneKey, selIds: [] });
  }

  // In Scene objects a group is a scene of its own, nested here. (In Scenes, folders are
  // only for organising.) With objects selected, they move into the new group.
  newGroup(ids) {
    if (this.kfLocked()) return;
    const st = this.state;
    const used = new Set([...Component.flatKeys(st.trees.scenes), ...Component.flatKeys(st.trees.objects)]);
    let n = 0, key;
    do { n++; key = 'scene:Group ' + n; } while (used.has(key));
    const tree = copy(st.trees.objects);
    const kids = [];
    let anchor = null;
    for (const id of this.layerIdsOf(ids || [])) {
      const at = Component.locate(tree, 'obj:' + id);
      if (!at) continue;
      if (!anchor) anchor = { list: at.list, i: at.i };
      kids.push(at.list.splice(at.i, 1)[0]);
    }
    const node = { key, children: kids };
    if (anchor) anchor.list.splice(Math.min(anchor.i, anchor.list.length), 0, node); else tree.unshift(node);
    this.setState({
      trees: { ...st.trees, objects: tree, scenes: [...st.trees.scenes, { key }] },
      sel: key, selIds: [], ctx: null
    });
    this.toast('Created the scene “Group ' + n + '”. It is nested here and also listed in Scenes.');
  }

  // Sources that can carry sound, and whether this one's sound is on.
  hasAudio(key) {
    if (key.startsWith('scene:')) return true;
    return !!(SOURCE_TYPES.find((t) => t.id === this.typeOf(key.slice(4))) || {}).hasAudio;
  }
  audioOn(key) {
    const k = this.srcKey(key);
    if (!this.hasAudio(k)) return false;
    const kind = this.propKind(k);
    const f = PROP_SCHEMA[kind].fields.find((x) => x.k === 'audio');
    const saved = (this.state.props[k] || {}).audio;
    return saved !== undefined ? !!saved : (f ? !!f.def : true);
  }
  setAudio(key, on) {
    const k = this.srcKey(key);
    this.setState({ props: { ...this.state.props, [k]: { ...(this.state.props[k] || {}), audio: on } } });
  }
  // Mixer channels: global devices, then scene sources whose audio is on.
  mixerList() {
    const out = [{ id: 'mic', n: 'Mic · ES-9 Line', db: -3 }, { id: 'desk', n: 'Desktop audio', db: -8.5 }];
    const seen = new Set();
    for (const k of Component.flatKeys(this.state.trees.objects)) {
      if (!k.startsWith('obj:')) continue;
      const sk = this.srcKey(k);
      if (seen.has(sk) || !this.hasAudio(sk) || !this.audioOn(sk)) continue;
      seen.add(sk);
      out.push({ id: sk.slice(4), n: this.nameOf(sk), db: -12 });
    }
    return out;
  }

  // ---- Scenes and transitions -----------------------------------------------------
  // The canvas edits the current scene; other scenes keep their own placements in
  // sceneData. Switching animates from what is on screen now to the target scene.
  // A scene's data as it is now: the live canvas for the current scene.
  liveData(name) {
    return name === this.state.scene ? { xf: this.state.xf, objects: this.state.trees.objects } : this.sceneDataFor(name);
  }

  sceneDataFor(name) {
    const st = this.state;
    const kf = st.keyframes[name];
    if (kf) {
      // The parent's objects and placements, with this keyframe's overrides on top.
      const par = this.liveData(kf.parent);
      const over = (st.sceneData[name] || {}).over || {};
      const xf = {};
      for (const id of Object.keys(par.xf)) xf[id] = { ...par.xf[id], ...(over[id] || {}) };
      return { xf, objects: copy(par.objects) };
    }
    if (st.sceneData[name]) return st.sceneData[name];
    // A nested scene or group with no saved data: build it from its children here.
    const at = Component.locate(st.trees.objects, 'scene:' + name);
    const kids = at ? at.list[at.i].children || [] : [];
    const xf = {};
    for (const k of Component.flatKeys(kids)) if (k.startsWith('obj:') && st.xf[k.slice(4)]) xf[k.slice(4)] = { ...st.xf[k.slice(4)] };
    return { xf, objects: copy(kids) };
  }

  // What to store for the current scene. A keyframe keeps only the placement and
  // visibility that differ from its parent.
  saveCurrent() {
    const st = this.state;
    const kf = st.keyframes[st.scene];
    if (!kf) return { xf: st.xf, objects: st.trees.objects };
    const par = this.sceneDataFor(kf.parent);
    const over = {};
    for (const id of Object.keys(st.xf)) {
      const a = st.xf[id], b = par.xf[id] || {};
      const d = {};
      for (const k of PLACE_KEYS) if ((a[k] ?? null) !== (b[k] ?? null)) d[k] = a[k];
      if (Object.keys(d).length) over[id] = d;
    }
    return { kf: true, over };
  }

  // In a keyframe only placement and visibility can change.
  kfLocked() {
    const kf = this.state.keyframes[this.state.scene];
    if (!kf) return false;
    this.toast('This is a keyframe of “' + kf.parent + '”: only placement and visibility can change here. Edit everything else in “' + kf.parent + '”.');
    return true;
  }

  newKeyframe(parent) {
    const st = this.state;
    const parentName = st.keyframes[parent] ? st.keyframes[parent].parent : parent;
    const kids = Object.values(st.keyframes).filter((k) => k.parent === parentName).length;
    const label = 'Keyframe ' + (kids + 1);
    const name = parentName + ' · ' + label;
    const tree = copy(st.trees.scenes);
    const at = Component.locate(tree, 'scene:' + parentName);
    if (!at) return;
    const node = at.list[at.i];
    node.children = [...(node.children || []), { key: 'scene:' + name, label }];
    this.setState({ trees: { ...st.trees, scenes: tree }, keyframes: { ...st.keyframes, [name]: { parent: parentName, label } }, sceneData: { ...st.sceneData, [name]: { kf: true, over: {} } }, ctx: null });
    // Go straight to it so it can be arranged.
    setTimeout(() => this.switchScene(name), 0);
  }

  resetKeyframe(name) {
    const st = this.state;
    if (name === st.scene) {
      const par = this.sceneDataFor(st.keyframes[name].parent);
      this.setState({ xf: copy(par.xf), ctx: null });
    } else this.setState({ sceneData: { ...st.sceneData, [name]: { kf: true, over: {} } }, ctx: null });
  }

  deleteKeyframe(name) {
    const st = this.state;
    const kf = st.keyframes[name];
    if (!kf) return;
    if (st.scene === name) this.switchScene(kf.parent);
    const tree = copy(this.state.trees.scenes);
    const at = Component.locate(tree, 'scene:' + name);
    if (at) at.list.splice(at.i, 1);
    const keyframes = { ...this.state.keyframes }; delete keyframes[name];
    this.setState({ trees: { ...this.state.trees, scenes: tree }, keyframes, ctx: null });
  }

  // A switch uses the destination's "into" override, else the source's "out of"
  // override, else the default preset.
  transFor(from, to) {
    const t = this.state.trans;
    const ok = (id) => id && t.presets.some((p) => p.id === id);
    const id = ok(t.into[to]) ? t.into[to] : ok(t.outOf[from]) ? t.outOf[from] : t.defaultId;
    const p = t.presets.find((x) => x.id === id) || t.presets[0];
    const why = ok(t.into[to]) ? 'into' : ok(t.outOf[from]) ? 'out' : 'default';
    return { ...p, why, presetId: p.id };
  }

  // Where a submenu opens: the menu's edges and the opening item's top.
  subAt(el) {
    if (!el || !el.getBoundingClientRect) return null;
    const menu = el.closest('[data-ctxmenu]');
    const m = menu ? menu.getBoundingClientRect() : el.getBoundingClientRect();
    return { left: m.left, right: m.right, top: el.getBoundingClientRect().top };
  }

  transHint(scene, dir) {
    const t = this.state.trans;
    const p = t.presets.find((x) => x.id === t[dir][scene]);
    return p ? p.name : 'Default';
  }

  // Override menu for one scene and direction ('into' | 'outOf').
  transMenu(scene, dir) {
    const t = this.state.trans;
    const cur = t[dir][scene] || null;
    const def = t.presets.find((p) => p.id === t.defaultId);
    const set = (id) => () => {
      const m = { ...this.state.trans[dir] };
      if (id) m[scene] = id; else delete m[scene];
      this.setState({ trans: { ...this.state.trans, [dir]: m }, ctx: null, ctxSub: null });
    };
    const what = (p) => (p.kind === 'Cut' ? 'Cut' : p.kind + ' ' + p.duration + ' ms');
    return [
      { kind: 'item', label: 'Default (' + (def ? def.name : '') + ')', check: cur ? '' : '✓', go: set(null) },
      { kind: 'head', label: 'Override' },
      ...t.presets.map((p) => ({ kind: 'item', label: p.name, hint: what(p), check: cur === p.id ? '✓' : '', go: set(p.id) })),
      { kind: 'sep' },
      { kind: 'item', label: 'Manage presets…', go: () => { this.setState({ ctx: null, ctxSub: null }); this.showPanel('transitions'); } }
    ];
  }

  sceneSources(name) {
    const d = this.liveData(name);
    return new Set(Component.flatKeys(d.objects).filter((k) => k.startsWith('obj:') && d.xf[k.slice(4)] && !d.xf[k.slice(4)].hidden).map((k) => this.srcId(k.slice(4))));
  }
  sharesSource(a, b) {
    const A = this.sceneSources(a);
    for (const x of this.sceneSources(b)) if (A.has(x)) return true;
    return false;
  }

  static ease(name, p) {
    if (p <= 0) return 0;
    if (p >= 1) return 1;
    if (name === 'Linear') return p;
    if (name === 'Ease out') return 1 - Math.pow(1 - p, 3);
    if (name === 'Spring') return 1 - Math.exp(-6 * p) * Math.cos(11 * p);
    return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  }

  // What is on screen right now: [{ id, t, a }] bottom to top, mid-transition included.
  frameNow() {
    if (this.state.anim) return this.sampleAnim(performance.now()).map((f) => ({ id: f.id, t: f.t, a: f.a }));
    return this.drawOrder().map((id) => ({ id, t: { ...this.state.xf[id] }, a: 1 }));
  }

  switchScene(name) {
    const st = this.state;
    if (!name) return;
    if (name === st.scene) { this.setState({ sel: 'scene:' + name, selIds: [] }); return; }
    const from = this.frameNow();
    const cfg = this.transFor(st.scene, name);
    const data = this.sceneDataFor(name);
    const sceneData = { ...st.sceneData, [st.scene]: this.saveCurrent() };
    // Shared values (opacity, blend) follow the source into the new scene.
    const xf = copy(data.xf);
    for (const id of Object.keys(xf)) {
      const cur = st.xf[this.srcId(id)];
      if (cur) for (const k of SHARED_XF) if (cur[k] !== undefined) xf[id][k] = cur[k];
    }
    const patch = {
      scene: name, sceneData, xf, trees: { ...st.trees, objects: copy(data.objects) },
      sel: 'scene:' + name, selIds: [], cropMode: false, ctx: null
    };
    this.op = null;
    if (cfg.kind === 'Cut' || cfg.duration <= 0) { this.setState({ ...patch, anim: null }); return; }
    const toOrder = Component.flatKeys(data.objects).filter((k) => k.startsWith('obj:') && xf[k.slice(4)]).map((k) => k.slice(4)).reverse();
    const to = toOrder.map((id) => ({ id, t: { ...xf[id] } }));
    // Move pairs items by source; Fade pairs nothing, so everything cross-fades.
    const used = new Set();
    const pairs = [];
    // An item set to "never move" on either side fades instead of pairing.
    for (const it of to) {
      const set = this.itemSet(name, it.id);
      let j = -1;
      if (cfg.kind === 'Move' && set.match !== 'Never') j = from.findIndex((f, i) => !used.has(i) && this.srcId(f.id) === this.srcId(it.id) && this.itemSet(st.scene, f.id).match !== 'Never');
      if (j >= 0) used.add(j);
      pairs.push({ id: it.id, from: j >= 0 ? from[j] : null, to: it.t, set });
    }
    const leaving = from.filter((_, i) => !used.has(i)).map((f) => ({ ...f, set: this.itemSet(st.scene, f.id) }));
    this.setState({ ...patch, anim: { t0: performance.now(), cfg, pairs, leaving }, animNow: performance.now() });
    this.runAnim();
  }

  runAnim() {
    if (this.animRaf) return;
    const tick = () => {
      this.animRaf = null;
      const a = this.state.anim;
      if (!a) return;
      const now = performance.now();
      const end = a.cfg.duration + Math.max(0, ...a.pairs.map((p, i) => i * a.cfg.stagger + p.set.delay), ...a.leaving.map((f) => f.set.delay));
      if (now - a.t0 >= end) { this.setState({ anim: null }); return; }
      this.setState({ animNow: now });
      this.animRaf = requestAnimationFrame(tick);
    };
    this.animRaf = requestAnimationFrame(tick);
  }

  // Interpolated placements at time `now`.
  sampleAnim(now) {
    const a = this.state.anim;
    const { cfg } = a;
    const lerp = (x, y, k) => x + (y - x) * k;
    const angle = (x, y, k) => { let d = ((y - x) % 360 + 540) % 360 - 180; return Math.round((x + d * k) * 10) / 10; };
    const ez = (set) => (set.easing === 'Inherit' ? cfg.easing : set.easing);
    const fxOf = (v) => (v === 'Inherit' ? cfg.unmatched : v);
    const prog = (i, set) => Component.ease(ez(set), (now - a.t0 - i * cfg.stagger - set.delay) / cfg.duration);
    // Leaving or arriving without a partner: fade, scale or slide toward the nearest edge.
    const away = (t, k, fx) => {
      const out = { ...t };
      if (fx === 'Scale') {
        const s = 1 - 0.35 * k;
        out.x = t.x + (t.w - t.w * s) / 2; out.y = t.y + (t.h - t.h * s) / 2; out.w = t.w * s; out.h = t.h * s;
      } else if (fx === 'Slide') {
        const cx = t.x + t.w / 2, cy = t.y + t.h / 2;
        const d = [cx, CW - cx, cy, CH - cy];
        const m = d.indexOf(Math.min(...d));
        if (m === 0) out.x = t.x - (t.x + t.w) * k; else if (m === 1) out.x = t.x + (CW - t.x) * k;
        else if (m === 2) out.y = t.y - (t.y + t.h) * k; else out.y = t.y + (CH - t.y) * k;
      }
      return out;
    };
    const list = a.leaving.map((f) => {
      const fx = fxOf(f.set.out);
      const k = fx === 'None' ? 1 : Component.ease(ez(f.set), (now - a.t0 - f.set.delay) / cfg.duration);
      return { id: f.id, t: away(f.t, k, fx), a: f.a * (1 - Math.min(1, Math.max(0, k))) };
    });
    a.pairs.forEach((p, i) => {
      const k = prog(i, p.set);
      if (!p.from) {
        const fx = fxOf(p.set.in);
        const kk = fx === 'None' ? 1 : Math.min(1, Math.max(0, k));
        list.push({ id: p.id, t: away(p.to, 1 - kk, fx), a: kk });
        return;
      }
      const f = p.from.t, g = p.to;
      const t = { ...g };
      for (const key of ['x', 'y', 'w', 'h', 'cl', 'cr', 'ct', 'cb', 'z']) t[key] = lerp(f[key] || 0, g[key] || 0, k);
      t.persp = lerp(f.persp || 1200, g.persp || 1200, k);
      t.rot = angle(f.rot || 0, g.rot || 0, k);
      t.rx = angle(f.rx || 0, g.rx || 0, k);
      t.ry = angle(f.ry || 0, g.ry || 0, k);
      list.push({ id: p.id, t, a: lerp(p.from.a, 1, Math.min(1, Math.max(0, k))) });
    });
    return list;
  }

  // Per-item transition settings, for one item in one scene.
  itemSet(scene, id) {
    return { delay: 0, easing: 'Inherit', match: 'Auto', in: 'Inherit', out: 'Inherit', ...(this.state.itemTrans[scene + '|' + id] || {}) };
  }

  // What the canvas draws: the scene, or the transition frame while one runs.
  renderList() {
    if (this.state.anim) return this.sampleAnim(this.state.animNow || performance.now());
    return this.drawOrder().map((id) => ({ id, t: this.state.xf[id], a: 1 }));
  }

  transVals() {
    const t = this.state.trans;
    const scenes = Component.flatKeys(this.state.trees.scenes).filter((k) => k.startsWith('scene:')).map((k) => k.slice(6));
    const save = (patch) => this.setState({ trans: { ...this.state.trans, ...patch } });
    const setPreset = (id, patch) => save({ presets: this.state.trans.presets.map((p) => (p.id === id ? { ...p, ...patch } : p)) });
    return {
      ...t, scenes, current: this.state.scene, sel: this.state.sel,
      inOf: (scene) => this.state.trans.into[scene] || null,
      outOfScene: (scene) => this.state.trans.outOf[scene] || null,
      setOverride: (scene, dir, id) => {
        const m = { ...this.state.trans[dir] };
        if (id) m[scene] = id; else delete m[scene];
        save({ [dir]: m });
      },
      usage: (id) => {
        const tr = this.state.trans;
        return { into: Object.values(tr.into).filter((x) => x === id).length, out: Object.values(tr.outOf).filter((x) => x === id).length };
      },
      // path 'p.<id>.<key>'
      set: (path, v) => { const [, id, k] = path.split('.'); setPreset(id, { [k]: v }); },
      get: (path) => { const [, id, k] = path.split('.'); return (this.state.trans.presets.find((p) => p.id === id) || {})[k]; },
      setPreset,
      addPreset: () => {
        const id = 'p' + Date.now().toString(36);
        save({ presets: [...this.state.trans.presets, { id, name: 'New preset', kind: 'Fade', duration: 500, easing: 'Ease in-out', unmatched: 'Fade', stagger: 0 }] });
        return id;
      },
      removePreset: (id) => {
        const tr = this.state.trans;
        if (id === tr.defaultId) return;
        const clean = (m) => Object.fromEntries(Object.entries(m).filter(([, v]) => v !== id));
        save({ presets: tr.presets.filter((p) => p.id !== id), into: clean(tr.into), outOf: clean(tr.outOf) });
      },
      setDefault: (id) => save({ defaultId: id }),
      resolve: (from, to) => this.transFor(from, to),
      sceneHas: (scene, id) => this.sceneSources(scene).has(this.srcId(id)),
      item: (id) => this.itemSet(this.state.scene, id),
      setItem: (id, k, v) => {
        const key = this.state.scene + '|' + id;
        this.setState({ itemTrans: { ...this.state.itemTrans, [key]: { ...(this.state.itemTrans[key] || {}), [k]: v } } });
      },
      selectScene: (n) => this.setState({ sel: 'scene:' + n, selIds: [] }),
      go: (n) => this.switchScene(n)
    };
  }




  // ---- Context menus --------------------------------------------------------------
  // One menu for the whole workspace, at the pointer (fixed position), so a panel's
  // edges never clip it. scope: 'canvas' | 'scenes' | 'objects'; key: the row or item.
  openCtx(scope, key, clientX, clientY) {
    const patch = {};
    if (key && key.startsWith('obj:')) {
      const id = key.slice(4);
      if (!this.state.selIds.includes(id)) { patch.selIds = [id]; patch.sel = key; }
    } else if (key && key.startsWith('scene:') && scope !== 'canvas') {
      patch.sel = key; patch.selIds = [];
    } else if ((scope === 'canvas' || scope === 'canvasOuter') && !key) {
      patch.sel = 'scene:' + this.state.scene; patch.selIds = [];
    }
    this.setState({ ...patch, ctx: { x: clientX, y: clientY, scope, key }, ctxSub: null, ctxSubAt: null });
    // Focus the first enabled item so the keyboard works straight away.
    setTimeout(() => {
      const b = document.querySelector('[data-ctxmenu] button:not([disabled])');
      if (b) b.focus({ preventScroll: true });
    }, 0);
  }

  toggleFav(key) {
    key = this.srcKey(key);
    const m = copy(this.state.meta);
    if (m.favs[key]) delete m.favs[key]; else m.favs[key] = true;
    this.setState({ meta: m });
  }
  toggleLabel(key, lid) {
    key = this.srcKey(key);
    const m = copy(this.state.meta);
    const cur = m.assign[key] || [];
    m.assign[key] = cur.includes(lid) ? cur.filter((x) => x !== lid) : [...cur, lid];
    this.setState({ meta: m });
  }

  // Moves a tree node within its own list: 'top' | 'up' | 'down' | 'bottom'.
  treeShift(kind, key, how) {
    const tree = copy(this.state.trees[kind]);
    const at = Component.locate(tree, key);
    if (!at) return;
    const [node] = at.list.splice(at.i, 1);
    const j = { top: 0, bottom: at.list.length, up: Math.max(0, at.i - 1), down: Math.min(at.list.length, at.i + 1) }[how];
    at.list.splice(j, 0, node);
    this.setState({ trees: { ...this.state.trees, [kind]: tree } });
  }

  ctxItems() {
    const s = this.state;
    const c = s.ctx;
    const ids = s.selIds;
    const close = (fn) => () => { this.setState({ ctx: null }); fn(); };
    const item = (label, go, enabled = true, hint = '') => ({ kind: 'item', label, hint, check: '', go: enabled ? close(go) : () => {}, disabled: !enabled, cls: enabled ? 'menuitem' : 'menuitem dis', op: enabled ? 1 : 0.4 });
    const check = (label, on, go, swatch) => ({ ...item(label, go), check: on ? '✓' : '', swatch: swatch || 'transparent' });
    const sep = () => ({ kind: 'sep' });
    const head = (label) => ({ kind: 'head', label });
    const transSubs = (name) => [
      { ...item('Transition in', () => {}), sub: this.transMenu(name, 'into'), hint: this.transHint(name, 'into') },
      { ...item('Transition out', () => {}), sub: this.transMenu(name, 'outOf'), hint: this.transHint(name, 'outOf') }
    ];
    const tx = this.txVals();
    const act = (label) => tx.actions.find((a) => a.label === label).go;
    const layerAct = (how) => () => {
      const list = how === 'front' || how === 'backward' ? [...this.layerIdsOf(ids)].reverse() : this.layerIdsOf(ids);
      for (const id of list) this.shiftLayer(id, how);
    };
    const selectAll = () => { const all = this.drawOrder(); this.setState({ selIds: all, sel: 'obj:' + all[all.length - 1] }); };
    const objectItems = (many) => [
      item('Bring to front', layerAct('front')),
      item('Bring forward', layerAct('forward')),
      item('Send backward', layerAct('backward')),
      item('Send to back', layerAct('back')),
      sep(),
      item('Center on canvas', act('Center on canvas')),
      item('Fit to canvas', act('Fit to canvas')),
      item('Stretch to canvas', act('Stretch to canvas')),
      item('Reset rotation', act('Reset rotation')),
      item('Clear crop', act('Clear crop')),
      sep(),
      item(s.cropMode ? 'Leave crop mode' : 'Crop', () => this.setState({ cropMode: !s.cropMode }), !many, 'C'),
      item('Duplicate as reference', () => this.duplicate(c.key, 'reference'), !many && !!c.key && c.key.startsWith('obj:'), 'Ctrl+D'),
      item('Duplicate as clone', () => this.duplicate(c.key, 'clone'), !many && !!c.key && c.key.startsWith('obj:'), 'Ctrl+Shift+D'),
      item('Remove from scene', () => {}, false, 'Del')
    ];

    if (c.scope === 'canvasOuter') {
      return [
        ...this.popItems('scene:' + s.scene),
        sep(),
        item('Select all', selectAll, true, 'Ctrl+A'),
        item(s.snap ? 'Turn snapping off' : 'Turn snapping on', () => this.setState({ snap: !s.snap })),
        sep(),
        ...transSubs(s.scene),
        sep(),
        item('Scene properties…', () => this.openProps('scene:' + s.scene)),
        item('Edit scene filters…', () => { this.setState({ sel: 'scene:' + this.state.scene, selIds: [] }); this.showPanel('filters'); })
      ];
    }
    if (c.scope === 'canvas' && !c.key) {
      return [
        item('Select all', selectAll, true, 'Ctrl+A'),
        item(s.snap ? 'Turn snapping off' : 'Turn snapping on', () => this.setState({ snap: !s.snap })),
        sep(),
        item('Add source…', () => this.openAddSource(null)),
        item('Paste', () => {}, false, 'Ctrl+V')
      ];
    }
    // Empty space in a tree panel.
    if (!c.key && c.scope === 'scenes') {
      return [
        item('New scene', () => this.treeAddScene()),
        item('New folder', () => this.treeAdd('scenes')),
        sep(),
        item('Paste scene', () => {}, false, 'Ctrl+V')
      ];
    }
    if (!c.key && c.scope === 'objects') {
      return [
        item('Add source…', () => this.openAddSource(null)),
        item('Add scene as source…', () => this.openAddSource(null, 'scene')),
        item('New group', () => this.newGroup()),
        sep(),
        item('Select all', selectAll, true, 'Ctrl+A'),
        item('Paste', () => {}, false, 'Ctrl+V')
      ];
    }
    const key = c.key;
    const isFolder = key.startsWith('f:') || key.startsWith('grp:');
    if (isFolder) {
      const kind = c.scope === 'canvas' ? 'objects' : c.scope;
      return [
        ...(kind === 'scenes' ? [item('New scene', () => this.treeAddScene())] : [item('Add source…', () => this.openAddSource(key))]),
      item(kind === 'scenes' ? 'New folder' : 'New group', () => this.treeAdd(kind)),
        item('Rename', () => {}, false, 'F2'),
        sep(),
        item(kind === 'scenes' ? 'Delete folder' : 'Ungroup', () => {}, false, 'Del')
      ];
    }
    if (c.scope === 'scenes' && s.keyframes[key.slice(6)]) {
      const name = key.slice(6);
      return [
        item('Switch to it', () => this.switchScene(name)),
        item('Rename', () => {}, false, 'F2'),
        sep(),
        ...transSubs(name),
        sep(),
        item('Reset to “' + s.keyframes[name].parent + '”', () => this.resetKeyframe(name)),
        item('New keyframe', () => this.newKeyframe(name)),
        sep(),
        item('Delete keyframe', () => this.deleteKeyframe(name), true, 'Del')
      ];
    }
    if (c.scope === 'scenes') {
      return [
        item('Show in preview', () => {}, false),
        item('Rename', () => {}, false, 'F2'),
        sep(),
        ...transSubs(key.slice(6)),
        sep(),
        item('Properties…', () => this.openProps(key), true, 'Double-click'),
        item('Edit filters…', () => this.showPanel('filters')),
        ...this.popItems(key),
        sep(),
        item('New scene', () => this.treeAddScene()),
        item('New keyframe', () => this.newKeyframe(key.slice(6))),
        item('New folder', () => this.treeAdd('scenes')),
        sep(),
        item('Duplicate scene', () => {}, false),
        item('Delete scene', () => {}, false, 'Del')
      ];
    }
    if (key.startsWith('scene:')) {
      // A nested scene in Scene objects.
      return [
        item('Properties…', () => this.openProps(key), true, 'Double-click'),
        item('Edit filters…', () => this.showPanel('filters')),
        ...this.popItems(key),
        sep(),
        check('Audio', this.audioOn(key), () => this.setAudio(key, !this.audioOn(key))),
        item('Add source…', () => this.openAddSource(key)),
        sep(),
        item('Open nested scene', () => {}, false),
        item('Remove from scene', () => {}, false, 'Del')
      ];
    }
    const many = ids.length > 1;
    const audioItem = !many && this.hasAudio(key) ? [check('Audio', this.audioOn(key), () => this.setAudio(key, !this.audioOn(key))), sep()] : [];
    if (key.startsWith('obj:') && !s.xf[key.slice(4)]) {
      // Audio-only source: no picture, so no canvas actions.
      return [
        item('Properties…', () => this.openProps(key), true, 'Double-click'),
        item('Edit filters…', () => this.showPanel('filters')),
        sep(), ...audioItem,
        item('Remove from scene', () => {}, false, 'Del')
      ];
    }
    return [
      ...(many ? [head(ids.length + ' items selected'), item('Group selection', () => this.newGroup(ids)), sep()] : []),
      ...audioItem,
      ...(many ? [] : [item('Properties…', () => this.openProps(key), true, 'Double-click'), item('Edit filters…', () => this.showPanel('filters')), ...this.popItems(key), sep()]),
      ...(!many && key.startsWith('obj:') && s.dups[key.slice(4)] ? (() => {
        const cloned = s.dups[key.slice(4)].mode === 'clone';
        return [head('Duplicate of ' + this.nameOf('obj:' + this.baseId(key.slice(4)))), check('Reference to original', !cloned, () => this.setDupMode(key, 'reference')), check('Independent clone', cloned, () => this.setDupMode(key, 'clone')), sep()];
      })() : []),
      ...(!many && REF_KEYS[key] ? (() => {
        const cloned = !!s.clones[key];
        const setClone = (on) => () => {
          if (on === cloned) return;
          this.setState({ clones: { ...this.state.clones, [key]: on } });
          this.toast(on ? this.nameOf(key) + ' is now a clone. Changes stay in this scene.' : this.nameOf(key) + ' is a reference again and follows the original in “' + REF_KEYS[key] + '”.');
        };
        return [head('Source'), check('Reference to original', !cloned, setClone(false)), check('Independent clone', cloned, setClone(true)), sep()];
      })() : []),
      ...objectItems(many),

      swatch: m.swatch || 'transparent', check: m.check || '', hint: m.hint || '', cls: m.cls || 'menuitem', op: m.op ?? 1,

  // ---- Transform panel actions ----------------------------------------------------
  txVals() {

    };

      left: { x: tgt.x }, hcenter: { x: tgt.x + (tgt.w - t.w) / 2 }, right: { x: tgt.x + tgt.w - t.w },
      top: { y: tgt.y }, vcenter: { y: tgt.y + (tgt.h - t.h) / 2 }, bottom: { y: tgt.y + tgt.h - t.h }

      top: 'M3 4h18 M6 8v11h5V8z M13 8v6h5V8z', vcenter: 'M3 12h18 M6 5v14h5V5z M13 8v8h5V8z', bottom: 'M3 20h18 M6 5v11h5V5z M13 10v6h5v-6z',

        btn('left', 'Align left', align('left'), has), btn('hcenter', 'Align horizontal centers', align('hcenter'), has), btn('right', 'Align right', align('right'), has),
        btn('top', 'Align top', align('top'), has), btn('vcenter', 'Align vertical centers', align('vcenter'), has), btn('bottom', 'Align bottom', align('bottom'), has)

      distBtns: [btn('dx', 'Distribute horizontally', distribute('x'), n >= 3), btn('dy', 'Distribute vertically', distribute('y'), n >= 3)],
      actions: [
        { label: 'Center on canvas', go: () => { if (!has) return; const b = this.bounds(ids, s.xf); const ox = (CW - b.w) / 2 - b.x, oy = (CH - b.h) / 2 - b.y; apply((t) => ({ x: t.x + ox, y: t.y + oy })); }, disabled: !has, op: has ? 1 : 0.35 },
        { label: 'Fit to canvas', go: () => apply((t) => { const f = Math.min(CW / t.w, CH / t.h); const w = t.w * f, h = t.h * f; return { w, h, x: (CW - w) / 2, y: (CH - h) / 2, rot: 0 }; }), disabled: !has, op: has ? 1 : 0.35 },
        { label: 'Stretch to canvas', go: () => apply(() => ({ x: 0, y: 0, w: CW, h: CH, rot: 0 })), disabled: !has, op: has ? 1 : 0.35 },
        { label: 'Match width', go: () => { const w = s.xf[primary].w; apply(() => ({ w })); }, disabled: n < 2, op: n >= 2 ? 1 : 0.35 },
        { label: 'Match height', go: () => { const h = s.xf[primary].h; apply(() => ({ h })); }, disabled: n < 2, op: n >= 2 ? 1 : 0.35 },

        { label: 'Rotate 90° right', go: () => apply((t) => ({ rot: (((t.rot || 0) + 90 + 540) % 360) - 180 })), disabled: !has, op: has ? 1 : 0.35 },

  // Removes a panel from wherever it is; empty groups disappear.
  without(zones, id) {
    const z = copy(zones);
    for (const k of Object.keys(z)) {
      z[k] = z[k].map((g) => {
        const tabs = g.tabs.filter((t) => t !== id);
        return { ...g, tabs, active: tabs.includes(g.active) ? g.active : tabs[0] };
      }).filter((g) => g.tabs.length > 0);
    }
    return z;
  }

  modified() {
    const c = this.state.current;

  }

  // mode: 'tab' joins group gid as a tab; 'before' inserts a new group before gid; 'end' appends a new group.
  place(id, zone, gid, mode) {
    const z = this.without(this.state.zones, id);
    if (mode === 'tab') {
      const g = z[zone].find((x) => x.gid === gid);
      if (g) { g.tabs.push(id); g.active = id; } else z[zone].push(grp(id));
    } else {
      const at = mode === 'before' || mode === 'after' ? z[zone].findIndex((x) => x.gid === gid) : -1;
      if (at >= 0) z[zone].splice(mode === 'after' ? at + 1 : at, 0, grp(id)); else z[zone].push(grp(id));

    this.setState({ zones: z, over: null, dragging: false, current: this.modified() });
  }

  visible(id) {
    return Object.values(this.state.zones).some((gs) => gs.some((g) => g.tabs.includes(id)));

      return;
    }
    this.setState({ closeArm: id });

  // ---- Resizing docks and the dividers between panels -----------------------------

      const z = copy(this.state.zones);

          closeClick: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.closeOrArm(id); },
          armCls: s.closeArm === id ? 'armed' : '',
          closeColor: s.closeArm === id ? '#FF5C63' : '#9AA1AC',
          closeTip: s.closeArm === id ? 'Click again to close ' + PANEL_TITLES[id] : 'Close ' + PANEL_TITLES[id] + ' (click twice)',

      pd: this.propsVals(),
      fa: this.faVals(),
      master: this.masterVals(),
      mixOrient: s.mixOrient || '',
      setMixOrient: (v) => this.setState({ mixOrient: v }),
      privacyOn: s.privacy,
      privacyBg: s.privacy ? '#7A1E23' : '#1F232A', privacyBorder: s.privacy ? '#E5484D' : '#2E333B',
      privacyLabel: s.privacy ? 'Privacy on' : 'Privacy',
      togglePrivacy: () => this.setState({ privacy: !this.state.privacy }),
      canvasFilter: s.privacy ? 'blur(14px) brightness(0.6)' : 'none',
      fe: this.feVals(),
      editFilter: (target, id) => this.openFilter(target, id),
      addFilter: (target) => this.openAddFilter(target),
      fltNew: s.fltNew,
      ad: this.addVals(),
      srcInfo: (id) => this.typeInfo(id),
      mixer: this.mixerList(),
      clones: s.clones,
      dups: s.dups,
      srcOf: (k) => this.srcKey(k),
      baseOf: (id) => this.baseId(id),
      names: s.names,
      openProps: (key) => this.openProps(key),
      toastOn: !!s.toastMsg,
      toastMsg: s.toastMsg || '',
      ctxStopAll: (e) => e.stopPropagation(),
      fltState: s.filters,
      setFilters: (target, list) => { if (target.startsWith('obj:') && this.kfLocked()) return; this.setState({ filters: { ...this.state.filters, [target]: list } }); },
      showPanel: (id) => this.showPanel(id),
      streamInfo: (() => { const b = s.streams.find((x) => x.id === s.streamId) || s.streams[0]; return { ...b, live: s.live }; })(),
      stopPd: (e) => { e.stopPropagation(); if (this.state.ctx) this.setState({ ctx: null }); },
      openCtx: (scope, key, x, y) => this.openCtx(scope, key, x, y),
      selids: s.selIds,
      tx: this.txVals(),
      meta: s.meta,
      setMeta: (m) => this.setState({ meta: m }),
      cv: this.canvasVals(),
      xf: s.xf,
      setXfProp: (id, prop, v) => this.setXf(id, { [prop]: v }),
      setXfPatch: (id, patch) => this.setXf(id, patch),
      drag: (e) => this.resizeMove(e),
      disarm: () => { if (this.state.closeArm) this.setState({ closeArm: null }); },
      release: () => this.resizeEnd(),
      viewOpen: s.menu === 'view',
      layoutsOpen: s.menu === 'layouts',
      viewBg: s.menu === 'view' ? '#2B313A' : 'transparent',
      layoutsBg: s.menu === 'layouts' ? '#2B313A' : 'transparent',
      toggleView: () => this.setState({ menu: this.state.menu === 'view' ? null : 'view' }),
      toggleLayouts: () => this.setState({ menu: this.state.menu === 'layouts' ? null : 'layouts' }),
      viewItems: Object.keys(PANEL_TITLES).map((id) => ({
        title: PANEL_TITLES[id],
        mark: this.visible(id) ? 'shown' : 'add',
        markColor: this.visible(id) ? '#7D8590' : '#8AB4FF',
        toggle: () => {
          let z;
          if (this.visible(id)) z = this.without(this.state.zones, id);
          else { z = copy(this.state.zones); z[HOME[id]].push(grp(id)); }
          this.setState({ zones: z, current: this.modified() });
        }
      })),
      layoutItems: s.layouts.map((l) => ({
        label: l.name,
        mark: s.current === l.name ? 'current' : '',
        apply: () => this.setState({ zones: copy(l.zones), sizes: copy(l.sizes), current: l.name, menu: null })
      })),
      saveLayout: () => {
        const name = 'My layout ' + (s.layouts.length - 1);
        this.setState({ layouts: [...s.layouts, { name, zones: copy(s.zones), sizes: copy(s.sizes) }], current: name, menu: null });
      },
      resetLayout: () => { const ed = EDITING(); this.setState({ zones: ed.zones, sizes: ed.sizes, current: 'Editing', menu: null }); }
    };
    for (const z of ZONES) vals[z] = this.zoneVals(z);
    return vals;
  }
}
</script>

  // Flattens a { key, label?, children? } tree into rows, skipping collapsed children.
  treeItems(kind) {

    };

        label: (this.props.names && this.props.names[this.src(n.key)]) || n.label || m.label || n.key.replace(/^[a-z]+:/, ''),
        icon: kf ? 'keyframe' : isFolder ? 'folder' : (m.icon || 'layers')

      for (const f of refs) {

          ref: { role: T.name, fx: T.ref === 'fx', scene: f.p.scene, on: f.on, owner: n.key }, label: f.p.scene, icon: 'layers' });
      }

  // Tree rows with labels, favorites and filtering. A parent stays visible when a child matches.
  treeRows(items, sel, pick, kind) {
    const st = this.state;
    const m = this.meta();
    const byId = Object.fromEntries(m.labels.map((l) => [l.id, l]));
    const selIds = this.props.selids ?? [];
    const q = st.search.trim().toLowerCase();
    const filtering = q !== '' || st.favOnly || st.labelFilter.length > 0;
    const isFolder = (it) => !!it.isFolder;
    const matches = (it) => {
      if (isFolder(it)) return false;
      if (q && !it.label.toLowerCase().includes(q)) return false;
      if (st.favOnly && !m.favs[this.src(it.key)]) return false;
      if (st.labelFilter.length && !(m.assign[this.src(it.key)] || []).some((l) => st.labelFilter.includes(l))) return false;
      return true;

        hiddenNow: !!(it.key.startsWith('obj:') && this.props.xf && this.props.xf[it.key.slice(4)] && this.props.xf[it.key.slice(4)].hidden),
        eyeCls: it.key.startsWith('obj:') && this.props.xf && this.props.xf[it.key.slice(4)] && this.props.xf[it.key.slice(4)].hidden ? 'on' : '',
        eyeIcon: it.key.startsWith('obj:') && this.props.xf && this.props.xf[it.key.slice(4)] && this.props.xf[it.key.slice(4)].hidden ? EYE_OFF : EYE_ON,
        toggleEye: () => { const id = it.key.slice(4); if (typeof this.props.xfset === 'function') this.props.xfset(id, 'hidden', !(this.props.xf[id] || {}).hidden); },
        isLink: !!rf,

        roleColor: rf ? (rf.on ? (rf.fx ? '#E8A33D' : '#B07CFF') : '#5A606B') : '#7D8590',
        roleTitle: rf ? rf.role + (rf.on ? '' : ' (off)') + ': uses the scene “' + rf.scene + '”' : '',
        label: it.label,
        indent: 6 + it.depth * 18,
        typeIcon: ICONS[iconId][1],
        typeColor: it.kf ? '#B07CFF' : dim ? '#4D535E' : '#9AA1AC',
        color: folder || dim || (it.key.startsWith('obj:') && this.props.xf && (this.props.xf[it.key.slice(4)] || {}).hidden) ? '#6B717C' : '#E6E8EB',
        badge: kind === 'scenes' && it.key === 'scene:' + (this.props.scenename || 'Desktop + Cam') ? 'program' : '',
        shared: '',

        fav,
        favOn: fav ? 'on' : '',

        starStroke: fav ? '#F2C14E' : '#9AA1AC',
        toggleFav: () => this.toggleFav(it.key),
        chips: labels.map((l) => ({ name: l.name, color: l.color, icon: ICONS[l.icon][1], tint: tint(l.color, 0.16) })),
        tagOpen: st.tagOpen === it.key,
        tagOn: st.tagOpen === it.key ? 'on' : '',

        assign: m.labels.map((l) => {

  }

  trVals() {
