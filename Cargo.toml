[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "crates/jstream-ui/tests/e2e/mock-daemon", "xtask"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeffmhopkins/JStream"
publish = false

[workspace.dependencies]
# Shared dependency versions live here (R-DEP-003). Member crates use `dep.workspace = true`.
# Coverage rasterising of glyph outlines for the text source (ADR-0061: pure-Rust font
# crates). No dependencies; `std` is its only default feature.
ab_glyph_rasterizer = { version = "0.1", default-features = false, features = ["std"] }
anyhow = "1"
# The render snapshot (ARCH › Threads, "State to RT threads"): the control side swaps an
# immutable snapshot that the render thread loads without a lock. No dependencies.
arc-swap = { version = "1.9", default-features = false }
# Test-only global allocator that flags allocations inside a marked scope (R-RT-001).
# Warn mode counts violations instead of aborting, so a test can assert on them, in
# debug and release builds alike.
assert_no_alloc = { version = "1", default-features = false, features = ["warn_debug", "warn_release"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
# CEF's C API for browser sources (ADR-0021, picked by spike S4; ADR-0046), pinned
# exactly: the version carries the CEF build it was generated from (154.0.34), and its
# sys crate's build script downloads that exact CEF distribution. No default features:
# `jstream-browser`'s `helper` feature turns `sandbox` on for CEF's bootstrap layout
# (ADR-0048), and `build-util`/`resources` are app-bundling helpers. Only that feature
# pulls it in.
cef = { version = "=154.5.0", default-features = false }
# Benchmarks (`benches/` in jstream-render, jstream-audio and jstream-encode), dev-only.
# No default features: no `rayon` or `plotters`, so no HTML plots; the JSON estimates under
# `target/criterion` are what the `bench` workflow records. `cargo_bench_support` keeps
# `cargo bench` and its `--bench` filters working. Held at 0.7: 0.8 adds `alloca`, which
# compiles C with `cc` and is not on lint-deps' native-code allowlist (R-DEP-002).
criterion = { version = "~0.7", default-features = false, features = ["cargo_bench_support"] }
# Lock-free bounded queues for the audio mixer's commands and the collector (R-RT-003).
# A send on a bounded channel does not allocate. `std` is the only feature.
crossbeam-channel = { version = "0.5", default-features = false, features = ["std"] }
# Deflate and CRC-32 for the portable Windows zip (`cargo xtask dist`, ADR-0020). Already in
# the tree through `png`, with the same pure-Rust backend (`miniz_oxide`).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-core = { version = "0.3", default-features = false }
# One-shot and unbounded channels for the browser WebSocket client (`jstream-control`'s
# `ws` feature on wasm32), which has no tokio. Already in the tree through Leptos.
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# OS randomness (the daemon's control token). 0.4 is already in the tree through
# `tempfile` and `uuid`, so this adds no version.
getrandom = { version = "0.4", default-features = false }
# GIF decoding for the image source (ADR-0061: pure-Rust image crates). No default
# features: `color_quant` only matters for encoding RGBA frames.
gif = { version = "0.14", default-features = false, features = ["std"] }
globset = { version = "0.4", default-features = false }
# WebP decoding (still and animated) for the image source (ADR-0061).
image-webp = { version = "0.2", default-features = false }
insta = { version = "1", default-features = false }
# JavaScript built-ins (`Array`) for the browser WebSocket client. Part of wasm-bindgen.
js-sys = { version = "0.3", default-features = false, features = ["std"] }
jstream-aac = { path = "crates/jstream-aac" }
jstream-audio = { path = "crates/jstream-audio" }
jstream-browser = { path = "crates/jstream-browser" }
jstream-control = { path = "crates/jstream-control" }
jstream-core = { path = "crates/jstream-core" }
jstream-effects = { path = "crates/jstream-effects" }
jstream-encode = { path = "crates/jstream-encode" }
jstream-graph = { path = "crates/jstream-graph" }
jstream-mcp = { path = "crates/jstream-mcp" }
jstream-media = { path = "crates/jstream-media" }
jstream-mux = { path = "crates/jstream-mux" }
jstream-outputs = { path = "crates/jstream-outputs" }
jstream-platform = { path = "crates/jstream-platform" }
jstream-platform-linux = { path = "crates/jstream-platform-linux" }
jstream-platform-macos = { path = "crates/jstream-platform-macos" }
jstream-platform-windows = { path = "crates/jstream-platform-windows" }
jstream-plugin-proto = { path = "crates/jstream-plugin-proto" }
jstream-protocol = { path = "crates/jstream-protocol" }
jstream-render = { path = "crates/jstream-render" }
jstream-server = { path = "crates/jstream-server" }
jstream-sources = { path = "crates/jstream-sources" }
jstream-vcam-proto = { path = "crates/jstream-vcam-proto" }
jstream-youtube = { path = "crates/jstream-youtube" }
# `clock_gettime(CLOCK_MONOTONIC)` and `close` for the Linux backends (ADR-0060). Already
# in the tree under tokio, getrandom and others; no build script compiling C.
libc = { version = "0.2", default-features = false }
# `dlopen` for the Linux backends' system libraries (libpipewire, libva), loaded at run
# time so the workspace builds without their headers (ADR-0060). Already in the tree at
# 0.9 under cef; no build script.
libloading = { version = "0.9", default-features = false, features = ["std"] }
# WGSL parsing and validation for effect packs (`jstream-effects`). Pinned to wgpu's
# exact version (ADR-0004), so it is the copy wgpu already brings in. `wgsl-in` is the
# only feature: no back ends, no `std`-only extras.
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-in"] }
# PNG for `video.snapshot` (ADR-0061: pure-Rust image crates are not banned codecs).
# Encoding is part of the crate. `default-features = false` leaves deflate on the
# pure-Rust backend.
png = { version = "0.18", default-features = false }
# The web UI framework (ADR-0045): client-side rendering only, no server functions or
# hydration. Its `csr` feature also turns on `getrandom`'s browser backend.
leptos = { version = "0.8", default-features = false, features = ["csr"] }
# `mach_absolute_time` and `mach_timebase_info` for the macOS media clock (ADR-0063 §5).
# Maintained bindings to <mach/mach_time.h> (R-UNSAFE-004), already in the tree at 0.6
# under wasmtime; no build script and no default features.
mach2 = { version = "0.6", default-features = false }
# Foundation through the objc2 framework crates (ADR-0063 §12), for the running macOS
# version (`NSProcessInfo`). The 0.3 line wgpu's Metal backend already uses; no build
# script. No default features: only `std` and the classes the macOS crate calls.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo"] }
# Property tests with shrinking (`jstream-graph`'s `tests/`), test-only. Held at 1.11:
# 1.12 moves to `rand` 0.10, a second `rand` beside the 0.9 already in the tree
# (R-DEP-005). No default features: no `fork`/`timeout` (`rusty-fork`, `tempfile`) and
# no `bit-set`.
proptest = { version = "~1.11", default-features = false, features = ["std"] }
pulldown-cmark = { version = "0.13", default-features = false }
# The FFT behind the spectrum source (C10): real-input, planned once per source, and
# allocation-free per frame with caller-owned scratch. Pulls in `rustfft` and its small
# `num-*`, `primal-check`, `strength_reduce` and `transpose` crates. No default features:
# the scalar FFT is fast enough for one 2048-point transform a video frame, and leaves
# out the SIMD paths.
realfft = { version = "3.5", default-features = false }
# SHA-256 and the OS random source for OAuth PKCE (`jstream-youtube`). Already in the tree
# as rustls' crypto provider (R-DEP-006), so this adds no crate; no default features.
ring = { version = "0.17", default-features = false }
# Test-only certificates for the RTMPS tests; `ring` instead of the default aws-lc-rs (R-DEP-006).
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
# TLS (R-DEP-006): rustls with the `ring` provider. No default features, so no aws-lc-rs
# and no `log`; `tls12` because not every ingest server speaks TLS 1.3.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Root certificates from the OS store. `webpki-roots` (Mozilla's set compiled in) is
# CDLA-Permissive-2.0, which is not on the deny.toml allow list (R-DEP-001).
rustls-native-certs = "0.8"
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
# `float_roundtrip`: numbers parse to the nearest `f64`, so a value serialized and parsed
# again is unchanged (a settings float survives a collection save and reload). Without
# it, a number with more digits than an `f64` holds can parse one ULP off, and then not
# round-trip. Found by the `protocol_decode` fuzz target.
serde_json = { version = "1", default-features = false, features = ["std", "float_roundtrip"] }
# Font parsing and glyph outlines for the text source (ADR-0061: pure-Rust font crates),
# from Google's fontations. Pulls in `read-fonts`, `font-types`, `bytemuck`, `yoke` and
# `once_cell`, plus derive macros at build time. Chosen over `ab_glyph` and `fontdue`
# because their `ttf-parser` is unmaintained (RUSTSEC-2026-0192). No default features:
# `autohint_shaping` only serves the autohinter, which is not used.
skrifa = { version = "0.48", default-features = false, features = ["std"] }
# The desktop app's window and webview (ADR-0045): WebView2 on Windows through `wry`.
# No default features: no compression of embedded assets (the app embeds none), no
# dynamic ACL, and no Linux `x11`/`dbus`; `wry` is the webview runtime, and
# `common-controls-v6` gives native dialogs the current Windows look.
tauri = { version = "2.12", default-features = false, features = ["wry", "common-controls-v6"] }
# Tauri's build script: generates the app context from `tauri.conf.json` and embeds the
# Windows resources (icon, manifest).
tauri-build = { version = "2.7", default-features = false, features = ["config-json"] }
# Test-only reference AAC decoder for jstream-aac's round-trip tests (ADR-0062: never
# shipped): Symphonia's pure-Rust AAC-LC decoder, MPL-2.0, and the core crate its decoder
# API is in. Neither has default features; `symphonia-core`'s optional `rustfft` stays off.
symphonia-codec-aac = { version = "0.6", default-features = false }
symphonia-core = { version = "0.6", default-features = false }
thiserror = { version = "2", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false }
# No TLS feature: plain `ws://` only, so no `rustls`/`ring` in the tree yet.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
toml = "1"
# Logging (R-RS-005). Libraries depend on `tracing` only, and only apps install a
# subscriber. `std` without the default `attributes`, so no proc-macro crates.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# The daemon's subscriber: `fmt` to stderr, filtered by `Targets` parsed from `RUST_LOG`.
# No `env-filter` (it pulls in `regex`), `ansi` or `tracing-log`.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# Rust/JavaScript bindings for the browser builds (`jstream-control`'s wasm32 WebSocket
# client, `jstream-ui`). Already in the tree through wgpu's wasm32 dependencies.
wasm-bindgen = { version = "0.2", default-features = false, features = ["std"] }
# Web API bindings; each crate enables the interfaces it uses.
web-sys = { version = "0.3", default-features = false, features = ["std"] }
# GPU (ADR-0004): pinned exactly, because wgpu-hal interop can change between releases;
# the version spike S1 proved the Windows interop on. Backends are picked per crate.
wgpu = { version = "=30.0.1", default-features = false, features = ["std"] }
# The WASM automation plugin host (`jstream-plugin-wasm`, ADR-0035). No default features:
# `cranelift` compiles a plugin once at load, `runtime` runs it, and nothing else: no WASI,
# no async (plugins reach `Control` through a blocking bridge), no component model, GC,
# threads, cache or profiling.
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std"] }
# The WASM text format, for `jstream-plugin-wasm`'s test plugins; test-only. Held at 1.258,
# the wasm-tools release wasmtime 49 is built on: a later one brings a second
# `wasm-encoder` (R-DEP-005). No default features: no component model.
wat = { version = "~1.258", default-features = false }
# Microsoft's official Windows bindings (R-UNSAFE-004), used only by the Windows platform
# crate. Pinned exactly so every Windows crate resolves one version (R-DEP-005); the
# platform crate picks its API features.
windows = { version = "=0.62.2", default-features = false }
# `#[implement]` (COM callbacks) expands to `windows_core::` paths, so it is a direct
# dependency at the version `windows` uses.
windows-core = { version = "=0.62.2", default-features = false }
# JPEG decoding for the image source (ADR-0061), and `zune-core` for its options. No
# `log`; the `x86` and `neon` features keep the SIMD paths, chosen at run time.
zune-core = { version = "0.5", default-features = false, features = ["std"] }
zune-jpeg = { version = "0.5", default-features = false, features = ["std", "x86", "neon"] }

# Editing this table is a governance change (R-GOV-001). See docs/RULES.md for each rule.
[workspace.lints.rust]
unsafe_code = "forbid"   # R-UNSAFE-001; platform crates declare their own [lints] table
missing_docs = "warn"    # R-RS-006 (blocking under -D warnings)

[workspace.lints.clippy]
unwrap_used = "deny"                      # R-RS-004
print_stdout = "deny"                     # R-RS-005
print_stderr = "deny"                     # R-RS-005
allow_attributes_without_reason = "deny"  # R-RS-009
undocumented_unsafe_blocks = "deny"       # R-UNSAFE-002

[profile.release]
panic = "unwind"   # R-UNSAFE-005: catch_unwind at FFI boundaries needs unwinding

# The audio DSP is optimised in debug builds too: unoptimised, its resampler is too slow
# for a real-time audio thread in a debug app, and for jstream-audio's minutes-long
# drift simulations in `cargo test`.
[profile.dev.package.jstream-audio]
opt-level = 3

# The AAC encoder likewise: unoptimised, its quantization loops can't keep up with
# real time in a debug app, and its round-trip tests encode seconds of audio.
[profile.dev.package.jstream-aac]
opt-level = 3
