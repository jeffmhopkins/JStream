[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "xtask"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeffmhopkins/JStream"
publish = false

[workspace.dependencies]
# Shared dependency versions live here (R-DEP-003). Member crates use `dep.workspace = true`.
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
futures-core = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
globset = { version = "0.4", default-features = false }
insta = { version = "1", default-features = false }
jstream-control = { path = "crates/jstream-control" }
jstream-mcp = { path = "crates/jstream-mcp" }
jstream-media = { path = "crates/jstream-media" }
jstream-mux = { path = "crates/jstream-mux" }
jstream-protocol = { path = "crates/jstream-protocol" }
jstream-server = { path = "crates/jstream-server" }
pulldown-cmark = { version = "0.13", default-features = false }
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false }
# No TLS feature: plain `ws://` only, so no `rustls`/`ring` in the tree yet.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
toml = "1"

# Editing this table is a governance change (R-GOV-001). See docs/RULES.md for each rule.
[workspace.lints.rust]
unsafe_code = "forbid"   # R-UNSAFE-001; platform crates declare their own [lints] table
missing_docs = "warn"    # R-RS-006 (blocking under -D warnings)

[workspace.lints.clippy]
unwrap_used = "deny"                      # R-RS-004
print_stdout = "deny"                     # R-RS-005
print_stderr = "deny"                     # R-RS-005
allow_attributes_without_reason = "deny"  # R-RS-009
undocumented_unsafe_blocks = "deny"       # R-UNSAFE-002

[profile.release]
panic = "unwind"   # R-UNSAFE-005: catch_unwind at FFI boundaries needs unwinding
