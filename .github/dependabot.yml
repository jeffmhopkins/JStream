# Dependabot: weekly grouped update PRs. Policy: docs/adr/0018-ci-supply-chain-policy.md
# Titles follow Conventional Commits so the pr-title check passes (R-GIT-002).
# Cooldown: new releases wait 5 days before Dependabot proposes them, so a freshly published
# compromised release is likely to be caught upstream first (maintainer decision on PR #7).
# Editing this file is a governance change (R-GOV-001).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      cargo:
        patterns: ["*"]
    # Crates that may only move together with a pin elsewhere. A 0.x minor is a breaking
    # bump, so these hold minors and majors; patches still come through. Remove an entry
    # once its pin moves (PR #389 bumped all three on their own and broke the build or
    # cargo-deny).
    ignore:
      # `#[implement]` needs windows-core at the version `windows` (pinned exactly) uses.
      - dependency-name: windows-core
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # axum 0.8's `ws` uses tokio-tungstenite 0.29; a newer one here is a second
      # WebSocket stack (R-DEP-005).
      - dependency-name: tokio-tungstenite
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # 1.12 moves to `rand` 0.10, a second `rand` beside tungstenite's 0.9 (R-DEP-005).
      - dependency-name: proptest
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: build
      include: scope

  # The web UI's end-to-end tests (Playwright). Its lockfile pins every package with an
  # integrity hash; CI installs it with install scripts off.
  - package-ecosystem: npm
    directory: /crates/jstream-ui/tests/e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: test
      include: scope
