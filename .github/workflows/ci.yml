# CI: the required checks from docs/RULES.md#R-GIT-003 that exist so far.
# `governance` runs from governance.yml, so label and description edits re-run only it.
# Not yet here (later M0 PRs): cargo-hack feature checks.
# Editing this file is a governance change (R-GOV-001).

# Third-party actions are pinned to full commit SHAs, with the release in a trailing comment.
# Dependabot proposes updates (ADR-0018). Manual pins: resolve with `git ls-remote --tags`, dereferencing annotated tags (^{}).

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install   # installs the toolchain pinned in rust-toolchain.toml
      - run: cargo fmt --all --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Platform tests (`hw-tests`) only run on real hardware, but they must still compile:
      # type-check them on the platform they target.
      - if: runner.os == 'Windows'
        run: cargo clippy -p jstream-platform-windows --all-targets --features hw-tests --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Headless compositor tests need a software Vulkan adapter. lavapipe ships in
      # mesa-vulkan-drivers; VK_DRIVER_FILES keeps the job off the other ICDs.
      - name: Software Vulkan (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          if [ -z "$icd" ]; then
            echo "::error::lavapipe ICD not found after installing mesa-vulkan-drivers"
            ls -la /usr/share/vulkan/icd.d || true
            exit 1
          fi
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --workspace --locked

  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --workspace --no-deps --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  # The web UI for wasm32 (ADR-0045): clippy over the browser WebSocket client and the UI,
  # then a release trunk build, uploaded for the `dist` job. trunk, the wasm-bindgen CLI and
  # binaryen (the `wasm-opt` a release build runs) are downloaded at pinned versions and
  # checked against pinned SHA-256 sums; the wasm-bindgen CLI must match Cargo.lock.
  wasm:
    runs-on: ubuntu-latest
    env:
      TRUNK_VERSION: 0.21.14
      TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b
      WASM_BINDGEN_VERSION: 0.2.129
      WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
      BINARYEN_VERSION: 132
      BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install   # rust-toolchain.toml includes wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy (wasm32)
        run: cargo clippy -p jstream-control -p jstream-ui --target wasm32-unknown-unknown --features jstream-control/ws --locked -- -D warnings
      - name: Install trunk, the wasm-bindgen CLI and wasm-opt
        run: |
          set -euo pipefail
          locked=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          if [ "$locked" != "$WASM_BINDGEN_VERSION" ]; then
            echo "::error::Cargo.lock has wasm-bindgen $locked: set WASM_BINDGEN_VERSION and WASM_BINDGEN_SHA256 in ci.yml to match"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSLf -o trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TRUNK_SHA256}  trunk.tar.gz" | sha256sum -c -
          tar xzf trunk.tar.gz -C bin trunk
          wb="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          curl -sSLf -o wasm-bindgen.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${wb}.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  wasm-bindgen.tar.gz" | sha256sum -c -
          tar xzf wasm-bindgen.tar.gz --strip-components=1 -C bin "${wb}/wasm-bindgen"
          by="binaryen-version_${BINARYEN_VERSION}"
          curl -sSLf -o binaryen.tar.gz "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/${by}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  binaryen.tar.gz" | sha256sum -c -
          tar xzf binaryen.tar.gz --strip-components=2 -C bin "${by}/bin/wasm-opt"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the UI
        working-directory: crates/jstream-ui
        run: trunk build --release --locked --offline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jstream-ui
          path: crates/jstream-ui/dist
          if-no-files-found: error
          retention-days: 1

  # The portable Windows zip (ADR-0020): `cargo xtask dist` with the wasm job's UI. The zip
  # is uploaded as is (`archive: false`), so the download is the zip a user unzips.
  dist:
    needs: wasm
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jstream-ui
          path: ui-dist
      - run: cargo xtask dist --ui-dir ui-dist --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commit title (R-GIT-002)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title is not a Conventional Commit: $TITLE"
            echo "Expected e.g. 'feat(render): add perspective crop' (docs/RULES.md#R-GIT-002)"
            exit 1
          fi

  # The documentation graph (docs/DOCS.md); R-DOC-* rules the tool implements so far.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask docs check

  # Crate layering, unsafe declarations, links= allowlist, workspace deps (xtask/src/lint_deps.rs).
  lint-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask lint-deps

  # The merge gate's decision logic (ADR-0019), tested against the deployed workflow file.
  gate-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node .github/tests/review-gate-decide.test.mjs

  # Not required until M3 (R-GIT-003).
  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked
