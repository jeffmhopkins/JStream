# CI: the required checks from docs/RULES.md#R-GIT-003 that exist so far.
# `governance` runs from governance.yml, so label and description edits re-run only it.
# Not yet here (later M0 PRs): cargo-hack feature checks.
# Editing this file is a governance change (R-GOV-001).

# Third-party actions are pinned to full commit SHAs, with the release in a trailing comment.
# Dependabot proposes updates (ADR-0056). Manual pins: resolve with `git ls-remote --tags`, dereferencing annotated tags (^{}).

name: ci

# Linux only. The Windows legs of `clippy` and `test`, `ui-e2e` and `macos` are in
# after-review.yml, which runs on main and, on a PR, once review passes (ADR-0054).
# A PR into a `wave/*` branch runs the quick jobs (fmt, Linux clippy, docs, lint-deps,
# gate-test, pr-title) and the Linux tests (ADR-0070); it skips doc, deny and wasm, which
# the wave's own PR into main runs with everything else (ADR-0055).
on:
  pull_request:
    # ready_for_review: draft PRs skip every job below, so CI runs when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install   # installs the toolchain pinned in rust-toolchain.toml
      - run: cargo fmt --all --check

  clippy:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]   # the Windows leg is in after-review.yml (ADR-0054)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The macOS platform crate, type-checked for Apple Silicon from Linux, so a macOS-only
      # compile error shows before review (ADR-0063 §14). Its bindings need no Apple SDK.
      - run: rustup target add aarch64-apple-darwin
      - run: cargo clippy -p jstream-platform-macos --all-targets --locked --target aarch64-apple-darwin -- -D warnings
      # The browser source's CEF backend and helper on Linux (ADR-0095), and the daemon's
      # wiring of them, type-checked against cef-dll-sys's bundled bindings without
      # downloading CEF (`dox`); the browser-linux job below builds them for real.
      - run: cargo clippy -p jstream-browser -p jstream-browser-helper -p jstream-daemon --all-targets --features jstream-browser/dox,jstream-browser/fake,jstream-browser-helper/dox,jstream-daemon/dox --locked -- -D warnings

  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]   # the Windows leg is in after-review.yml (ADR-0054)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Headless compositor tests need a software Vulkan adapter. lavapipe ships in
      # mesa-vulkan-drivers; VK_DRIVER_FILES keeps the job off the other ICDs.
      - name: Software Vulkan (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          if [ -z "$icd" ]; then
            echo "::error::lavapipe ICD not found after installing mesa-vulkan-drivers"
            ls -la /usr/share/vulkan/icd.d || true
            exit 1
          fi
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      - name: Test
        # Line tables keep backtraces' file and line but drop the full debug info, which
        # had grown the workspace's test build past the hosted runner's disk.
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: cargo test --workspace --locked

  # Streams to a real RTMP server and decodes what it got (apps/jstream-daemon/README.md#receiver-e2e):
  # lavapipe for the GPU compositor, Cisco's OpenH264 for H.264, ffmpeg as the server and
  # ffprobe to check the file. It first downloads OpenH264 from Cisco and checks both of the
  # pin's SHA-256 values (ADR-0061), then streams on the copy the harness downloads. Not
  # required: it reports, and a failure is looked into, but it doesn't block a merge.
  e2e-stream:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && !startsWith(github.base_ref, 'wave/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20   # the harness's own waits are bounded, but not every call in it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Software Vulkan (lavapipe) and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 ffmpeg
      - name: Download OpenH264 from Cisco and check the pin
        run: cargo test -p jstream-platform-linux --features openh264-download --locked -- --ignored downloads_the_pinned
      - name: Stream to a local receiver
        run: cargo xtask e2e-stream --openh264-download

  # The browser helper on Linux (ADR-0095): builds it with the pinned CEF, which its build
  # downloads, lays it out as it ships (`cargo xtask browser-linux`), and opens a page
  # through it end to end: sandboxed, headless and without a GPU, its frames reaching the
  # engine as CPU frames. Ubuntu's AppArmor stops the unprivileged user namespaces
  # Chromium's sandbox prefers, so its setuid helper stands in, as on any machine like it.
  # The laid-out folder is kept as an artifact. Not required: it reports, and a failure is
  # looked into.
  browser-linux:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && !startsWith(github.base_ref, 'wave/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The shared libraries CEF needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 \
            libasound2t64 libxkbcommon0 libdrm2
      - run: cargo xtask browser-linux --out target/browser-linux
      - name: Chromium's setuid sandbox
        run: |
          sandbox=target/browser-linux/browser/chrome-sandbox
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - name: Open a page through the helper
        env:
          JSTREAM_BROWSER_HELPER: ${{ github.workspace }}/target/browser-linux/browser/jstream-browser-helper
        run: cargo test -p jstream-browser --features cef --locked --test linux_page -- --ignored --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-linux
          path: target/browser-linux
          if-no-files-found: error
          retention-days: 14

  doc:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && !startsWith(github.base_ref, 'wave/'))
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps --locked

  deny:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && !startsWith(github.base_ref, 'wave/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  # The web UI for wasm32 (ADR-0045): clippy over the browser WebSocket client and the UI,
  # then a trunk build. trunk and the wasm-bindgen CLI are downloaded at pinned versions
  # and checked against pinned SHA-256 sums; the wasm-bindgen CLI must match Cargo.lock.
  # `ui-e2e` and `dist-ui` in after-review.yml pin the same versions: change them together.
  # The debug bundle's wasm must fit under the cap jstream-server serves files up to (#678).
  wasm:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && !startsWith(github.base_ref, 'wave/'))
    runs-on: ubuntu-latest
    env:
      TRUNK_VERSION: 0.21.14
      TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b
      WASM_BINDGEN_VERSION: 0.2.129
      WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install   # rust-toolchain.toml includes wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy (wasm32)
        run: cargo clippy -p jstream-control -p jstream-ui --target wasm32-unknown-unknown --features jstream-control/ws --locked -- -D warnings
      - name: Install trunk and the wasm-bindgen CLI
        run: |
          set -euo pipefail
          locked=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          if [ "$locked" != "$WASM_BINDGEN_VERSION" ]; then
            echo "::error::Cargo.lock has wasm-bindgen $locked: set WASM_BINDGEN_VERSION and WASM_BINDGEN_SHA256 in ci.yml to match"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSLf -o trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TRUNK_SHA256}  trunk.tar.gz" | sha256sum -c -
          tar xzf trunk.tar.gz -C bin trunk
          wb="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          curl -sSLf -o wasm-bindgen.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${wb}.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  wasm-bindgen.tar.gz" | sha256sum -c -
          tar xzf wasm-bindgen.tar.gz --strip-components=1 -C bin "${wb}/wasm-bindgen"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the UI
        working-directory: crates/jstream-ui
        run: trunk build --locked --offline
      - name: The wasm fits under the server's file cap
        working-directory: crates/jstream-ui
        run: |
          set -euo pipefail
          # Read from the server, not restated: `const MAX_FILE_BYTES: u64 = <MiB> << 20;`.
          mib=$(sed -nE 's/^const MAX_FILE_BYTES: u64 = ([0-9]+) << 20;$/\1/p' ../jstream-server/src/ui.rs)
          if [ -z "$mib" ]; then
            echo "::error::MAX_FILE_BYTES in crates/jstream-server/src/ui.rs is no longer \`<MiB> << 20\`: update this step"
            exit 1
          fi
          limit=$((mib << 20))
          shopt -s nullglob
          files=(dist/*_bg.wasm)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::trunk build left no dist/*_bg.wasm"
            exit 1
          fi
          for f in "${files[@]}"; do
            size=$(stat -c %s "$f")
            echo "$f: $size bytes (cap $limit)"
            if [ "$size" -gt "$limit" ]; then
              echo "::error::$f is $size bytes, over jstream-server's $mib MiB file cap, so the server refuses it and ui-e2e fails"
              exit 1
            fi
          done

  pr-title:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commit title (R-GIT-002)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title is not a Conventional Commit: $TITLE"
            echo "Expected e.g. 'feat(render): add perspective crop' (docs/RULES.md#R-GIT-002)"
            exit 1
          fi

  # The documentation graph (docs/DOCS.md); R-DOC-* rules the tool implements so far.
  docs:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask docs check

  # Crate layering, unsafe declarations, links= allowlist, workspace deps (xtask/src/lint_deps.rs).
  lint-deps:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask lint-deps

  # The merge gate's decision logic (ADR-0019), tested against the deployed workflow file.
  gate-test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node .github/tests/review-gate-decide.test.mjs
