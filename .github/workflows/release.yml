# release: builds the portable Windows zip from a version tag and publishes it as a GitHub
# release (docs/runbooks/release.md). The tag is `v` and the workspace version the shipped
# apps take (Cargo.toml's [workspace.package]); a version with a pre-release part
# (`0.1.0-alpha.1`) makes a pre-release. Builds are unsigned until a certificate exists
# (ADR-0066). A pushed tag starts it, or the maintainer runs it on main from the Actions
# tab (workflow_dispatch): then the tag is `v` and main's version, and `publish` creates it
# on that commit before the release. Nothing else starts it.
# Editing this file is a governance change (R-GOV-001).

# Third-party actions are pinned to full commit SHAs, with the release in a trailing comment.
# Dependabot proposes updates (ADR-0056).

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The web UI for release, as after-review.yml's `dist-ui` builds it, with the same pinned
  # tools (keep the versions and hashes in step with it). First it checks that the tag is
  # on main and matches the workspace version, so a mistyped tag stops before anything is
  # built.
  ui:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      TRUNK_VERSION: 0.21.14
      TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b
      WASM_BINDGEN_VERSION: 0.2.129
      WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
      BINARYEN_VERSION: 132
      BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # all of main's history, for the check that the tag is on it
      - run: rustup toolchain install
      - name: Check that the tagged commit is on main
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::run the release on main, not $GITHUB_REF_NAME (docs/runbooks/release.md)"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main: tag a commit of main (docs/runbooks/release.md)"
            exit 1
          fi
      # A dispatched run has no tag yet: it takes `v` and the version, and stops if that
      # tag already exists, since a tag is never moved.
      - name: Check the tag against the shipped apps' version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          versions=$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[] | select(.name | IN("jstream-desktop", "jstream-daemon", "jstream-cli", "jstream-vcam-windows", "jstream-browser-helper")) | .version' | sort -u)
          if [ "$(echo "$versions" | wc -l)" -ne 1 ]; then
            echo "::error::the shipped apps have different versions: $versions"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            TAG="v$versions"
            # ls-remote exits 2 when the ref is absent; anything else (found, or an error) stops.
            status=0
            git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null || status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::$TAG already exists, or the check failed (exit $status): bump the version to release main again (docs/runbooks/release.md)"
              exit 1
            fi
          fi
          if [ "$TAG" != "v$versions" ]; then
            echo "::error::tag $TAG doesn't match the workspace version $versions: tag v$versions instead"
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Install trunk, the wasm-bindgen CLI and wasm-opt
        run: |
          set -euo pipefail
          locked=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          if [ "$locked" != "$WASM_BINDGEN_VERSION" ]; then
            echo "::error::Cargo.lock has wasm-bindgen $locked: set WASM_BINDGEN_VERSION and WASM_BINDGEN_SHA256 in ci.yml, after-review.yml and release.yml to match"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSLf -o trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TRUNK_SHA256}  trunk.tar.gz" | sha256sum -c -
          tar xzf trunk.tar.gz -C bin trunk
          wb="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          curl -sSLf -o wasm-bindgen.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${wb}.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  wasm-bindgen.tar.gz" | sha256sum -c -
          tar xzf wasm-bindgen.tar.gz --strip-components=1 -C bin "${wb}/wasm-bindgen"
          by="binaryen-version_${BINARYEN_VERSION}"
          curl -sSLf -o binaryen.tar.gz "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/${by}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  binaryen.tar.gz" | sha256sum -c -
          tar xzf binaryen.tar.gz --strip-components=2 -C bin "${by}/bin/wasm-opt"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the UI for release
        working-directory: crates/jstream-ui
        run: trunk build --release --locked --offline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jstream-ui
          path: crates/jstream-ui/dist
          if-no-files-found: error
          retention-days: 1

  # The zip, from a clean build (no cache), as after-review.yml's `dist` builds it.
  zip:
    needs: ui
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jstream-ui
          path: ui-dist
      # As in after-review.yml: Ninja for CEF's wrapper build, Visual Studio's own copy
      # when the image has none on the path.
      - name: Put Ninja on the path
        shell: pwsh
        run: |
          if (Get-Command ninja -ErrorAction SilentlyContinue) { exit 0 }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $ninja = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja'
          if (-not (Test-Path (Join-Path $ninja 'ninja.exe'))) { throw "no ninja.exe under $vs" }
          Add-Content -Path $env:GITHUB_PATH -Value $ninja
      - shell: bash
        env:
          TAG: ${{ needs.ui.outputs.tag }}
        run: cargo xtask dist --ui-dir ui-dist --out dist --revision "$TAG"
      # The release's text: what the build is, the unsigned warning, the CEF build it
      # ships (ADR-0021 asks each release to name it) and the zip's SHA-256.
      - name: Write the checksum and the release notes
        shell: bash
        env:
          TAG: ${{ needs.ui.outputs.tag }}
          VERSION: ${{ needs.ui.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          zip="jstream-${TAG}-windows-x64.zip"
          sha256sum "$zip" > "$zip.sha256"
          cef=$(head -n 1 "jstream-${TAG}-windows-x64/browser/CEF-VERSION.txt" | tr -d '\r')
          {
            echo "JStream ${VERSION}, the portable Windows build (x64). Unzip it anywhere and run \`jstream.exe\`: see [Getting started](https://github.com/${REPO}/blob/${TAG}/docs/GETTING-STARTED.md)."
            echo
            echo "This build is **not code-signed**, so Windows SmartScreen may warn that it protected your PC: choose *More info*, then *Run anyway*."
            echo
            echo "Browser sources run the Chromium Embedded Framework, \`${cef}\` (licences in \`browser\\CREDITS.html\`)."
            echo
            echo "SHA-256: \`$(cut -d ' ' -f 1 "$zip.sha256")\`"
          } > notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.zip
            dist/*.sha256
            dist/notes.md
          if-no-files-found: error
          retention-days: 7

  # Publishing is its own job, so only it can write to the repository.
  publish:
    needs: [ui, zip]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creates the release and uploads its files; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.ui.outputs.tag }}
          VERSION: ${{ needs.ui.outputs.version }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          # A dispatched run creates its tag on the commit it built. Creating the ref fails
          # (422) if the tag appeared since `ui` checked, so the release never lands on a tag
          # of another commit; then both paths need the tag to exist.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          fi
          gh release create "$TAG" release/*.zip release/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag "${prerelease[@]}" \
            --title "JStream $VERSION" --notes-file release/notes.md --generate-notes
