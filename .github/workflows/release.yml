# release: builds the desktop app for every platform from a version tag, the portable
# Windows zip, the Linux .deb and AppImage, the macOS disk image and the Stream Deck plugin, and publishes them as
# one GitHub release (docs/runbooks/release.md, ROADMAP.md#beta). The tag is `v` and the workspace version the shipped
# apps take (Cargo.toml's [workspace.package]); a version with a pre-release part
# (`0.1.0-alpha.1`) makes a pre-release. Builds are unsigned: Windows until a certificate
# exists (ADR-0066), Linux as ADR-0141 leaves it, and macOS for good (ROADMAP.md#macos-unsigned). A pushed tag starts it, or the maintainer runs it on main from the Actions
# tab (workflow_dispatch): then the tag is `v` and main's version, and `publish` creates it
# on that commit before the release. Nothing else starts it.
# Editing this file is a governance change (R-GOV-001).

# Third-party actions are pinned to full commit SHAs, with the release in a trailing comment.
# Dependabot proposes updates (ADR-0056).

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The web UI for release, as after-review.yml's `dist-ui` builds it, with the same pinned
  # tools (keep the versions and hashes in step with it). First it checks that the tag is
  # on main and matches the workspace version, so a mistyped tag stops before anything is
  # built.
  ui:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      TRUNK_VERSION: 0.21.14
      TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b
      WASM_BINDGEN_VERSION: 0.2.129
      WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
      BINARYEN_VERSION: 132
      BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # all of main's history, for the check that the tag is on it
      - run: rustup toolchain install
      - name: Check that the tagged commit is on main
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::run the release on main, not $GITHUB_REF_NAME (docs/runbooks/release.md)"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main: tag a commit of main (docs/runbooks/release.md)"
            exit 1
          fi
      # A dispatched run has no tag yet: it takes `v` and the version, and stops if that
      # tag already exists, since a tag is never moved.
      - name: Check the tag against the shipped apps' version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          versions=$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[] | select(.name | IN("jstream-desktop", "jstream-daemon", "jstream-cli", "jstream-vcam-windows", "jstream-browser-helper")) | .version' | sort -u)
          if [ "$(echo "$versions" | wc -l)" -ne 1 ]; then
            echo "::error::the shipped apps have different versions: $versions"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            TAG="v$versions"
            # ls-remote exits 2 when the ref is absent; anything else (found, or an error) stops.
            status=0
            git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null || status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::$TAG already exists, or the check failed (exit $status): bump the version to release main again (docs/runbooks/release.md)"
              exit 1
            fi
          fi
          if [ "$TAG" != "v$versions" ]; then
            echo "::error::tag $TAG doesn't match the workspace version $versions: tag v$versions instead"
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Install trunk, the wasm-bindgen CLI and wasm-opt
        run: |
          set -euo pipefail
          locked=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          if [ "$locked" != "$WASM_BINDGEN_VERSION" ]; then
            echo "::error::Cargo.lock has wasm-bindgen $locked: set WASM_BINDGEN_VERSION and WASM_BINDGEN_SHA256 in ci.yml, after-review.yml and release.yml to match"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSLf -o trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TRUNK_SHA256}  trunk.tar.gz" | sha256sum -c -
          tar xzf trunk.tar.gz -C bin trunk
          wb="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          curl -sSLf -o wasm-bindgen.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${wb}.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  wasm-bindgen.tar.gz" | sha256sum -c -
          tar xzf wasm-bindgen.tar.gz --strip-components=1 -C bin "${wb}/wasm-bindgen"
          by="binaryen-version_${BINARYEN_VERSION}"
          curl -sSLf -o binaryen.tar.gz "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/${by}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  binaryen.tar.gz" | sha256sum -c -
          tar xzf binaryen.tar.gz --strip-components=2 -C bin "${by}/bin/wasm-opt"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the UI for release
        working-directory: crates/jstream-ui
        run: trunk build --release --locked --offline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jstream-ui
          path: crates/jstream-ui/dist
          if-no-files-found: error
          retention-days: 1

  # The zip, from a clean build (no cache), as after-review.yml's `dist` builds it.
  zip:
    needs: ui
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jstream-ui
          path: ui-dist
      # As in after-review.yml: Ninja for CEF's wrapper build, Visual Studio's own copy
      # when the image has none on the path.
      - name: Put Ninja on the path
        shell: pwsh
        run: |
          if (Get-Command ninja -ErrorAction SilentlyContinue) { exit 0 }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $ninja = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja'
          if (-not (Test-Path (Join-Path $ninja 'ninja.exe'))) { throw "no ninja.exe under $vs" }
          Add-Content -Path $env:GITHUB_PATH -Value $ninja
      # The DirectX Shader Compiler the zip ships beside the exes (ADR-0175): Microsoft's
      # release, pinned and checked against its SHA-256 here; `dist` checks each file it
      # copies against its own pinned hash.
      - name: The DirectX Shader Compiler
        shell: pwsh
        env:
          DXC_URL: https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.8.2502/dxc_2025_02_20.zip
          DXC_SHA256: 70b1913a1bfce4a3e1a5311d16246f4ecdf3a3e613abec8aa529e57668426f85
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'dxc.zip'
          curl.exe -sSLf -o $zip $env:DXC_URL
          if ($LASTEXITCODE -ne 0) { throw "downloading $env:DXC_URL failed" }
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:DXC_SHA256) { throw "dxc zip SHA-256 is $hash, expected $env:DXC_SHA256" }
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'dxc')
      - shell: bash
        env:
          TAG: ${{ needs.ui.outputs.tag }}
        run: cargo xtask dist --ui-dir ui-dist --out dist --revision "$TAG" --dxc-dir "$RUNNER_TEMP/dxc"
      # Windows's part of the release text: what the build is, the unsigned warning, the
      # CEF build it ships (ADR-0021 asks each release to name it), the DirectX Shader
      # Compiler release it ships (ADR-0175) and the zip's SHA-256.
      - name: Write the checksum and the release notes
        shell: bash
        env:
          TAG: ${{ needs.ui.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          zip="jstream-${TAG}-windows-x64.zip"
          sha256sum "$zip" > "$zip.sha256"
          cef=$(head -n 1 "jstream-${TAG}-windows-x64/browser/CEF-VERSION.txt" | tr -d '\r')
          dxc=$(head -n 1 "jstream-${TAG}-windows-x64/dxc/DXC-VERSION.txt" | tr -d '\r')
          {
            echo "### Windows"
            echo
            echo "\`${zip}\`, the portable build (x64). Unzip it anywhere and run \`jstream.exe\`: see [Getting started](https://github.com/${REPO}/blob/${TAG}/docs/GETTING-STARTED.md)."
            echo
            echo "This build is **not code-signed**, so Windows SmartScreen may warn that it protected your PC: choose *More info*, then *Run anyway*."
            echo
            echo "Browser sources run the Chromium Embedded Framework, \`${cef}\` (licences in \`browser\\CREDITS.html\`)."
            echo
            echo "Shaders compile with ${dxc%%,*} (\`dxcompiler.dll\` and \`dxil.dll\`, licences in the \`dxc\` folder)."
            echo
            echo "SHA-256: \`$(cut -d ' ' -f 1 "$zip.sha256")\`"
            echo
          } > notes-1-windows.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*.sha256
            dist/notes-*.md
          if-no-files-found: error
          retention-days: 7

  # The Linux .deb and AppImage, from a clean build (no cache), as after-review.yml's
  # `dist-linux` builds them, with the same pinned tools (keep the versions and hashes in
  # step with it). The empty revision gives the release's own Debian version
  # (`0.1.0~beta.1`). Both are renamed after the tag, as the zip is.
  linux:
    needs: ui
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LINUXDEPLOY_VERSION: 1-alpha-20251107-1
      LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
      LINUXDEPLOY_GTK_COMMIT: 7a3fbc31a9e5075073ff8790f26effbac5f84453
      LINUXDEPLOY_GTK_SHA256: b0f4cbc684a0103a9651f0955b635eaea0096b3a66c0f5a2c2aa337960375171
      APPIMAGE_RUNTIME_VERSION: "20251108"
      APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - name: WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: linuxdeploy, its GTK plugin and the AppImage runtime
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/appimage-tools"
          mkdir -p "$tools"
          cd "$tools"
          curl -sSLf -o linuxdeploy-x86_64.AppImage "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-x86_64.AppImage"
          echo "${LINUXDEPLOY_SHA256}  linuxdeploy-x86_64.AppImage" | sha256sum -c -
          curl -sSLf -o linuxdeploy-plugin-gtk.sh "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/${LINUXDEPLOY_GTK_COMMIT}/linuxdeploy-plugin-gtk.sh"
          echo "${LINUXDEPLOY_GTK_SHA256}  linuxdeploy-plugin-gtk.sh" | sha256sum -c -
          curl -sSLf -o runtime-x86_64 "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-x86_64"
          echo "${APPIMAGE_RUNTIME_SHA256}  runtime-x86_64" | sha256sum -c -
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jstream-ui
          path: ui-dist
      - name: Build the .deb and the AppImage
        env:
          TAG: ${{ needs.ui.outputs.tag }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/appimage-tools"
          cargo xtask dist-linux --ui-dir ui-dist --out build --revision "" \
            --linuxdeploy "$tools/linuxdeploy-x86_64.AppImage" \
            --appimage-runtime "$tools/runtime-x86_64"
          debs=(build/*.deb); images=(build/*.AppImage)
          if [ "${#debs[@]}" -ne 1 ] || [ "${#images[@]}" -ne 1 ]; then
            echo "::error::expected one .deb and one AppImage, got: ${debs[*]} ${images[*]}"
            exit 1
          fi
          # As after-review checks: the sandbox setuid root, and ADR-0062's AAC notice.
          dpkg-deb --contents "${debs[0]}" \
            | grep -E '^-rwsr-xr-x root/root .* \./usr/lib/jstream/browser/chrome-sandbox$'
          dpkg-deb --contents "${debs[0]}" | grep -E ' \./usr/share/doc/jstream/NOTICE\.txt$'
          mkdir -p dist
          mv "${debs[0]}" "dist/jstream-${TAG}-linux-amd64.deb"
          mv "${images[0]}" "dist/jstream-${TAG}-linux-x86_64.AppImage"
      # Linux's part of the release text.
      - name: Write the checksums and the release notes
        env:
          TAG: ${{ needs.ui.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cef=$(head -n 1 target/dist-linux-browser/CEF-VERSION.txt)
          cd dist
          deb="jstream-${TAG}-linux-amd64.deb"
          image="jstream-${TAG}-linux-x86_64.AppImage"
          sha256sum "$deb" > "$deb.sha256"
          sha256sum "$image" > "$image.sha256"
          {
            echo "### Linux"
            echo
            echo "For 64-bit PCs (x86_64), on GNOME or KDE Plasma. See [Getting started](https://github.com/${REPO}/blob/${TAG}/docs/GETTING-STARTED.md)."
            echo
            echo "- \`${deb}\`, for Ubuntu 24.04 or later: \`sudo apt install ./${deb}\`, then start JStream from the app menu."
            echo "- \`${image}\`, for other distributions, Debian included: make it executable (\`chmod +x ${image}\`) and run it."
            echo
            echo "These packages are **not signed**. JStream encodes H.264 on your GPU through VA-API or, when you ask it to, with Cisco's OpenH264, which it downloads from Cisco. It encodes AAC with its own encoder; JStream holds no AAC patent licence (\`NOTICE.txt\`). The virtual camera needs the v4l2loopback module (see Getting started). Media-file sources play audio files (WAV, FLAC, Ogg Vorbis, MP3) and H.264 video in MP4, MOV and Matroska through VA-API; VP8, VP9, AV1, Opus and AAC don't play yet."
            echo
            echo "Browser sources run the Chromium Embedded Framework, \`${cef}\`."
            echo
            echo "SHA-256:"
            echo "- \`${deb}\`: \`$(cut -d ' ' -f 1 "$deb.sha256")\`"
            echo "- \`${image}\`: \`$(cut -d ' ' -f 1 "$image.sha256")\`"
            echo
          } > notes-3-linux.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.sha256
            dist/notes-*.md
          if-no-files-found: error
          retention-days: 7

  # The macOS disk image for Apple Silicon, from a clean build (no cache), bundled and
  # ad-hoc signed by scripts/mac/bundle-app.sh, as after-review.yml's `macos-app` builds
  # it, and started once from the bundle the same way before it is uploaded.
  macos:
    needs: ui
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      # With browser sources, as after-review.yml's `macos-app` builds it (ADR-0157).
      - run: cargo build --release -p jstream-desktop --features cef --locked
      - name: Ninja for CEF's wrapper build
        run: command -v ninja || brew install ninja
      - name: Build the browser helper with CEF
        run: |
          set -euo pipefail
          cef=$(bash scripts/mac/build-browser-helper.sh --locked)
          echo "CEF_DIR=$cef" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jstream-ui
          path: ui-dist
      - name: Bundle JStream.app and the disk image
        env:
          TAG: ${{ needs.ui.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/mac/bundle-app.sh --exe target/release/jstream --ui-dir ui-dist --out build \
            --browser-helper target/release/jstream-browser-helper --cef "$CEF_DIR"
          [ -x build/JStream.app/Contents/MacOS/jstream-browser-helper ] \
            || { echo "::error::the bundle has no browser helper"; exit 1; }
          [ -d "build/JStream.app/Contents/Frameworks/Chromium Embedded Framework.framework" ] \
            || { echo "::error::the bundle has no CEF framework"; exit 1; }
          [ -f build/JStream.app/Contents/Resources/CEF-VERSION.txt ] \
            || { echo "::error::the bundle has no CEF-VERSION.txt"; exit 1; }
          arch=$(uname -m)
          if [ "$arch" != arm64 ]; then
            echo "::error::the release's disk image is for Apple Silicon, but this runner is $arch"
            exit 1
          fi
          dmgs=(build/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::expected one disk image, got: ${dmgs[*]}"
            exit 1
          fi
          mkdir -p dist
          mv "${dmgs[0]}" "dist/jstream-${TAG}-macos-arm64.dmg"
      # As in after-review.yml's `macos-app`: the window's page says hello to the engine.
      - name: The app starts and its window loads the UI
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/home"
          mkdir -p "$home"
          log="$home/Library/Application Support/JStream/logs/jstream-desktop.log"
          HOME="$home" build/JStream.app/Contents/MacOS/jstream --no-vcam &
          app=$!
          ok=0
          for _ in $(seq 1 600); do
            if [ -f "$log" ] && grep -q 'handshake done' "$log"; then ok=1; break; fi
            kill -0 "$app" 2>/dev/null || break
            sleep 0.1
          done
          kill -TERM "$app" 2>/dev/null || true
          wait "$app" 2>/dev/null || true
          if [ "$ok" != 1 ]; then
            echo "::error::the app's window didn't load the UI within 60 seconds"
            [ -f "$log" ] && cat "$log"
            exit 1
          fi
          grep -q 'engine serving the webview' "$log"
      # As in `macos-app`: a page loads through the bundled helper, its subprocesses
      # running from the helper apps in CEF's sandbox, and its paints reach the engine.
      - name: A browser page loads through the bundled helper
        env:
          JSTREAM_BROWSER_HELPER: ${{ github.workspace }}/build/JStream.app/Contents/MacOS/jstream-browser-helper
        run: cargo test -p jstream-browser --features cef --locked --test linux_page a_page_ -- --ignored --nocapture
      # macOS's part of the release text: how to open an unsigned app.
      - name: Write the checksum and the release notes
        env:
          TAG: ${{ needs.ui.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cef=$(head -n 1 build/JStream.app/Contents/Resources/CEF-VERSION.txt)
          cd dist
          dmg="jstream-${TAG}-macos-arm64.dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          {
            echo "### macOS"
            echo
            echo "\`${dmg}\`, for Apple Silicon Macs on macOS 14 or later. Open it and drag JStream to Applications. See [Getting started](https://github.com/${REPO}/blob/${TAG}/docs/GETTING-STARTED.md)."
            echo
            echo "JStream for macOS is **not signed or notarised**, so macOS stops it the first time it opens: open it once, then go to System Settings › Privacy & Security and choose *Open Anyway*. macOS asks again for its permissions (Screen Recording, Camera, Microphone) after each update. This build has no virtual camera yet."
            echo
            echo "Browser sources run the Chromium Embedded Framework, \`${cef}\`."
            echo
            echo "SHA-256: \`$(cut -d ' ' -f 1 "$dmg.sha256")\`"
            echo
          } > notes-2-macos.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/notes-*.md
          if-no-files-found: error
          retention-days: 7

  # The Stream Deck plugin (integrations/streamdeck), with the release's version stamped on
  # its manifest: typechecked, unit-tested, validated and packed by Elgato's CLI. Node is
  # the release the plugin runs on (its manifest's Nodejs.Version), downloaded and checked
  # by hash like the UI's tools. The tests that drive a built daemon skip here.
  streamdeck:
    needs: ui
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_VERSION: 24.22.2
      NODE_SHA256: 48cc0e21e048790e54c0cf5749c2725005313d652651c40b7a21feb9697aaf75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          node="node-v${NODE_VERSION}-linux-x64"
          curl -sSLf -o node.tar.xz "https://nodejs.org/dist/v${NODE_VERSION}/${node}.tar.xz"
          echo "${NODE_SHA256}  node.tar.xz" | sha256sum -c -
          tar xJf node.tar.xz
          echo "$RUNNER_TEMP/${node}/bin" >> "$GITHUB_PATH"
      - name: Test and pack the plugin
        working-directory: integrations/streamdeck
        env:
          TAG: ${{ needs.ui.outputs.tag }}
          VERSION: ${{ needs.ui.outputs.version }}
        run: |
          set -euo pipefail
          node --version
          npm ci
          npm run typecheck
          npm run build
          npm test
          node --experimental-strip-types scripts/set-version.ts "$VERSION"
          npm run pack
          mkdir -p ../../dist
          mv dist/io.github.jeffmhopkins.jstream.streamDeckPlugin "../../dist/jstream-${TAG}-streamdeck.streamDeckPlugin"
      # The plugin's part of the release text.
      - name: Write the checksum and the release notes
        env:
          TAG: ${{ needs.ui.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          plugin="jstream-${TAG}-streamdeck.streamDeckPlugin"
          sha256sum "$plugin" > "$plugin.sha256"
          {
            echo "### Stream Deck plugin"
            echo
            echo "- \`${plugin}\`, for the Stream Deck app 7.1 or newer on Windows 10 or later or macOS 12 or later: double-click it to install. Keys switch scenes and keyframes, run shows, toggle sources, effects and outputs, and light up with JStream's state. See [the plugin's README](https://github.com/${REPO}/blob/${TAG}/integrations/streamdeck/README.md) to pair it."
            echo
            echo "SHA-256:"
            echo "- \`${plugin}\`: \`$(cut -d ' ' -f 1 "$plugin.sha256")\`"
            echo
          } > notes-4-streamdeck.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-streamdeck
          path: |
            dist/*.streamDeckPlugin
            dist/*.sha256
            dist/notes-*.md
          if-no-files-found: error
          retention-days: 7

  # Publishing is its own job, so only it can write to the repository.
  publish:
    needs: [ui, zip, linux, macos, streamdeck]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creates the release and uploads its files; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      # One release text: a line on the release, then each platform's part, Windows,
      # macOS, then Linux, then the Stream Deck plugin's.
      - name: Gather the release notes
        env:
          VERSION: ${{ needs.ui.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "JStream ${VERSION}, the desktop app for Windows, macOS and Linux, and its Stream Deck plugin."
            echo
            cat release/notes-*.md
          } > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.ui.outputs.tag }}
          VERSION: ${{ needs.ui.outputs.version }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          # A dispatched run creates its tag on the commit it built. Creating the ref fails
          # (422) if the tag appeared since `ui` checked, so the release never lands on a tag
          # of another commit; then both paths need the tag to exist.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          fi
          # GitHub's generated list starts from the latest full release, and every release
          # so far is a pre-release, so on its own it lists every PR since the first. Start
          # it from the newest release published before this one instead.
          since=()
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 \
            --json tagName --jq '.[0].tagName // empty')
          if [ -n "$previous" ]; then since=(--notes-start-tag "$previous"); fi
          gh release create "$TAG" release/*.zip release/*.dmg release/*.deb release/*.AppImage \
            release/*.streamDeckPlugin release/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag "${prerelease[@]}" \
            --title "JStream $VERSION" --notes-file notes.md --generate-notes "${since[@]}"
