# Scratch: runs spike S6 (spikes/s6-metal) on a CI Mac for MAC1. Never merged.
name: s6-spike-run
on:
  pull_request:
    paths: [.github/workflows/s6-spike-run.yml, "spikes/s6-metal/**"]
permissions:
  contents: read
jobs:
  s6:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: system_profiler SPDisplaysDataType SPHardwareDataType; sw_vers
      - name: build
        working-directory: spikes/s6-metal
        run: cargo build --release
      - name: run load 64
        working-directory: spikes/s6-metal
        run: cargo run --release -- --json --seconds 20 || true
      - name: run load 256
        working-directory: spikes/s6-metal
        run: cargo run --release -- --json --seconds 20 --load 256 || true
      - name: run load 1024
        working-directory: spikes/s6-metal
        run: cargo run --release -- --json --seconds 20 --load 1024 || true
      - name: run load 1024 again
        working-directory: spikes/s6-metal
        run: cargo run --release -- --json --seconds 20 --load 1024 || true
      - name: decode check
        working-directory: spikes/s6-metal
        run: |
          brew install ffmpeg >/dev/null 2>&1 || true
          for f in out-*.h264; do echo "== $f"; ls -l $f; ffmpeg -v error -i $f -f null - && echo "decodes ok"; ffmpeg -v error -i $f -vf "select=eq(n\,30)" -frames:v 1 ${f%.h264}.png -y; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: s6-out
          path: spikes/s6-metal/out-*
