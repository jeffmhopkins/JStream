# fuzz: every fuzz target in fuzz/ for a few minutes each, nightly (fuzz/README.md#ci,
# check `fuzz` in docs/RULES.md#R-GIT-003). Not required: it never runs on a PR.
# A crash, hang or out-of-memory input is a finding: it opens an issue for its target, or
# comments on the open one, and uploads the input as an artifact. Findings never fail the
# job; it fails only when a tool can't run.
# Editing this file is a governance change (R-GOV-001).

# Third-party actions are pinned to full commit SHAs, with the release in a trailing comment.
# Dependabot proposes updates (ADR-0056). Manual pins: resolve with `git ls-remote --tags`, dereferencing annotated tags (^{}).

name: fuzz

on:
  schedule:
    - cron: "41 3 * * *"   # daily 03:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  # libFuzzer needs a nightly toolchain (fuzz/README.md). Pinned, and bumped by hand like
  # CARGO_FUZZ_VERSION, so a nightly regression can't turn the run red on its own.
  NIGHTLY: nightly-2026-10-15
  CARGO_FUZZ_VERSION: 0.13.2
  SECONDS_PER_TARGET: 180

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write          # open or comment on a target's crash issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install --locked "cargo-fuzz@$CARGO_FUZZ_VERSION"
      - name: Build the targets
        working-directory: fuzz
        run: cargo "+$NIGHTLY" fuzz build
      - name: Seed the corpora
        working-directory: fuzz
        run: ./seed.sh

      # Each crashing target writes its name to $RUNNER_TEMP/crashed and its log tail to
      # $RUNNER_TEMP/logs/<target>.txt. A non-zero exit with no input saved is a tool failure.
      - name: Run each target
        working-directory: fuzz
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          : > "$RUNNER_TEMP/crashed"
          failed=0
          for target in $(cargo "+$NIGHTLY" fuzz list); do
            echo "::group::$target"
            status=0
            cargo "+$NIGHTLY" fuzz run "$target" -- \
              -max_total_time="$SECONDS_PER_TARGET" -timeout=30 -rss_limit_mb=2048 \
              > "$RUNNER_TEMP/logs/$target.full" 2>&1 || status=$?
            tail -n 60 "$RUNNER_TEMP/logs/$target.full"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              if [ -n "$(ls -A "artifacts/$target" 2>/dev/null)" ]; then
                echo "::warning::$target found a crashing input"
                echo "$target" >> "$RUNNER_TEMP/crashed"
                tail -n 80 "$RUNNER_TEMP/logs/$target.full" | head -c 20000 > "$RUNNER_TEMP/logs/$target.txt"
              else
                echo "::error::$target exited $status without saving an input"
                failed=1
              fi
            fi
          done
          exit "$failed"

      - name: Upload crashing inputs
        if: ${{ !cancelled() && hashFiles('fuzz/artifacts/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 30

      - name: Open or update crash issues
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/crashed" ] || exit 0   # no target ran
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          while IFS= read -r target; do
            [ -n "$target" ] || continue
            title="Fuzz crash: $target"
            {
              echo "The nightly [\`fuzz\`]($run_url) run on \`$(git rev-parse --short HEAD)\` found an input that crashes, hangs or runs \`$target\` out of memory."
              echo "The input is in the run's \`fuzz-artifacts\` artifact. Replay it with \`cargo +nightly fuzz run $target <file>\`, and fix it in its own PR with a regression test (fuzz/README.md#running)."
              echo
              echo '```text'
              cat "$RUNNER_TEMP/logs/$target.txt"
              echo '```'
            } > "$RUNNER_TEMP/body.md"
            number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --author 'app/github-actions' \
              --search "in:title \"$title\"" --limit 20 --json number,title \
              --jq "map(select(.title == \"$title\")) | sort_by(.number) | first | .number // empty")
            if [ -z "$number" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            else
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
            fi
          done < "$RUNNER_TEMP/crashed"
