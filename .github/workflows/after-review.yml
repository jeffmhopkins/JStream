# after-review: the CI jobs a PR runs only once review passes (ADR-0054). review-gate.yml
# dispatches this workflow on the PR's branch when it sets `review-gate` to success. Pushes
# to main run it too. The job names match the required checks in docs/RULES.md#R-GIT-003,
# and none of them is defined in ci.yml, so neither workflow reports a skipped run under
# the other's names.
# A dispatched run's checks aren't linked to the PR, so they don't count as its required
# checks or show on it. Each job therefore also reports itself as a commit status under its
# check name (pending, then its result): that is what the PR's merge box and the ruleset see.
# Editing this file is a governance change (R-GOV-001).

# Third-party actions are pinned to full commit SHAs, with the release in a trailing comment.
# Dependabot proposes updates (ADR-0056). Manual pins: resolve with `git ls-remote --tags`, dereferencing annotated tags (^{}).

name: after-review

on:
  workflow_dispatch:
  push:
    branches: [main]
  # A PR that changes this file runs it on every push: the change gets tested, and
  # workflow_dispatch can't start a workflow that isn't on the default branch yet.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: [.github/workflows/after-review.yml]

permissions:
  contents: read
  statuses: write   # the commit statuses above; nothing else is written

concurrency:
  group: after-review-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  clippy:
    strategy:
      matrix:
        os: [windows-latest]   # keeps the required check name `clippy (windows-latest)`
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report pending to the PR
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT: clippy (${{ matrix.os }})
          RESULT: pending
        run: bash .github/after-review-status.sh
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Platform tests (`hw-tests`) only run on real hardware, but they must still compile:
      # type-check them on the platform they target.
      - run: cargo clippy -p jstream-platform-windows -p jstream-core --all-targets --features hw-tests --locked -- -D warnings
      # The CEF backend of the browser source (ADR-0046) must compile too, and so must the
      # desktop app's and the daemon's wiring of it. `dox` type-checks it against
      # cef-dll-sys's bundled bindings without downloading or building CEF.
      - run: cargo clippy -p jstream-browser -p jstream-browser-helper -p jstream-desktop -p jstream-daemon --all-targets --features jstream-browser/dox,jstream-browser-helper/dox,jstream-desktop/dox,jstream-daemon/dox --locked -- -D warnings
      - name: Report the result to the PR
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT: clippy (${{ matrix.os }})
          RESULT: ${{ job.status }}
        run: bash .github/after-review-status.sh

  test:
    strategy:
      matrix:
        os: [windows-latest]   # keeps the required check name `test (windows-latest)`
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report pending to the PR
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT: test (${{ matrix.os }})
          RESULT: pending
        run: bash .github/after-review-status.sh
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test
        run: cargo test --workspace --locked
      # The browser source's engine side (feature `cef`) builds without CEF since
      # ADR-0048, so its Windows-only tests (the helper's pipes) can run here.
      - name: Test the browser engine side
        run: cargo test -p jstream-browser --features cef --locked
      - name: Report the result to the PR
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT: test (${{ matrix.os }})
          RESULT: ${{ job.status }}
        run: bash .github/after-review-status.sh

  # The web UI end to end (crates/jstream-ui/tests/e2e/README.md): Playwright drives the
  # trunk build in the runner's Google Chrome against the mock daemon. trunk and the
  # wasm-bindgen CLI are installed as in `wasm`; Playwright comes from the lockfile, with
  # install scripts off, and downloads no browser. Not required (R-GIT-003).
  ui-e2e:
    runs-on: ubuntu-latest
    env:
      TRUNK_VERSION: 0.21.14
      TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b
      WASM_BINDGEN_VERSION: 0.2.129
      WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report pending to the PR
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT: ui-e2e
          RESULT: pending
        run: bash .github/after-review-status.sh
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install trunk and the wasm-bindgen CLI
        run: |
          set -euo pipefail
          locked=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          if [ "$locked" != "$WASM_BINDGEN_VERSION" ]; then
            echo "::error::Cargo.lock has wasm-bindgen $locked: set WASM_BINDGEN_VERSION and WASM_BINDGEN_SHA256 in ci.yml to match"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSLf -o trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TRUNK_SHA256}  trunk.tar.gz" | sha256sum -c -
          tar xzf trunk.tar.gz -C bin trunk
          wb="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          curl -sSLf -o wasm-bindgen.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${wb}.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  wasm-bindgen.tar.gz" | sha256sum -c -
          tar xzf wasm-bindgen.tar.gz --strip-components=1 -C bin "${wb}/wasm-bindgen"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the UI
        working-directory: crates/jstream-ui
        run: trunk build --locked --offline
      - name: Install Playwright
        working-directory: crates/jstream-ui/tests/e2e
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: End-to-end tests
        working-directory: crates/jstream-ui/tests/e2e
        run: |
          set -euo pipefail
          JSTREAM_E2E_CHROMIUM="$(command -v google-chrome)"
          export JSTREAM_E2E_CHROMIUM
          npx --no-install playwright test
      - name: Report the result to the PR
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT: ui-e2e
          RESULT: ${{ job.status }}
        run: bash .github/after-review-status.sh

  # The portable Windows zip (ADR-0020). `dist-ui` builds the web UI for release, with
  # trunk and the wasm-bindgen CLI pinned and checked as in ci.yml's `wasm`, plus binaryen
  # (the `wasm-opt` a release build runs); `dist` runs `cargo xtask dist` with it on Windows.
  # The zip is uploaded as is (`archive: false`), so the download is the zip a user
  # unzips. Not required (R-GIT-003).
  dist-ui:
    runs-on: ubuntu-latest
    env:
      TRUNK_VERSION: 0.21.14
      TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b
      WASM_BINDGEN_VERSION: 0.2.129
      WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
      BINARYEN_VERSION: 132
      BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report pending to the PR
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT: dist-ui
          RESULT: pending
        run: bash .github/after-review-status.sh
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install trunk, the wasm-bindgen CLI and wasm-opt
        run: |
          set -euo pipefail
          locked=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          if [ "$locked" != "$WASM_BINDGEN_VERSION" ]; then
            echo "::error::Cargo.lock has wasm-bindgen $locked: set WASM_BINDGEN_VERSION and WASM_BINDGEN_SHA256 in ci.yml and after-review.yml to match"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSLf -o trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TRUNK_SHA256}  trunk.tar.gz" | sha256sum -c -
          tar xzf trunk.tar.gz -C bin trunk
          wb="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          curl -sSLf -o wasm-bindgen.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${wb}.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  wasm-bindgen.tar.gz" | sha256sum -c -
          tar xzf wasm-bindgen.tar.gz --strip-components=1 -C bin "${wb}/wasm-bindgen"
          by="binaryen-version_${BINARYEN_VERSION}"
          curl -sSLf -o binaryen.tar.gz "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/${by}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  binaryen.tar.gz" | sha256sum -c -
          tar xzf binaryen.tar.gz --strip-components=2 -C bin "${by}/bin/wasm-opt"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the UI for release
        working-directory: crates/jstream-ui
        run: trunk build --release --locked --offline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jstream-ui
          path: crates/jstream-ui/dist
          if-no-files-found: error
          retention-days: 1
      - name: Report the result to the PR
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT: dist-ui
          RESULT: ${{ job.status }}
        run: bash .github/after-review-status.sh

  dist:
    needs: dist-ui
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report pending to the PR
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT: dist
          RESULT: pending
        run: bash .github/after-review-status.sh
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jstream-ui
          path: ui-dist
      # Named after the commit tested: a dispatched run's branch tip, or a pull_request
      # run's head rather than the merge commit it checks out.
      - shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: cargo xtask dist --ui-dir ui-dist --out dist --revision "${SHA::10}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Report the result to the PR
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT: dist
          RESULT: ${{ job.status }}
        run: bash .github/after-review-status.sh

  # Not required until M3 (R-GIT-003).
  macos:
    runs-on: macos-latest
    continue-on-error: true
    # A hung test fails the job here instead of holding a runner for GitHub's 6-hour
    # default (#627).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report pending to the PR
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT: macos
          RESULT: pending
        run: bash .github/after-review-status.sh
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked
      - name: Report the result to the PR
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT: macos
          RESULT: ${{ job.status }}
        run: bash .github/after-review-status.sh
