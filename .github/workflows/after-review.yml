# DIAGNOSTIC BRANCH ONLY (never merged): runs the volumetric fog tests on Windows to
# capture why lit fog reads black on WARP.
name: after-review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Render fog tests
        continue-on-error: true
        run: cargo test -p jstream-render --locked --lib filter::depth -- --nocapture --test-threads=1
      - name: Core fog tests
        continue-on-error: true
        run: cargo test -p jstream-core --locked --lib volumetric_fog -- --nocapture --test-threads=1
