# Spike S3 (ROADMAP M0, Track B). Throwaway; not a member of the root workspace.
[package]
name = "s3-clock"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace, so the root workspace (crates/*, xtask) never builds or lints it.
[workspace]

[dependencies]
# The adaptive resampler under test (ADR-0014). Pinned exactly; MIT OR Apache-2.0.
# Default features off: the FFT (fixed-ratio) resampler and its realfft dependency are
# not needed for the asynchronous sinc resampler.
rubato = { version = "=5.0.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Performance",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
# `#[implement]` (the process-loopback completion handler) expands to `windows_core::`
# paths, so the crate must be a direct dependency. Same version `windows` uses.
windows-core = "=0.62.2"

# The unit tests run the real sinc resampler over simulated minutes of audio; an
# unoptimised rubato makes them very slow.
[profile.dev.package.rubato]
opt-level = 3

[profile.release]
debug = "line-tables-only"
