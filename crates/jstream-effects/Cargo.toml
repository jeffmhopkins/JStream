[package]
name = "jstream-effects"
version = "0.0.0"
description = "WGSL effect packs: effect.toml manifests, WGSL validation with naga, pack parameters as kind descriptors, and hot reload."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.jstream]
layer = 3
summary = "WGSL effect packs (ADR-0025, ADR-0035): `effect.toml` manifests, WGSL validation with naga, parameters as `<pack>/<effect>` kind descriptors with a uniform layout, and hot reload by polling the pack folders. Drawn through `jstream-render`'s filter harness; no GPU device of its own."
unsafe_allowed = false

[lints]
workspace = true

[dependencies]
# Kind descriptors and settings (ADR-0025).
jstream-protocol.workspace = true
# The filter harness that draws an effect, and its prelude (layer 2).
jstream-render.workspace = true
# WGSL parsing and validation. The same exact version wgpu already brings in.
naga.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `effect.toml`. Already in the tree through xtask.
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
# `FrameSize`, for the scene a draw test reads back through.
jstream-media.workspace = true
