[package]
name = "jstream-core"
version = "0.0.0"
description = "The JStream engine: owns the scene graph, executes protocol calls and serves them in-process through `InProcessControl`."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.jstream]
layer = 5
summary = "`Engine`: executes commands, owns threads and the clock, injects platform backends, implements `InProcessControl`"
unsafe_allowed = false

[lints]
workspace = true

[features]
# Platform tests against real hardware (docs/RULES.md#testing): the GPU capture path on
# WGC and the DX12 device. Additive, off by default, and the tests are also `#[ignore]`d.
# Run them on a Windows machine with a display and a DX12 GPU:
# `cargo test -p jstream-core --features hw-tests --lib windows_gpu -- --ignored --nocapture`.
hw-tests = []

[dependencies]
# The render snapshot the control side publishes and the render thread loads lock-free.
arc-swap.workspace = true
futures-core.workspace = true
jstream-audio.workspace = true
jstream-control.workspace = true
jstream-encode.workspace = true
jstream-graph.workspace = true
jstream-media.workspace = true
jstream-mux.workspace = true
jstream-outputs.workspace = true
jstream-platform.workspace = true
# The plugin-host control messages and block the CLAP supervisor reads (ADR-0035).
jstream-plugin-proto.workspace = true
jstream-protocol.workspace = true
jstream-render.workspace = true
# The built-in source kinds and their descriptors (ADR-0061, ADR-0025).
jstream-sources.workspace = true
# PNG for `video.snapshot` (ADR-0061). Encoding only; deflate stays pure Rust.
png.workspace = true
# Settings values: the audio filter kinds' defaults and the mixer kernels read from them
# (ADR-0025, ADR-0026), the CLAP kinds' parameter defaults, and saved collection files in
# the engine tests.
serde_json.workspace = true
thiserror.workspace = true
# Sign-in and the Live API for YouTube outputs and the YouTube commands (ADR-0058).
jstream-youtube.workspace = true
# Spans around commands, outputs and sessions (R-RS-005).
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# The audit log and the collection file are created with a user-only DACL, and an
# existing audit log is refused if its DACL lets other users in (#547). Windows only:
# Unix uses the file mode. Only these two helpers; platform backends stay injected. The
# ignored hardware test of the GPU capture path (`src/tests/windows_gpu.rs`) also uses
# it: the engine on WGC capture and the platform's DX12 device.
jstream-platform-windows.workspace = true

[dev-dependencies]
# The mock engine, for a differential test: the same calls must get the same answers.
jstream-control = { workspace = true, features = ["mock"] }
# `tests/scenarios.rs` and the output pipeline test: overload drops and fakes.
jstream-platform = { workspace = true, features = ["fake"] }
# `src/tests/audio.rs`: `browser` sources open pages in the fake browser.
jstream-browser = { workspace = true, features = ["fake"] }
# `tests/mcp.rs`: an MCP agent driving the real engine through `InProcessControl`.
jstream-mcp.workspace = true
# `FakeTransport` and its JSON fixtures, for the YouTube tests (R-TEST-004).
jstream-youtube = { workspace = true, features = ["fake"] }
# The YouTube tests: the crash redaction's `Secrets`, fed by the setup's secret hook
# (#844).
jstream-crash.workspace = true
# The shared parity fixture that `jstream-graph` and the mock are held to.
jstream-protocol = { workspace = true, features = ["fixtures"] }
# Decodes the preview stream's JPEGs in its tests; already in the tree for the image
# source (`jstream-sources`).
zune-jpeg.workspace = true
# The built-in kinds' snapshot, reviewed like an API diff (ADR-0025).
insta.workspace = true
