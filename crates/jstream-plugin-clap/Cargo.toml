[package]
name = "jstream-plugin-clap"
version = "0.0.0"
description = "A safe wrapper over the CLAP audio plugin ABI, for JStream's out-of-process plugin host."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.jstream]
layer = 2
summary = "Safe wrapper over the CLAP plugin ABI (ADR-0035): loading a plugin file, its stereo audio effects, parameters, latency and saved state, and real-time processing. Only `jstream-plugin-host` links it"
unsafe_allowed = true

[lints.rust]
missing_docs = "warn"    # R-RS-006 (blocking under -D warnings)

[lints.clippy]
unwrap_used = "deny"                      # R-RS-004
print_stdout = "deny"                     # R-RS-005
print_stderr = "deny"                     # R-RS-005
allow_attributes_without_reason = "deny"  # R-RS-009
undocumented_unsafe_blocks = "deny"       # R-UNSAFE-002

[dependencies]
clap-sys.workspace = true
jstream-plugin-proto.workspace = true
libloading.workspace = true
thiserror.workspace = true

[dev-dependencies]
assert_no_alloc.workspace = true
