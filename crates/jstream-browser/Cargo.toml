[package]
name = "jstream-browser"
version = "0.0.0"
description = "Browser sources' engine: the BrowserBackend seam, pages' audio hand-off and custom CSS, and the CEF backend (Windows, feature `cef`)."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.jstream]
layer = 3
summary = "Browser sources' engine (ADR-0021, ADR-0046): the `BrowserBackend` seam, pages' audio hand-off and custom CSS, and the CEF off-screen backend (Windows, feature `cef`): shared-texture paints copied onto the engine's device, the audio handler, the helper-exe layout"
unsafe_allowed = true

# Its own table, not `workspace = true`: the workspace forbids `unsafe_code`, and this is
# one of the crates R-UNSAFE-001 allows to use it (ADR-0046). Every other workspace lint
# is copied unchanged; keep the two tables in step.
[lints.rust]
missing_docs = "warn"    # R-RS-006 (blocking under -D warnings)

[lints.clippy]
unwrap_used = "deny"                      # R-RS-004
print_stdout = "deny"                     # R-RS-005
print_stderr = "deny"                     # R-RS-005
allow_attributes_without_reason = "deny"  # R-RS-009
undocumented_unsafe_blocks = "deny"       # R-UNSAFE-002

[features]
# The CEF backend (Windows only; elsewhere it builds nothing). `cef-dll-sys`'s build
# script downloads the CEF binary distribution and builds CEF's C++ wrapper with CMake
# and Ninja, so it is off by default: only a build that ships browser sources turns it
# on (ADR-0046).
cef = ["dep:cef", "dep:windows", "dep:wgpu"]
# Compile-checks the CEF backend without downloading or building CEF (`cef`'s docs.rs
# mode): for CI's clippy. A binary built with it doesn't link.
dox = ["cef", "cef/dox"]
# The `fake` module: an in-memory backend for tests here and in the crates that drive
# this one. Off by default.
fake = []

[dependencies]
jstream-media.workspace = true
# `GpuContext`/`GpuFrame` (and its `wgpu`), the audio-input handler pages feed, and the
# media clock packets are stamped on.
jstream-platform.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# CEF's C API (ADR-0021, ADR-0046), only with the `cef` feature.
cef = { workspace = true, optional = true }
# Opening CEF's shared textures on the engine's D3D12 device, and putting the host's
# Ctrl-C handler ahead of the one CEF installs.
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Console",
] }
# The DX12 backend for the texture import through wgpu-hal (ADR-0004); the version is the
# workspace's exact pin, the one jstream-platform re-exports.
wgpu = { workspace = true, optional = true, features = ["dx12"] }

[target.'cfg(windows)'.dev-dependencies]
# The hardware check (`examples/page_check.rs`) opens the engine's device and clock as
# the daemon does.
jstream-platform-windows.workspace = true

[[example]]
name = "page_check"
required-features = ["cef"]
