[package]
name = "jstream-ui"
version = "0.0.0"
description = "The JStream web UI: a Leptos app compiled to WASM that drives the engine over its WebSocket API."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.jstream]
layer = 3
summary = "Leptos app compiled to WASM; depends on `jstream-protocol` and `jstream-control` only"
unsafe_allowed = false

[lints]
workspace = true

[dependencies]
# Reading the engine's event stream.
futures-util.workspace = true
# The WebSocket client: the browser's `WebSocket` on wasm32 (ADR-0045).
jstream-control = { workspace = true, features = ["ws"] }
jstream-protocol.workspace = true
leptos.workspace = true
# Settings values in the properties form and the transition preset form, and the dock
# kept in the browser's storage.
serde_json.workspace = true
# The browser's storage for the dock, finding where a dragged panel would land, and
# moving the focus through a right-click menu.
web-sys = { workspace = true, features = ["Document", "DomRect", "Element", "Event", "HtmlElement", "NodeList", "Storage", "Window"] }

[dev-dependencies]
jstream-control = { workspace = true, features = ["mock"] }
