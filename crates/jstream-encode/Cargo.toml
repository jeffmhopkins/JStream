[package]
name = "jstream-encode"
version = "0.0.0"
description = "Encoder sessions: one platform encoder on its own thread, fed through a bounded queue, fanning packets out to any number of outputs."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.jstream]
layer = 3
summary = "Shared encoder sessions keyed by (mix, settings); rate control; fan-out of packet streams"
unsafe_allowed = false

[lints]
workspace = true

[dependencies]
jstream-platform.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
jstream-platform = { workspace = true, features = ["fake"] }
# The GPU-frame tests make textures on a software adapter, so they need a backend: the
# same pin and backends as jstream-render, for tests only.
wgpu = { workspace = true, features = ["vulkan", "dx12", "metal"] }

[[bench]]
name = "session"
harness = false
