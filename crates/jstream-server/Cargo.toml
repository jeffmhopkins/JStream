[package]
name = "jstream-server"
version = "0.0.0"
description = "The JStream HTTP/WebSocket server: serves the control API over an authenticated localhost WebSocket, in front of any `Control` session."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.jstream]
layer = 4
summary = "axum HTTP/WebSocket over `dyn Control`; serves UI assets; mounts MCP over HTTP; token and Origin checks"
unsafe_allowed = false

[lints]
workspace = true

[dependencies]
axum.workspace = true
# The token compare hashes both sides to a fixed length (#44); already in the tree for
# xtask, with the `pure` feature, so it compiles no C.
blake3.workspace = true
futures-util.workspace = true
# MCP session IDs, from the OS's random source; already in the tree for the daemon's token.
getrandom.workspace = true
jstream-control.workspace = true
# MCP's streamable-HTTP transport feeds request bodies to `jstream_mcp::Server`.
jstream-mcp.workspace = true
jstream-protocol.workspace = true
# Reads only the envelope (`type`, `id`) of a message over the request limit, skipping
# the rest unparsed (ADR-0074); already in the tree through every protocol crate.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
# A span per connection; accepted and refused upgrades are logged (R-RS-005).
tracing.workspace = true

# The device file is created with a user-only DACL, and an existing one is refused if
# its DACL lets other users in (#344). Windows only: Unix uses the file mode.
[target.'cfg(windows)'.dependencies]
jstream-platform-windows.workspace = true

[dev-dependencies]
# The end-to-end tests: a `MockEngine` behind the server, the WebSocket client in front.
jstream-control = { workspace = true, features = ["mock", "ws"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite.workspace = true
