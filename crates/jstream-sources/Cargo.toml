[package]
name = "jstream-sources"
version = "0.0.0"
description = "Source kinds: the `Source` trait, the kind registry that supplies descriptors to the engine, and the built-in colour, image, text and media file sources."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.jstream]
layer = 4
summary = "`Source` trait plus built-ins (ADR-0031): display, window, video capture device, image, color, text, browser, audio input, desktop audio, application audio, scene (M1b); media file, audio waveform, audio spectrum (M2); YouTube chat message (ADR-0041) (M3); Spout2 receiver (later). Uses platform traits; backends are injected. Images and fonts use pure-Rust crates."
unsafe_allowed = false

[lints]
workspace = true

[dependencies]
# Glyph coverage for the text source (ADR-0031).
ab_glyph_rasterizer.workspace = true
# Image decoders (ADR-0031: pure-Rust image crates, the same on every platform).
gif.workspace = true
image-webp.workspace = true
jstream-media.workspace = true
# The media-file backend trait: the `media` kind's demuxer and decoders are injected
# (ADR-0031).
jstream-platform.workspace = true
jstream-protocol.workspace = true
png.workspace = true
# Settings values and the kind descriptors' defaults (ADR-0025).
serde_json.workspace = true
# Fonts for the text source (ADR-0031: pure-Rust font crates).
skrifa.workspace = true
thiserror.workspace = true
zune-core.workspace = true
zune-jpeg.workspace = true

[dev-dependencies]
# Fake media files for the `media` kind's tests (R-TEST-004).
jstream-platform = { workspace = true, features = ["fake"] }
