[package]
name = "jstream-jtunnel"
version = "0.0.0"
description = "The JTunnel wire format and discovery records (ADR-0120), for receiving a DAW's audio and MIDI over the network."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.jstream]
layer = 1
summary = "JTunnel's wire format, version 2 (ADR-0120): audio packets with their per-frame MIDI, SysEx pieces and note expressions, subscribe and bye, 24-bit PCM, SysEx reassembly, sequence tracking (new, redundant, lost, late, restarted), and the mDNS / DNS-SD query and answers that find senders; no sockets, no threads"
unsafe_allowed = false

[lints]
workspace = true

[dependencies]
jstream-midi.workspace = true

[dev-dependencies]
assert_no_alloc.workspace = true
