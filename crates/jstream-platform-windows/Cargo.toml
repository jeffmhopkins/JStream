[package]
name = "jstream-platform-windows"
version = "0.0.0"
description = "Windows platform backends: the QPC media clock and WASAPI audio I/O (WGC capture and Media Foundation codecs to follow)."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.jstream]
layer = 2
summary = "WGC capture, WASAPI (incl. process loopback), MF encode/decode, MF hardware encoders, D3D11↔D3D12 interop, vcam sink side, CEF browser backend (ADR-0021)"
unsafe_allowed = true

# Its own table, not `workspace = true`: the workspace forbids `unsafe_code`, and this is
# one of the crates R-UNSAFE-001 allows to use it. Every other workspace lint is copied
# unchanged; keep the two tables in step.
[lints.rust]
missing_docs = "warn"    # R-RS-006 (blocking under -D warnings)

[lints.clippy]
unwrap_used = "deny"                      # R-RS-004
print_stdout = "deny"                     # R-RS-005
print_stderr = "deny"                     # R-RS-005
allow_attributes_without_reason = "deny"  # R-RS-009
undocumented_unsafe_blocks = "deny"       # R-UNSAFE-002

[features]
# Platform tests against real hardware (docs/RULES.md#testing): audio devices, the OS
# encoders and the GPU. Additive, off by default, and the tests are also `#[ignore]`d.
# Run them on a Windows machine with a microphone, speakers and a DX12 GPU with a
# hardware H.264 encoder:
# `cargo test -p jstream-platform-windows --features hw-tests -- --ignored`.
hw-tests = []

[dependencies]
jstream-platform.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "std",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = { workspace = true, features = ["std"] }
# The DX12 backend, for the GPU interop's wgpu-hal import (ADR-0004). The version is the
# workspace's exact pin, the one jstream-platform re-exports.
wgpu = { workspace = true, features = ["dx12"] }
