[package]
name = "jstream-platform-linux"
version = "0.0.0"
description = "Linux platform backends: the CLOCK_MONOTONIC media clock, ScreenCast portal and PipeWire capture with DMA-BUF import into Vulkan, V4L2 webcams and capture cards, PipeWire and ALSA audio, VA-API codecs, and the backend set that chooses between them (ADR-0060)."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.jstream]
layer = 2
summary = "ADR-0060 so far: CLOCK_MONOTONIC media clock, session and support-tier detection, ScreenCast portal and PipeWire screen capture, its DMA-BUF frames imported into the engine's Vulkan device (`LinuxGpu`), V4L2 webcams and capture cards (single- and multi-planar) paired with their microphones, PipeWire audio with ALSA as the fallback, libpipewire, libasound and libva loaded at run time with `dlopen`, the `LinuxBackends` set, VA-API H.264 encoding from CPU frames or from the Vulkan device's NV12 encode targets exported as DMA-BUFs, Cisco's OpenH264 downloaded on request as the software H.264 encoder (ADR-0061), AAC encoding through `jstream-aac` (ADR-0061, ADR-0062), stream keys and OAuth tokens in the Secret Service with a `0600` file where none is reachable (ADR-0071)"
unsafe_allowed = true

# Its own table, not `workspace = true`: the workspace forbids `unsafe_code`, and this is
# one of the crates R-UNSAFE-001 allows to use it. Every other workspace lint is copied
# unchanged; keep the two tables in step.
[lints.rust]
missing_docs = "warn"    # R-RS-006 (blocking under -D warnings)

[lints.clippy]
unwrap_used = "deny"                      # R-RS-004
print_stdout = "deny"                     # R-RS-005
print_stderr = "deny"                     # R-RS-005
allow_attributes_without_reason = "deny"  # R-RS-009
undocumented_unsafe_blocks = "deny"       # R-UNSAFE-002

[features]
default = ["aac-encoder"]
# JStream's own AAC-LC encoder (`jstream-aac`) as Linux's AAC encoder (ADR-0061, within
# ADR-0062's limits). On by default. ADR-0062's re-check clause switches the encoder off
# in a release by taking it out of `default`: the dependency then leaves the build and
# AAC encoding reports `Unsupported`.
aac-encoder = ["dep:jstream-aac"]
# Platform tests against a real Linux desktop (docs/RULES.md#testing): a PipeWire daemon,
# the ScreenCast portal and a GPU with a VA-API driver. Additive, off by default, and the
# tests are also `#[ignore]`d. Run them on such a machine with
# `cargo test -p jstream-platform-linux --features hw-tests -- --ignored`.
hw-tests = []
# The one test that downloads Cisco's OpenH264 binary from Cisco's server, to record or
# re-check the pin (ADR-0061). It touches the network, so it is off by default, the test
# is also `#[ignore]`d, and CI never turns it on (R-TEST-004). Run it by hand with
# `cargo test -p jstream-platform-linux --features openh264-download -- --ignored downloads_the_pinned`.
openh264-download = []

[dependencies]
jstream-aac = { workspace = true, optional = true }
jstream-platform.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The DMA-BUF modifier queries beside wgpu-hal's Vulkan backend (`gpu/dmabuf.rs`).
ash.workspace = true
libc.workspace = true
libloading.workspace = true
# SHA-256 for checking Cisco's OpenH264 download against its pin, and TLS for fetching it
# from Cisco's server (ADR-0061, R-DEP-006). All three are already in the tree through
# jstream-youtube and jstream-outputs, so they add no crate.
ring.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
# The Vulkan backend, for the GPU interop's device and wgpu-hal's DMA-BUF import
# (ADR-0004), and WGSL for the capture copy's shader. The version is the workspace's
# exact pin, the one jstream-platform re-exports.
wgpu = { workspace = true, features = ["vulkan", "wgsl"] }
