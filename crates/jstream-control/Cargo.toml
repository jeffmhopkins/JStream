[package]
name = "jstream-control"
version = "0.0.0"
description = "The JStream Control trait: the async API every client (CLI, MCP, UI) uses to talk to the engine."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.jstream]
layer = 2
summary = "The `Control` trait plus the WebSocket client. WASM-safe: no engine, no tokio requirement in WASM builds"
unsafe_allowed = false

[lints]
workspace = true

[features]
# `MockEngine`/`MockControl`: an in-memory implementation for developing and testing
# clients without the engine. Off by default; clients enable it in dev-dependencies.
mock = []
# `WsControl`: the WebSocket client, on native targets for now. Off by default, so the
# WASM/UI build carries no tokio. Plain `ws://` only: no TLS feature is enabled.
ws = ["dep:futures-util", "dep:serde_json", "dep:tokio", "dep:tokio-tungstenite"]

[dependencies]
futures-core.workspace = true
jstream-protocol.workspace = true
thiserror.workspace = true

# The WebSocket client's transport (feature `ws`). Native only: `wasm32` builds never pull
# tokio, even with the feature on.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-util = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "net", "rt", "sync"] }
tokio-tungstenite = { workspace = true, optional = true }

[dev-dependencies]
jstream-protocol = { workspace = true, features = ["fixtures"] }
