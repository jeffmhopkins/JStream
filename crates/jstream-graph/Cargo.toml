[package]
name = "jstream-graph"
version = "0.0.0"
description = "The JStream scene graph: sources, scenes and items, atomic edit batches with inverses for undo, and the state revision."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.jstream]
layer = 2
summary = "Scene graph model, edit application and inverse edits (for undo), persistence and migrations. No GPU."
unsafe_allowed = false

[lints]
workspace = true

[dependencies]
# A keyframe scene's overrides and their inverses (ADR-0049 §6).
jstream-anim.workspace = true
jstream-protocol.workspace = true
# The collection file's shape (`persist/`).
serde.workspace = true
serde_json.workspace = true
# `LoadError`.
thiserror.workspace = true

[dev-dependencies]
jstream-protocol = { workspace = true, features = ["fixtures"] }
# The property suites in `tests/` (shrinking counterexamples).
proptest.workspace = true
